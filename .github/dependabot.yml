version: 2

updates:
  # Keep frontend updates scoped per application/package. Regular version
  # updates are intentionally limited to minor/patch releases; Dependabot
  # security updates are not restricted by allow.update-types.
  - package-ecosystem: npm
    directory: /frontend/apps/www
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 3
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      www-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend/apps/usaha
    schedule:
      interval: weekly
      day: monday
      time: "02:15"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 3
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      usaha-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend/apps/cms
    schedule:
      interval: weekly
      day: monday
      time: "02:30"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 2
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      cms-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend/apps/crm
    schedule:
      interval: weekly
      day: monday
      time: "02:45"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 2
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      crm-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend/packages
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 2
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      shared-frontend-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Keep Rust lock resolution isolated per service. Regular version updates are
  # patch-only because pre-1.0 minor releases can contain breaking API changes.
  # Security updates remain eligible even when they require a larger jump.
  - package-ecosystem: cargo
    directory: /services/identity_service
    schedule:
      interval: weekly
      day: monday
      time: "03:15"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 2
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
    groups:
      identity-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch

  - package-ecosystem: cargo
    directory: /services/marketplace_service
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 2
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
    groups:
      marketplace-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch

  - package-ecosystem: cargo
    directory: /services/community_service
    schedule:
      interval: weekly
      day: monday
      time: "03:45"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 2
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
    groups:
      community-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch

  - package-ecosystem: cargo
    directory: /services/ai_service
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 2
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
    groups:
      ai-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch

  - package-ecosystem: mix
    directory: /services/chat_service
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 2

  # Keep Python service dependency resolution independent. A broken OCR update
  # must not block liveness updates (and vice versa).
  - package-ecosystem: pip
    directory: /services/ocr_service
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 2

  - package-ecosystem: pip
    directory: /services/liveness_service
    schedule:
      interval: weekly
      day: monday
      time: "04:45"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 2
