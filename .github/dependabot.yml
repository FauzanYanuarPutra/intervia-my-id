version: 2

updates:
  # Keep frontend dependency PRs scoped to one application/package at a time.
  # Cross-directory grouping made a single npm hoisting issue block 27 updates.
  - package-ecosystem: npm
    directory: /frontend/apps/www
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    groups:
      www-minor-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - frontend

  - package-ecosystem: npm
    directory: /frontend/apps/usaha
    schedule:
      interval: weekly
      day: monday
      time: "02:15"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    groups:
      usaha-minor-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - frontend

  - package-ecosystem: npm
    directory: /frontend/apps/cms
    schedule:
      interval: weekly
      day: monday
      time: "02:30"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 3
    groups:
      cms-minor-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - frontend

  - package-ecosystem: npm
    directory: /frontend/apps/crm
    schedule:
      interval: weekly
      day: monday
      time: "02:45"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 3
    groups:
      crm-minor-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - frontend

  - package-ecosystem: npm
    directory: /frontend/packages
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 3
    groups:
      shared-frontend-minor-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - frontend

  # Keep Rust lock resolution isolated per service. Group only patch updates;
  # pre-1.0 minor upgrades can contain breaking API changes and should stay standalone.
  - package-ecosystem: cargo
    directory: /services/identity_service
    schedule:
      interval: weekly
      day: monday
      time: "03:15"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    groups:
      identity-patch:
        update-types:
          - patch
    labels:
      - dependencies
      - rust

  - package-ecosystem: cargo
    directory: /services/marketplace_service
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    groups:
      marketplace-patch:
        update-types:
          - patch
    labels:
      - dependencies
      - rust

  - package-ecosystem: cargo
    directory: /services/community_service
    schedule:
      interval: weekly
      day: monday
      time: "03:45"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    groups:
      community-patch:
        update-types:
          - patch
    labels:
      - dependencies
      - rust

  - package-ecosystem: cargo
    directory: /services/ai_service
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    groups:
      ai-patch:
        update-types:
          - patch
    labels:
      - dependencies
      - rust

  - package-ecosystem: mix
    directory: /services/chat_service
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - elixir

  - package-ecosystem: pip
    directories:
      - /services/ocr_service
      - /services/liveness_service
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
