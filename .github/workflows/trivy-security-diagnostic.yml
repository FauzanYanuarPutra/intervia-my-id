name: Trivy Security Diagnostic

on:
  push:
    branches: [security/rust-jwt-aws-lc-20260907]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Checkout PR merge ref
        run: |
          set -euo pipefail
          git fetch origin refs/pull/165/merge:refs/remotes/origin/pr-165-merge
          git checkout --detach refs/remotes/origin/pr-165-merge
          echo "merge_ref=$(git rev-parse HEAD)"
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514
        with:
          version: v0.70.0
          cache: false
      - name: Scan PR merge ref with fresh database
        run: trivy fs --format table --severity HIGH,CRITICAL --ignore-unfixed .
