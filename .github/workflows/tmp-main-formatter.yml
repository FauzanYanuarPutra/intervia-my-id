name: Temporary Main Formatter

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Format chat Elixir
        working-directory: services/chat_service
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix format
      - name: Format marketplace Rust
        run: cargo fmt --manifest-path services/marketplace_service/Cargo.toml
      - name: Format AI Rust
        run: cargo fmt --manifest-path services/ai_service/Cargo.toml
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/chat_service services/marketplace_service services/ai_service
          if git diff --cached --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git commit -m "style: apply formatter fixes"
          git push origin HEAD:main
