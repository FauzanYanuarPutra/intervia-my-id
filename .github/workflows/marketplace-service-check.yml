name: marketplace-service-check

on:
  push:
    branches: [main]
    paths:
      - 'services/marketplace_service/**'
      - 'config/lajukan_data_source_registry.json'
      - '.github/workflows/marketplace-service-check.yml'
  pull_request:
    paths:
      - 'services/marketplace_service/**'
      - 'config/lajukan_data_source_registry.json'
      - '.github/workflows/marketplace-service-check.yml'
    paths:
      - 'services/marketplace_service/**'
      - '.github/workflows/marketplace-service-check.yml'

permissions:
  contents: read

jobs:
  cargo-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: services/marketplace_service
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo fmt check
        run: cargo fmt --all -- --check
      - name: Cargo check
        run: cargo check --locked
      - name: Cargo test
        run: cargo test --locked
