name: marketplace-service-check

on:
  push:
    branches: [main]
    paths:
      - 'services/marketplace_service/**'
      - 'config/lajukan_data_source_registry.json'
      - '.github/workflows/marketplace-service-check.yml'
      - 'scripts/run_real_data_bootstrap.sh'
      - 'scripts/import_real_marketplace_open_data.py'
      - 'services/real_data_bootstrap/**'
  pull_request:
    paths:
      - 'services/marketplace_service/**'
      - 'config/lajukan_data_source_registry.json'
      - '.github/workflows/marketplace-service-check.yml'

permissions:
  contents: read

jobs:
  cargo-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: services/marketplace_service
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo fmt check
        run: cargo fmt --all -- --check
      - name: Cargo check
        run: cargo check --locked
      - name: Cargo test
        run: cargo test --locked
      - name: Validate real-data bootstrap script
        run: sh -n ../../scripts/run_real_data_bootstrap.sh
      - name: Validate real-data bootstrap Python
        run: python3 -m py_compile ../../scripts/import_real_marketplace_open_data.py
      - name: Validate Wikidata reference parser
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("scripts/import_real_marketplace_open_data.py")
          spec = importlib.util.spec_from_file_location("lajukan_real_data_importer", path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)

          assert module.parse_wikidata_point("Point(106.8456 -6.2088)") == (-6.2088, 106.8456)
          assert module.parse_wikidata_point("Point(181.0 -6.2088)") is None
          assert module.parse_wikidata_point("invalid") is None
          print("Wikidata coordinate parser contract: OK")
          PY
      - name: Validate real-data bootstrap tooling
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          sh -n scripts/run_real_data_bootstrap.sh
          python3 -m py_compile scripts/import_real_marketplace_open_data.py
          duplicate_versions="$(
            find services/marketplace_service/migrations -maxdepth 1 -type f -name '*.up.sql' -printf '%f\n'               | sed -n 's/^\([0-9]\{14\}\)_.*/\1/p'               | sort | uniq -d
          )"
          if [[ -n "$duplicate_versions" ]]; then
            echo "Duplicate migration versions detected:"
            printf '%s\n' "$duplicate_versions"
            exit 1
          fi
