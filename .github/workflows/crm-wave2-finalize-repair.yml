name: CRM Wave 2 Finalize Repair
on:
  push:
    branches: [feat/crm-workspace-wave2-20260907]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/crm-workspace-wave2-20260907
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/packages/package-lock.json
            frontend/apps/crm/package-lock.json
      - name: Install dependencies
        run: |
          set -euo pipefail
          cd frontend/packages && npm ci --legacy-peer-deps --no-audit --no-fund && npm run build
          cd ../apps/crm && npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Recover workspace-generation scripts with anchored shell fix
        run: |
          set -euo pipefail
          git show 4fd84a37d42dff650eddbe74c7c00666dcf41481:.github/workflows/crm-wave2-finalize.yml > /tmp/finalize-template.yml
          python - <<'PY'
          from pathlib import Path
          import textwrap
          lines=Path('/tmp/finalize-template.yml').read_text().splitlines()
          def extract(name,out):
              marker=f'- name: {name}'
              start=next(i for i,l in enumerate(lines) if l.strip()==marker)
              run=next(i for i in range(start+1,len(lines)) if lines[i].strip()=='run: |')
              body=[]
              for line in lines[run+1:]:
                  if line.startswith('      - name: '): break
                  body.append(line)
              Path(out).write_text('set -euo pipefail\n'+textwrap.dedent('\n'.join(body))+'\n')
          extract('Create remaining CRM workspaces','/tmp/create-workspaces.sh')
          extract('Replace synthetic/demo paths and old domain pages','/tmp/replace-shell.sh')
          p=Path('/tmp/replace-shell.sh')
          s=p.read_text()
          old="calc_start=s.index('  const gmvCents =');calc_end=s.index('  const operationPriorities =',calc_start);s=s[:calc_start]+s[calc_end:]"
          new="component_metrics_anchor=s.index('  const transactions = useMemo(() => normalizeTransactions(data.orders), [data.orders]);');calc_start=s.index('  const gmvCents =',component_metrics_anchor);calc_end=s.index('  const operationPriorities =',calc_start);s=s[:calc_start]+s[calc_end:]"
          if old not in s: raise SystemExit('metric cleanup transform anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
          chmod +x /tmp/create-workspaces.sh /tmp/replace-shell.sh
      - name: Recreate final workspaces
        working-directory: frontend/apps/crm
        run: /tmp/create-workspaces.sh
      - name: Apply corrected shell transform
        working-directory: frontend/apps/crm
        run: /tmp/replace-shell.sh
      - name: Verify transformed CRM
        working-directory: frontend/apps/crm
        run: |
          set -euo pipefail
          npm test
          npm run lint
          npm run typecheck
          npm run build
          test "$(grep -c 'SAMPLE_' src/components/crm/CrmCommandCenter.tsx || true)" = "0"
          test "$(grep -c 'CRM_DEMO_DATA_ENABLED' src/components/crm/CrmCommandCenter.tsx || true)" = "0"
          test "$(grep -c 'buildFunnel' src/components/crm/CrmCommandCenter.tsx || true)" = "0"
          lines=$(wc -l < src/components/crm/CrmCommandCenter.tsx)
          echo "CrmCommandCenter lines: $lines"
          test "$lines" -lt 2300
      - name: Persist final CRM workspaces
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/apps/crm/src/components/crm
          git commit -m 'refactor: complete CRM operations workspace decomposition'
          git push origin HEAD:feat/crm-workspace-wave2-20260907
