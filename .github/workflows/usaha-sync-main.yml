name: Usaha Sync Main
on:
  push:
    branches: [feature/usaha-ux-simplification-20260907]
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/usaha-ux-simplification-20260907
          fetch-depth: 0
      - name: Rebase onto latest main and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git rebase origin/main
          git rm .github/workflows/usaha-sync-main.yml
          git commit -m 'ci: remove temporary Usaha sync workflow'
          git push --force-with-lease origin HEAD:feature/usaha-ux-simplification-20260907
