name: Temporary Rustfmt Sales

on:
  push:
    branches:
      - feat/business-os-sales-cogs-20260909

permissions:
  contents: write

jobs:
  rustfmt-sales:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/business-os-sales-cogs-20260909
          fetch-depth: 0
      - name: Apply pinned rustfmt
        run: |
          rustup show
          cargo fmt --manifest-path services/marketplace_service/Cargo.toml
      - name: Commit formatted files and remove helper
        run: |
          rm .github/workflows/tmp-rustfmt-sales.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/marketplace_service/src/businesses/sales.rs \
                  services/marketplace_service/src/businesses/sales_persistence_tests.rs \
                  services/marketplace_service/src/businesses/sales_routes.rs \
                  .github/workflows/tmp-rustfmt-sales.yml
          git diff --cached --check
          git commit -m "style(usaha): apply rustfmt to sales flow"
          git push origin HEAD:feat/business-os-sales-cogs-20260909
