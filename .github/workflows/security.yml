name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 20 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  filesystem-scan:
    name: Trivy repository scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Trivy without cache
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
        with:
          version: v0.70.0
          cache: false
      - name: Scan filesystem
        shell: bash
        run: |
          set -euo pipefail
          trivy fs \
            --format sarif \
            --output trivy-results.sarif \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            .
      - name: Upload SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  rust-audit:
    name: Cargo audit / ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service:
          - identity_service
          - marketplace_service
          - community_service
          - ai_service
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - run: cargo audit

  hex-audit:
    name: Hex audit / chat_service
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/chat_service
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "26.2"
          elixir-version: "1.17.3"
      - name: Install active locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          mix deps.get
          # Remove historical lock entries that are no longer reachable from
          # mix.exs before auditing. This keeps the audit aligned with the
          # dependency graph that is actually compiled and shipped.
          mix deps.unlock --unused
          mix deps.get
      - name: Audit Hex dependencies
        shell: bash
        run: |
          set -uo pipefail
          set +e
          mix hex.audit 2>&1 | tee /tmp/hex-audit.txt
          audit_status=${PIPESTATUS[0]}
          set -e
          python - <<'PY'
          from pathlib import Path
          import re

          text = Path('/tmp/hex-audit.txt').read_text()
          ids = set(re.findall(r'EEF-CVE-\d+-\d+', text))
          allowed = {
              'EEF-CVE-2026-43966',
              'EEF-CVE-2026-43969',
              'EEF-CVE-2026-43971',
          }
          unexpected = ids - allowed
          if unexpected:
              raise SystemExit(f'unexpected Hex advisories: {sorted(unexpected)}')
          if ids and ids != allowed:
              raise SystemExit(f'known Cowlib advisory set changed; observed {sorted(ids)}')
          if ids:
              if 'cowlib 2.19.0' not in text:
                  raise SystemExit('known advisories are no longer tied to cowlib 2.19.0')
              print('Only the three known upstream Cowlib 2.19.0 advisories remain.')
          else:
              print('Hex audit is clean; no exception is currently needed.')
          PY
          if [[ "$audit_status" -ne 0 ]] && ! grep -q 'cowlib 2.19.0' /tmp/hex-audit.txt; then
            exit "$audit_status"
          fi

  npm-audit:
    name: npm production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Audit current or workspace frontend
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f frontend/package-lock.json ]]; then
            cd frontend
            npm audit --omit=dev --audit-level=high
            exit 0
          fi

          failed=0
          for dir in frontend/packages frontend/apps/www frontend/apps/usaha frontend/apps/cms frontend/apps/crm; do
            [[ -f "$dir/package-lock.json" ]] || continue
            echo "Auditing $dir"
            (cd "$dir" && npm audit --omit=dev --audit-level=high) || failed=1
          done
          exit "$failed"

  python-audit:
    name: Python dependency audit / ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [ocr_service, liveness_service]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pip-audit
      - run: pip-audit -r services/${{ matrix.service }}/requirements.txt
