name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 20 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  filesystem-scan:
    name: Trivy repository scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Trivy without cache
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
        with:
          version: v0.70.0
          cache: false
      - name: Scan filesystem
        shell: bash
        run: |
          set -euo pipefail
          trivy fs \
            --format sarif \
            --output trivy-results.sarif \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            .
      - name: Upload SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  rust-audit:
    name: Cargo audit / ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service:
          - identity_service
          - marketplace_service
          - community_service
          - ai_service
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - run: cargo audit

  hex-audit:
    name: Hex audit / chat_service
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/chat_service
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "26.2"
          elixir-version: "1.17.3"
      - name: Install active locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          mix deps.get
          # Remove historical lock entries that are no longer reachable from
          # mix.exs before auditing. This keeps the audit aligned with the
          # dependency graph that is actually compiled and shipped.
          mix deps.unlock --unused
          mix deps.get
      - name: Audit Hex dependencies
        shell: bash
        run: |
          set -uo pipefail
          set +e
          mix hex.audit 2>&1 | tee /tmp/hex-audit.txt
          audit_status=${PIPESTATUS[0]}
          set -e
          python - <<'PY'
          from pathlib import Path
          import re

          text = Path('/tmp/hex-audit.txt').read_text()
          ids = set(re.findall(r'EEF-CVE-\d+-\d+', text))
          allowed = {
              'EEF-CVE-2026-43966',
              'EEF-CVE-2026-43969',
              'EEF-CVE-2026-43971',
          }
          unexpected = ids - allowed
          if unexpected:
              raise SystemExit(f'unexpected Hex advisories: {sorted(unexpected)}')
          if ids and ids != allowed:
              raise SystemExit(f'known Cowlib advisory set changed; observed {sorted(ids)}')
          if ids:
              if 'cowlib 2.19.0' not in text:
                  raise SystemExit('known advisories are no longer tied to cowlib 2.19.0')
              print('Only the three known upstream Cowlib 2.19.0 advisories remain.')
          else:
              print('Hex audit is clean; no exception is currently needed.')
          PY
          if [[ "$audit_status" -ne 0 ]] && ! grep -q 'cowlib 2.19.0' /tmp/hex-audit.txt; then
            exit "$audit_status"
          fi

  npm-audit:
    name: npm production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Audit production dependencies via npm Bulk Advisory
        shell: bash
        run: |
          set -euo pipefail

          audit_dir() {
            local dir="$1"
            echo "::group::Auditing $dir"
            (
              cd "$dir"
              # Keep the lockfile reproducible for CI, but do not depend on
              # npm's legacy quick-audit fallback. The npm registry documents
              # Bulk Advisory as the current audit endpoint.
              npm install --package-lock-only --ignore-scripts --no-audit
              python - <<'PY'
          import gzip
          import json
          import pathlib
          import sys
          import urllib.error
          import urllib.request

          lock = json.loads(pathlib.Path("package-lock.json").read_text())
          packages = lock.get("packages", {})
          payload = {}

          for package_path, meta in packages.items():
              if not isinstance(meta, dict):
                  continue
              version = meta.get("version")
              if not version:
                  continue
              if bool(meta.get("dev")):
                  continue

              name = meta.get("name")
              if not name and package_path.startswith("node_modules/"):
                  name = package_path.split("node_modules/")[-1]
              if not name or "/" not in name and name.startswith("@"):
                  continue

              payload.setdefault(name, set()).add(version)

          payload = {name: sorted(versions) for name, versions in payload.items()}
          if not payload:
              print("No production packages found; nothing to audit.")
              raise SystemExit(0)

          body = json.dumps(payload, separators=(",", ":")).encode()
          request = urllib.request.Request(
              "https://registry.npmjs.org/-/npm/v1/security/advisories/bulk",
              data=body,
              headers={
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "User-Agent": "lajukan-security-audit/1",
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  raw = response.read()
                  status = response.status
          except urllib.error.HTTPError as exc:
              print(f"Bulk Advisory HTTP {exc.code}: {exc.reason}", file=sys.stderr)
              raise SystemExit(2)
          except Exception as exc:
              print(f"Bulk Advisory request failed: {exc}", file=sys.stderr)
              raise SystemExit(2)

          if raw[:2] == b"\x1f\x8b":
              raw = gzip.decompress(raw)

          try:
              advisories = json.loads(raw.decode("utf-8"))
          except Exception as exc:
              print(f"Invalid Bulk Advisory JSON: {exc}", file=sys.stderr)
              raise SystemExit(2)

          if status < 200 or status >= 300 or not isinstance(advisories, dict):
              print("Bulk Advisory returned an invalid response.", file=sys.stderr)
              raise SystemExit(2)

          findings = []
          for package, entries in advisories.items():
              if not isinstance(entries, list):
                  continue
              for advisory in entries:
                  if not isinstance(advisory, dict):
                      continue
                  severity = str(advisory.get("severity", "")).lower()
                  if severity in {"high", "critical"}:
                      findings.append({
                          "package": package,
                          "severity": severity,
                          "title": advisory.get("title"),
                          "url": advisory.get("url"),
                          "id": advisory.get("id"),
                      })

          if findings:
              print(json.dumps({"high_or_critical": findings}, indent=2))
              raise SystemExit(1)

          print(f"Bulk Advisory audit clean: {len(payload)} production packages checked.")
          PY
            )
            echo "::endgroup::"
          }

          if [[ -f frontend/package-lock.json ]]; then
            audit_dir frontend
            exit 0
          fi

          failed=0
          for dir in frontend/packages frontend/apps/www frontend/apps/usaha frontend/apps/cms frontend/apps/crm; do
            [[ -f "$dir/package-lock.json" ]] || continue
            audit_dir "$dir" || failed=1
          done
          exit "$failed"

  python-audit:
    name: Python dependency audit / ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [ocr_service, liveness_service]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pip-audit
      - run: pip-audit -r services/${{ matrix.service }}/requirements.txt
