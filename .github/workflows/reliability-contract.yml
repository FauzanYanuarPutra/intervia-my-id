name: Reliability Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: reliability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reliability-contract:
    name: Reliability architecture contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate repository reliability invariants
        run: python scripts/ci/check_reliability_contract.py
      - name: Parse read-only k6 scenario
        shell: bash
        run: node --input-type=module --check < scripts/load/k6-read-paths.js
