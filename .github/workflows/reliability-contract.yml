name: Reliability Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: reliability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reliability-contract:
    name: Reliability architecture contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate repository reliability invariants
        run: python scripts/ci/check_reliability_contract.py
      - name: Parse read-only k6 scenario
        shell: bash
        run: node --input-type=module --check < scripts/load/k6-read-paths.js
      - name: Validate backup scripts
        shell: bash
        run: |
          bash -n scripts/ops/postgres_logical_backup.sh
          bash -n scripts/ops/verify_backup_set.sh
      - name: Validate observability Compose contract
        env:
          IMAGE_TAG: sha-ci
          DOCKERHUB_NAMESPACE: lajukan-ci
        run: >-
          docker compose --profile observability
          --env-file .env.production.example
          -f docker-compose.yml
          -f docker-compose.prod.yml
          -f docker-compose.observability.yml
          config --quiet
