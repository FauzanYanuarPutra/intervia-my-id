name: Reliability Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: reliability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reliability-contract:
    name: Reliability architecture contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate repository reliability invariants
        run: python scripts/ci/check_reliability_contract.py
      - name: Test migration history checker
        run: python -m unittest scripts.ci.test_migration_history
      - name: Validate immutable migration history
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          else
            base="$BEFORE_SHA"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          python scripts/ci/check_migration_history.py --base "$base" --head HEAD
      - name: Parse read-only k6 scenario
        shell: bash
        run: node --input-type=module --check < scripts/load/k6-read-paths.js
      - name: Validate backup scripts
        shell: bash
        run: |
          bash -n scripts/ops/postgres_logical_backup.sh
          bash -n scripts/ops/verify_backup_set.sh
          bash -n scripts/ops/postgres_isolated_restore_drill.sh
          bash -n scripts/ci/test_postgres_restore_drill.sh
          bash -n scripts/ops/staging_scale_rehearsal.sh
          bash -n scripts/ops/dependency_degradation_rehearsal.sh
          bash -n scripts/ops/community_media_backup.sh
          bash -n scripts/ops/verify_community_media_backup.sh
          bash -n scripts/ops/requeue_marketplace_outbox_event.sh
          bash -n scripts/ops/generate_jwt_access_keypair.sh
          bash -n scripts/ops/verify_jwt_access_keypair.sh
          bash -n scripts/ops/postgres_pitr_preflight.sh
          bash -n scripts/ops/postgres_pitr_archive_evidence.sh
          bash -n scripts/load/run-capacity-baseline.sh
      - name: Exercise isolated PostgreSQL restore drill
        shell: bash
        run: bash scripts/ci/test_postgres_restore_drill.sh

      - name: Validate Grafana dashboard JSON
        run: python -m json.tool infrastructure/observability/grafana/dashboards/lajukan-overview.json >/dev/null

      - name: Validate SLO recording and burn-rate rules
        shell: bash
        run: |
          docker run --rm \
            --entrypoint promtool \
            -v "$PWD/infrastructure/observability:/etc/prometheus:ro" \
            prom/prometheus:v3.14.0 \
            check rules /etc/prometheus/slo-rules.yml

      - name: Validate Prometheus configuration and rules
        shell: bash
        run: |
          docker run --rm \
            --entrypoint promtool \
            -v "$PWD/infrastructure/observability:/etc/prometheus:ro" \
            prom/prometheus:v3.14.0 \
            check config /etc/prometheus/prometheus.yml

      - name: Validate production Caddy configuration
        shell: bash
        run: |
          docker run --rm \
            -e APP_DOMAIN=lajukan.test \
            -e ADMIN_EMAIL=ops@lajukan.test \
            -v "$PWD/infrastructure/caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Validate local and tunnel Caddy configuration
        shell: bash
        run: |
          docker run --rm \
            -e APP_DOMAIN=lajukan.test \
            -v "$PWD/infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Validate observability Compose contract
        env:
          IMAGE_TAG: sha-ci
          DOCKERHUB_NAMESPACE: lajukan-ci
        run: >-
          docker compose --profile observability
          --env-file .env.production.example
          -f docker-compose.yml
          -f docker-compose.prod.yml
          -f docker-compose.observability.yml
          config --quiet
