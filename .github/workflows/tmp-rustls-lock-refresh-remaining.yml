name: Temporary remaining rustls lock refresh

on:
  push:
    branches:
      - fix/security-history-hygiene-20260915
    paths:
      - .github/workflows/tmp-rustls-lock-refresh-remaining.yml
      - services/community_service/Cargo.lock
      - services/ai_service/Cargo.lock
      - services/marketplace_service/Cargo.lock

permissions:
  contents: write

concurrency:
  group: tmp-rustls-lock-refresh-remaining
  cancel-in-progress: false

jobs:
  refresh-locks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/security-history-hygiene-20260915
          fetch-depth: 0
      - name: Refresh vulnerable rustls lock entries only
        shell: bash
        run: |
          set -euo pipefail
          for service in community_service ai_service marketplace_service; do
            echo "Refreshing $service"
            (
              cd "services/$service"
              cargo update -p rustls --precise 0.23.45
              cargo check --locked
            )
          done
      - name: Commit generated lockfiles when changed
        shell: bash
        run: |
          set -euo pipefail
          git add \
            services/community_service/Cargo.lock \
            services/ai_service/Cargo.lock \
            services/marketplace_service/Cargo.lock
          if git diff --cached --quiet; then
            echo "All targeted lockfiles already resolve rustls 0.23.45; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(rust): update remaining rustls locks for RUSTSEC-2026-0285"
          git fetch origin fix/security-history-hygiene-20260915
          git rebase origin/fix/security-history-hygiene-20260915
          git push origin HEAD:fix/security-history-hygiene-20260915
