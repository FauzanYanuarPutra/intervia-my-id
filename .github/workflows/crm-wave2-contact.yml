name: CRM Wave 2 Contact
on:
  push:
    branches: [feat/crm-workspace-wave2-20260907]
permissions:
  contents: write
jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/crm-workspace-wave2-20260907
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/packages/package-lock.json
            frontend/apps/crm/package-lock.json
      - name: Install and build dependencies
        run: |
          set -euo pipefail
          cd frontend/packages && npm ci --legacy-peer-deps --no-audit --no-fund && npm run build
          cd ../apps/crm && npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Prove Contact 360 contract RED
        working-directory: frontend/apps/crm
        run: |
          set -euo pipefail
          cat > src/components/crm/__tests__/contact360.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';
          import { buildContact360 } from '../contact360';
          const user={id:'u1',name:'Usaha A',handle:'@a',role:'Seller' as const,kyc:'Verified' as const,approvalStatus:'approved',manualHold:false,riskStrikes:0,transactions:1,gmvCents:100,lastActive:'2026-09-01',risk:'low' as const,city:'Bandung'};
          describe('buildContact360',()=>{
            it('keeps missing authorized source data absent instead of synthesizing it',()=>{
              const result=buildContact360({user,listings:[],orders:[],tickets:[],trustProfile:null});
              expect(result.user.id).toBe('u1');
              expect(result.listings).toEqual([]);
              expect(result.orders).toEqual([]);
              expect(result.support).toEqual([]);
              expect(result.trust).toBeNull();
            });
            it('only includes records tied to the selected user',()=>{
              const result=buildContact360({
                user,
                listings:[{id:'l1',title:'Owned',category:'Jasa',priceCents:0,currency:'IDR',location:'Bandung',status:'active',rawStatus:'active',image:'',ownerId:'u1',featured:false,updatedAt:'',metadata:{},reportCount:0,reporters:[],reportReasons:[],reportTicketIds:[],moderationStatus:'normal'},{id:'l2',title:'Other',category:'Jasa',priceCents:0,currency:'IDR',location:'Jakarta',status:'active',rawStatus:'active',image:'',ownerId:'u2',featured:false,updatedAt:'',metadata:{},reportCount:0,reporters:[],reportReasons:[],reportTicketIds:[],moderationStatus:'normal'}],
                orders:[{id:'o1',requester_id:'u1',partner_id:'u2',merchant_id:null,provider_id:'u2',service_type:'service',status:'completed',payment_mode:'escrow',currency:'IDR',amount_estimate_cents:100,amount_final_cents:100,pickup_address:null,pickup_lat:null,pickup_lng:null,dropoff_address:null,dropoff_lat:null,dropoff_lng:null,risk_score:0,risk_flags:[],metadata:{},created_at:'',updated_at:''},{id:'o2',requester_id:'u3',partner_id:'u4',merchant_id:null,provider_id:'u4',service_type:'service',status:'completed',payment_mode:'escrow',currency:'IDR',amount_estimate_cents:100,amount_final_cents:100,pickup_address:null,pickup_lat:null,pickup_lng:null,dropoff_address:null,dropoff_lat:null,dropoff_lng:null,risk_score:0,risk_flags:[],metadata:{},created_at:'',updated_at:''}],
                tickets:[],trustProfile:null
              });
              expect(result.listings.map(x=>x.id)).toEqual(['l1']);
              expect(result.orders.map(x=>x.id)).toEqual(['o1']);
            });
          });
          EOF
          if npm test -- src/components/crm/__tests__/contact360.test.ts; then
            echo 'Expected Contact 360 test to be RED before implementation' >&2
            exit 1
          fi
      - name: Extract domain models and Contact 360 workspace
        working-directory: frontend/apps/crm
        run: |
          set -euo pipefail
          cat > src/components/crm/models.ts <<'EOF'
          export type UnknownRecord = Record<string, unknown>;
          export type CrmKpi={label:string;value:string;note:string;trend:string;tone:'green'|'blue'|'amber'|'rose'};
          export type ChartPoint={label:string;value:number};
          export type CrmUserRow={id:string;name:string;handle:string;role:'Buyer'|'Seller'|'Talent'|'Admin';kyc:'Verified'|'Pending'|'Rejected';approvalStatus:string;manualHold:boolean;riskStrikes:number;transactions:number;gmvCents:number;lastActive:string;risk:'low'|'medium'|'high';city:string};
          export type CrmListingRow={id:string;title:string;category:string;priceCents:number;currency:string;location:string;status:'active'|'pending'|'rejected'|'draft';rawStatus:string;image:string;ownerId:string;featured:boolean;updatedAt:string;metadata:UnknownRecord;reportCount:number;reporters:string[];reportReasons:string[];reportTicketIds:string[];moderationStatus:string};
          export type CrmTransactionRow={id:string;buyer:string;seller:string;amountCents:number;status:string;serviceType:string;riskScore:number;updatedAt:string};
          export type CrmChatRow={id:string;name:string;lastMessage:string;stage:'Hot'|'Warm'|'Cold';source:string;listingTitle:string;updatedAt:string;unread:number};
          export type CrmActivityRow={id:string;title:string;body:string;type:'user'|'listing'|'chat'|'transaction'|'dispute'|'done';at:string};
          export type CrmInsight={title:string;body:string;tone:'green'|'blue'|'amber'};
          EOF
          cat > src/components/crm/contact360.ts <<'EOF'
          import type { SuperAppOrder, SuperAppTrustProfile, SupportTicket } from '@/lib/api';
          import type { CrmListingRow, CrmUserRow } from './models';
          export type AuthorizedContactSources={user:CrmUserRow;listings:CrmListingRow[];orders:SuperAppOrder[];tickets:SupportTicket[];trustProfile:SuperAppTrustProfile|null};
          export type Contact360Model={user:CrmUserRow;listings:CrmListingRow[];orders:SuperAppOrder[];support:SupportTicket[];trust:SuperAppTrustProfile|null};
          export function buildContact360(input:AuthorizedContactSources):Contact360Model{
            const id=input.user.id;
            return {
              user:input.user,
              listings:input.listings.filter(item=>item.ownerId===id),
              orders:input.orders.filter(order=>[order.requester_id,order.partner_id,order.merchant_id,order.provider_id].includes(id)),
              support:input.tickets.filter(ticket=>ticket.requester_user_id===id),
              trust:input.trustProfile?.user_id===id?input.trustProfile:null,
            };
          }
          EOF
          cat > src/components/crm/ContactDetail.tsx <<'EOF'
          'use client';
          import { Card, EmptyState, StatusBadge } from 'lajukan-ui';
          import type { Contact360Model } from './contact360';
          function money(cents:number){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Math.max(0,cents)/100)}
          export function ContactDetail({model}:{model:Contact360Model}){
            const u=model.user;
            return <div className="grid gap-4 xl:grid-cols-2">
              <Card className="p-5"><div className="flex flex-wrap items-center gap-2"><h2 className="text-lg font-bold">{u.name}</h2><StatusBadge tone={u.kyc==='Verified'?'success':u.kyc==='Rejected'?'danger':'warning'}>{u.kyc}</StatusBadge><StatusBadge tone={u.risk==='high'?'danger':u.risk==='medium'?'warning':'success'}>{u.risk}</StatusBadge></div><p className="mt-2 text-sm text-[color:var(--color-text-soft)]">{u.handle} · {u.role} · {u.city}</p><dl className="mt-4 grid grid-cols-2 gap-3 text-sm"><div><dt className="text-[color:var(--color-text-soft)]">Transaksi</dt><dd className="font-bold">{u.transactions}</dd></div><div><dt className="text-[color:var(--color-text-soft)]">GMV</dt><dd className="font-bold">{money(u.gmvCents)}</dd></div><div><dt className="text-[color:var(--color-text-soft)]">Risk strike</dt><dd className="font-bold">{u.riskStrikes}</dd></div><div><dt className="text-[color:var(--color-text-soft)]">Manual hold</dt><dd className="font-bold">{u.manualHold?'Aktif':'Tidak'}</dd></div></dl></Card>
              <Card className="p-5"><h3 className="font-bold">Riwayat yang tersedia</h3><div className="mt-4 grid gap-2 text-sm"><p>{model.listings.length} listing</p><p>{model.orders.length} order</p><p>{model.support.length} tiket support</p><p>{model.trust?'Trust profile tersedia':'Trust profile belum tersedia'}</p></div>{!model.listings.length&&!model.orders.length&&!model.support.length&&!model.trust?<EmptyState className="mt-4" title="Belum ada riwayat terkait" description="CRM tidak membuat data pengganti ketika sumber belum tersedia."/>:null}</Card>
            </div>;
          }
          EOF
          cat > src/components/crm/ContactWorkspace.tsx <<'EOF'
          'use client';
          import { useMemo, useState } from 'react';
          import { Card, EmptyState, PageHeader, StatusBadge } from 'lajukan-ui';
          import type { SuperAppOrder, SuperAppTrustProfile, SupportTicket } from '@/lib/api';
          import type { CrmListingRow, CrmUserRow } from './models';
          import { buildContact360 } from './contact360';
          import { ContactDetail } from './ContactDetail';
          export function ContactWorkspace({users,listings,orders,tickets,trustProfiles,onTrustAction}:{users:CrmUserRow[];listings:CrmListingRow[];orders:SuperAppOrder[];tickets:SupportTicket[];trustProfiles:SuperAppTrustProfile[];onTrustAction:(user:CrmUserRow,action:'approve'|'reject'|'warn'|'hold'|'release')=>void}){
            const [selectedId,setSelectedId]=useState<string|null>(null); const [query,setQuery]=useState('');
            const filtered=useMemo(()=>{const q=query.trim().toLowerCase();return q?users.filter(u=>`${u.name} ${u.handle} ${u.role} ${u.city}`.toLowerCase().includes(q)):users},[users,query]);
            const selected=users.find(u=>u.id===selectedId)||null;
            const model=selected?buildContact360({user:selected,listings,orders,tickets,trustProfile:trustProfiles.find(t=>t.user_id===selected.id)||null}):null;
            return <div className="space-y-5"><PageHeader title="Kontak & User" description="Cari user, cek KYC/trust, lalu lihat Customer 360 hanya dari sumber yang memang tersedia."/><input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Cari nama, handle, role, atau kota" className="min-h-11 w-full rounded-2xl border border-[color:var(--color-border)] bg-[color:var(--color-surface)] px-4 text-sm outline-none focus:ring-4 focus:ring-emerald-100"/>
              <div className="grid gap-3 md:grid-cols-2 xl:grid-cols-3">{filtered.map(u=><Card key={u.id} className="p-4"><button type="button" onClick={()=>setSelectedId(u.id)} className="w-full text-left"><div className="flex items-start justify-between gap-2"><div><p className="font-bold">{u.name}</p><p className="text-xs text-[color:var(--color-text-soft)]">{u.handle} · {u.city}</p></div><StatusBadge tone={u.risk==='high'?'danger':u.risk==='medium'?'warning':'success'}>{u.risk}</StatusBadge></div></button><div className="mt-3 flex flex-wrap gap-2"><button onClick={()=>onTrustAction(u,'approve')} className="rounded-xl bg-emerald-600 px-3 py-2 text-xs font-bold text-white">Approve</button><button onClick={()=>onTrustAction(u,'reject')} className="rounded-xl border border-rose-200 px-3 py-2 text-xs font-bold text-rose-700">Reject</button><button onClick={()=>onTrustAction(u,u.manualHold?'release':'hold')} className="rounded-xl border border-[color:var(--color-border)] px-3 py-2 text-xs font-bold">{u.manualHold?'Lepas hold':'Hold'}</button></div></Card>)}</div>
              {!filtered.length?<EmptyState title="Tidak ada user yang cocok" description="Ubah pencarian atau tunggu data real masuk dari API."/>:null}{model?<ContactDetail model={model}/>:null}
            </div>;
          }
          EOF
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/crm/CrmCommandCenter.tsx');s=p.read_text()
          type_start=s.index('type CrmKpi =')
          type_end=s.index('\ntype TrustProfileUpdatePayload',type_start)
          s=s[:type_start]+"import type { ChartPoint, CrmActivityRow, CrmChatRow, CrmInsight, CrmKpi, CrmListingRow, CrmTransactionRow, CrmUserRow, UnknownRecord } from './models';\n\n"+s[type_end:]
          anchor='import { PipelineWorkspace } from "./PipelineWorkspace";\n'
          s=s.replace(anchor,anchor+'import { ContactWorkspace } from "./ContactWorkspace";\n',1)
          old='{activePage === "users" ? (\n                <UsersPage users={filteredData.users} onTrustAction={handleUserTrustAction} />\n              ) : null}'
          new='{activePage === "users" ? (\n                <ContactWorkspace users={filteredData.users} listings={filteredData.listings} orders={data.orders} tickets={data.tickets} trustProfiles={data.trustProfiles} onTrustAction={handleUserTrustAction} />\n              ) : null}'
          if old not in s: raise SystemExit('users route anchor not found')
          s=s.replace(old,new,1)
          start=s.index('function UsersPage(')
          end=s.index('\nfunction ListingsPage(',start)
          s=s[:start]+s[end+1:]
          p.write_text(s)
          PY
      - name: Verify Contact workspace GREEN
        working-directory: frontend/apps/crm
        run: |
          set -euo pipefail
          npm test -- src/components/crm/__tests__/navigation.test.ts src/components/crm/__tests__/operationsPriority.test.ts src/components/crm/__tests__/pipeline.test.ts src/components/crm/__tests__/contact360.test.ts
          npm run lint
          npm run typecheck
          npm run build
      - name: Persist verified Contact workspace
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/apps/crm/src/components/crm/models.ts frontend/apps/crm/src/components/crm/contact360.ts frontend/apps/crm/src/components/crm/ContactDetail.tsx frontend/apps/crm/src/components/crm/ContactWorkspace.tsx frontend/apps/crm/src/components/crm/__tests__/contact360.test.ts frontend/apps/crm/src/components/crm/CrmCommandCenter.tsx
          git commit -m 'feat: add authorized CRM contact 360 workspace'
          git push origin HEAD:feat/crm-workspace-wave2-20260907
