name: Temporary Chat Autofmt

on:
  push:
    branches: [fix/chat-format-20260906]
    paths:
      - '.github/workflows/tmp-chat-autofmt.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/chat-format-20260906
          fetch-depth: 0
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '26.2'
          elixir-version: '1.17.3'
      - name: Install test dependencies
        working-directory: services/chat_service
        env:
          MIX_ENV: test
        run: mix deps.get --only test
      - name: Format chat
        working-directory: services/chat_service
        run: mix format
      - name: Verify formatter
        working-directory: services/chat_service
        run: mix format --check-formatted
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- services/chat_service; then
            echo 'No formatter changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/chat_service
          git commit -m 'style: format chat service'
          git push origin HEAD:fix/chat-format-20260906
