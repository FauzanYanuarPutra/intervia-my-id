name: Temporary PR 303 React lint fixes

on:
  push:
    branches:
      - feat/usaha-storefront-interaction-system
    paths:
      - '.github/workflows/tmp-fix-pr303-lint.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/usaha-storefront-interaction-system
          fetch-depth: 0
      - name: Apply targeted React 19 lint fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly 1 match, found {count}')
              p.write_text(text.replace(old, new, 1))

          ledger = 'frontend/apps/usaha/src/components/business-control/FinanceLedgerV2.tsx'
          replace_once(
              ledger,
              '''  useEffect(() => {\n    reloadAll(true).catch(() => {\n      // Initial server data remains a safe fallback if Finance Core is temporarily unavailable.\n    });\n    // businessId is stable for this page instance.\n    // eslint-disable-next-line react-hooks/exhaustive-deps\n  }, [businessId]);''',
              '''  useEffect(() => {\n    let cancelled = false;\n\n    async function loadInitialSnapshot() {\n      try {\n        const [historyResponse, summaryResponse] = await Promise.all([\n          fetch(`/api/businesses/${businessId}/finance-core/entries`, { cache: 'no-store' }),\n          fetch(`/api/businesses/${businessId}/finance-core/summary`, { cache: 'no-store' }),\n        ]);\n        const historyPayload = await historyResponse.json().catch(() => ({}));\n        const summaryPayload = await summaryResponse.json().catch(() => ({}));\n        if (!historyResponse.ok || !summaryResponse.ok || cancelled) return;\n        setEntries(Array.isArray(historyPayload?.data?.items) ? historyPayload.data.items : []);\n        setSummary(summaryPayload?.data?.summary ?? null);\n      } catch {\n        // Initial server data remains a safe fallback if Finance Core is temporarily unavailable.\n      }\n    }\n\n    void loadInitialSnapshot();\n    return () => {\n      cancelled = true;\n    };\n  }, [businessId]);''',
          )

          planning = 'frontend/apps/usaha/src/components/business-control/FinancePlanningWorkspaceV2.tsx'
          replace_once(
              planning,
              "import { useEffect, useMemo, useState } from 'react';",
              "import { useEffect, useState } from 'react';",
          )
          replace_once(
              planning,
              '''  const sortedObligations = useMemo(\n    () => [...activeObligations].sort((a, b) => a.next_due_on.localeCompare(b.next_due_on)),\n    [activeObligations],\n  );''',
              '''  const sortedObligations = [...activeObligations].sort((a, b) =>\n    a.next_due_on.localeCompare(b.next_due_on),\n  );''',
          )
          replace_once(
              planning,
              '''  useEffect(() => {\n    reloadFinanceCore().catch(() => {\n      // Page stays usable for planning if the authoritative summary is temporarily unavailable.\n    });\n    // eslint-disable-next-line react-hooks/exhaustive-deps\n  }, [businessId]);''',
              '''  useEffect(() => {\n    let cancelled = false;\n\n    fetch(`/api/businesses/${businessId}/finance-core/summary`, { cache: 'no-store' })\n      .then(async response => {\n        const payload = await response.json().catch(() => ({}));\n        if (!response.ok) throw new Error(payload?.error || 'Gagal memuat saldo authoritative.');\n        return payload?.data?.summary ?? null;\n      })\n      .then(nextSummary => {\n        if (!cancelled) setSummary(nextSummary);\n      })\n      .catch(() => {\n        // Page stays usable for planning if the authoritative summary is temporarily unavailable.\n      });\n\n    return () => {\n      cancelled = true;\n    };\n  }, [businessId]);''',
          )

          modifiers = 'frontend/apps/usaha/src/components/forms/ProductModifierEditor.tsx'
          replace_once(
              modifiers,
              "import { useEffect, useMemo, useState } from 'react';",
              "import { useMemo, useState } from 'react';",
          )
          replace_once(
              modifiers,
              '''  useEffect(() => {\n    if (!expanded || loaded || loading) return;\n    let alive = true;\n    setLoading(true);\n    fetch(`/api/businesses/${businessId}/products/${productId}/modifiers`, { cache: 'no-store' })\n      .then(async response => {\n        const body = (await response.json().catch(() => ({}))) as {\n          data?: { groups?: ModifierGroup[] };\n          error?: string;\n        };\n        if (!response.ok) throw new Error(body.error || 'Pilihan produk belum bisa dimuat.');\n        if (alive) {\n          setGroups(Array.isArray(body.data?.groups) ? body.data.groups : []);\n          setLoaded(true);\n        }\n      })\n      .catch(value => alive && setError(value instanceof Error ? value.message : 'Pilihan produk belum bisa dimuat.'))\n      .finally(() => alive && setLoading(false));\n    return () => {\n      alive = false;\n    };\n  }, [businessId, expanded, loaded, loading, productId]);''',
              '''  async function loadGroups() {\n    if (loaded || loading) return;\n    setLoading(true);\n    setError('');\n    try {\n      const response = await fetch(`/api/businesses/${businessId}/products/${productId}/modifiers`, {\n        cache: 'no-store',\n      });\n      const body = (await response.json().catch(() => ({}))) as {\n        data?: { groups?: ModifierGroup[] };\n        error?: string;\n      };\n      if (!response.ok) throw new Error(body.error || 'Pilihan produk belum bisa dimuat.');\n      setGroups(Array.isArray(body.data?.groups) ? body.data.groups : []);\n      setLoaded(true);\n    } catch (value) {\n      setError(value instanceof Error ? value.message : 'Pilihan produk belum bisa dimuat.');\n    } finally {\n      setLoading(false);\n    }\n  }\n\n  function toggleExpanded() {\n    const nextExpanded = !expanded;\n    setExpanded(nextExpanded);\n    if (nextExpanded && !loaded && !loading) void loadGroups();\n  }''',
          )
          replace_once(
              modifiers,
              '        onClick={() => setExpanded(value => !value)}',
              '        onClick={toggleExpanded}',
          )

      - name: Verify targeted lint scope
        working-directory: frontend/apps/usaha
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          npx eslint src/components/business-control/FinanceLedgerV2.tsx src/components/business-control/FinancePlanningWorkspaceV2.tsx src/components/forms/ProductModifierEditor.tsx
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/apps/usaha/src/components/business-control/FinanceLedgerV2.tsx \
                  frontend/apps/usaha/src/components/business-control/FinancePlanningWorkspaceV2.tsx \
                  frontend/apps/usaha/src/components/forms/ProductModifierEditor.tsx
          git commit -m "fix(usaha): satisfy React compiler lint rules"
          git push origin HEAD:feat/usaha-storefront-interaction-system
