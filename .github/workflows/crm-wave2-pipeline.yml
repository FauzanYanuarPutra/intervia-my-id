name: CRM Wave 2 Pipeline
on:
  push:
    branches: [feat/crm-workspace-wave2-20260907]
permissions:
  contents: write
jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/crm-workspace-wave2-20260907
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/packages/package-lock.json
            frontend/apps/crm/package-lock.json
      - name: Build shared UI and install CRM
        run: |
          set -euo pipefail
          cd frontend/packages && npm ci --legacy-peer-deps --no-audit --no-fund && npm run build
          cd ../apps/crm && npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Prove pipeline contract RED
        working-directory: frontend/apps/crm
        run: |
          set -euo pipefail
          cat > src/components/crm/__tests__/pipeline.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';
          import { groupPipelineStage, PIPELINE_COLUMNS } from '../pipeline';
          describe('CRM pipeline', () => {
            it('maps API stages into stable operator columns', () => {
              expect(groupPipelineStage('lead')).toBe('new');
              expect(groupPipelineStage('qualified')).toBe('interested');
              expect(groupPipelineStage('negotiation')).toBe('negotiation');
              expect(groupPipelineStage('won')).toBe('completed');
            });
            it('keeps the operator column order stable', () => {
              expect(PIPELINE_COLUMNS.map(column => column.id)).toEqual(['new','interested','negotiation','locked','completed']);
            });
          });
          EOF
          if npm test -- src/components/crm/__tests__/pipeline.test.ts; then
            echo 'Expected pipeline test RED before extraction' >&2
            exit 1
          fi
      - name: Extract pipeline workspace
        working-directory: frontend/apps/crm
        run: |
          set -euo pipefail
          cat > src/components/crm/pipeline.ts <<'EOF'
          export type PipelineColumnId = 'new' | 'interested' | 'negotiation' | 'locked' | 'completed';
          export const PIPELINE_COLUMNS = [
            { id: 'new', label: 'Lead Baru', help: 'Baru masuk dari listing/chat' },
            { id: 'interested', label: 'Tertarik', help: 'Butuh follow-up agent' },
            { id: 'negotiation', label: 'Negosiasi', help: 'Harga dan scope dibahas' },
            { id: 'locked', label: 'Escrow', help: 'Deal mulai dikunci' },
            { id: 'completed', label: 'Selesai', help: 'Deal sukses' },
          ] as const;
          export function groupPipelineStage(stage: string): PipelineColumnId {
            const value=stage.trim().toLowerCase();
            if (['won','completed','done','closed_won'].includes(value)) return 'completed';
            if (['locked','escrow','deal','contract'].includes(value)) return 'locked';
            if (['negotiation','negotiating','proposal'].includes(value)) return 'negotiation';
            if (['qualified','interested','contacted','follow_up'].includes(value)) return 'interested';
            return 'new';
          }
          EOF
          cat > src/components/crm/PipelineWorkspace.tsx <<'EOF'
          'use client';
          import { Card, EmptyState, PageHeader, StatusBadge } from 'lajukan-ui';
          import type { CrmLead } from '@/lib/api';
          import { groupPipelineStage, PIPELINE_COLUMNS } from './pipeline';
          function text(value: unknown): string { return typeof value === 'string' ? value : ''; }
          function money(cents: number, currency='IDR'): string { return new Intl.NumberFormat('id-ID',{style:'currency',currency,maximumFractionDigits:0}).format(Math.max(0,cents)/100); }
          function date(value: string): string { const parsed=new Date(value); return Number.isNaN(parsed.getTime()) ? '-' : new Intl.DateTimeFormat('id-ID',{day:'2-digit',month:'short',year:'numeric'}).format(parsed); }
          export function PipelineWorkspace({leads}:{leads:CrmLead[]}) {
            return <div className="space-y-5">
              <div className="space-y-2"><p className="text-xs font-bold uppercase tracking-[0.16em] text-emerald-700">CRM Pipeline</p><PageHeader title="Follow-up prospek sampai jadi deal." description="Bahasa dibuat sederhana agar agent langsung tahu siapa yang harus dihubungi dulu." /></div>
              <div className="grid gap-4 xl:grid-cols-5">
                {PIPELINE_COLUMNS.map(column=>{const items=leads.filter(lead=>groupPipelineStage(lead.stage)===column.id);return <Card key={column.id} className="min-h-[420px] p-3">
                  <div className="mb-3 rounded-2xl bg-[color:var(--color-surface-muted)] p-3"><div className="flex items-center justify-between"><p className="text-sm font-bold">{column.label}</p><StatusBadge tone={column.id==='completed'?'success':'neutral'}>{items.length}</StatusBadge></div><p className="mt-1 text-xs text-[color:var(--color-text-soft)]">{column.help}</p></div>
                  <div className="space-y-3">{items.map(lead=><div key={lead.id} className="rounded-2xl border border-[color:var(--color-border)] bg-[color:var(--color-surface)] p-3 shadow-sm"><div className="flex items-start justify-between gap-2"><p className="line-clamp-2 text-sm font-bold">{lead.requester_name||lead.name}</p>{column.id==='negotiation'||column.id==='locked'?<StatusBadge tone="warning">Hot Lead</StatusBadge>:null}</div><p className="mt-2 line-clamp-2 text-xs leading-5 text-[color:var(--color-text-soft)]">{text(lead.metadata?.listing_title)||lead.sector||'Listing yang dilihat'}</p><div className="mt-3 flex items-center justify-between text-xs"><span className="font-bold text-emerald-700">{money(lead.value_cents||0,lead.currency||'IDR')}</span><span className="text-[color:var(--color-text-soft)]">{date(lead.updated_at)}</span></div></div>)}{!items.length?<EmptyState title="Kosong" description="Belum ada lead di tahap ini." />:null}</div>
                </Card>})}
              </div>
            </div>;
          }
          EOF
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/crm/CrmCommandCenter.tsx');s=p.read_text()
          anchor='import { OperationsPriorityPanel } from "./OperationsPriorityPanel";\n'
          s=s.replace(anchor,anchor+'import { PipelineWorkspace } from "./PipelineWorkspace";\n',1)
          s=s.replace('{activePage === "pipeline" ? <PipelinePage leads={filteredData.leads} /> : null}','{activePage === "pipeline" ? <PipelineWorkspace leads={filteredData.leads} /> : null}',1)
          start=s.index('function PipelinePage(')
          end=s.index('\nfunction UsersPage(',start)
          s=s[:start]+s[end+1:]
          p.write_text(s)
          PY
      - name: Verify CRM pipeline GREEN
        working-directory: frontend/apps/crm
        run: |
          set -euo pipefail
          npm test -- src/components/crm/__tests__/navigation.test.ts src/components/crm/__tests__/operationsPriority.test.ts src/components/crm/__tests__/pipeline.test.ts
          npm run lint
          npm run typecheck
          npm run build
      - name: Persist verified pipeline extraction
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/apps/crm/src/components/crm/pipeline.ts frontend/apps/crm/src/components/crm/PipelineWorkspace.tsx frontend/apps/crm/src/components/crm/__tests__/pipeline.test.ts frontend/apps/crm/src/components/crm/CrmCommandCenter.tsx
          git commit -m 'refactor: extract CRM pipeline workspace'
          git push origin HEAD:feat/crm-workspace-wave2-20260907
