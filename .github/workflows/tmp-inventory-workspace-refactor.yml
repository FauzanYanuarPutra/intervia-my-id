name: Temporary inventory workspace refactor

on:
  push:
    branches:
      - fix/inventory-simplify-20260915
    paths:
      - .github/workflows/tmp-inventory-workspace-refactor.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/inventory-simplify-20260915
          fetch-depth: 0
      - name: Apply deterministic workspace refactor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/apps/usaha/src/components/business-control/IngredientWorkspace.tsx')
          source = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected one marker, found {count}: {old[:80]!r}')
              source = source.replace(old, new, 1)

          replace_once('  ChevronDown,\n', '')
          replace_once(
              "  needsIngredientPurchase,\n  type IngredientFilter,",
              "  needsIngredientPurchase,\n  suggestIngredientUnits,\n  type IngredientFilter,",
          )
          replace_once(
              "const kindLabels: Record<string, string> = {",
              "const quantityNumber = new Intl.NumberFormat('id-ID', {\n  maximumFractionDigits: 4,\n});\n\nconst kindLabels: Record<string, string> = {",
          )
          replace_once(
              "  const [message, setMessage] = useState('');\n",
              "  const [message, setMessage] = useState('');\n  const [createStep, setCreateStep] = useState<1 | 2 | 3>(1);\n",
          )
          replace_once(
              "  async function reload() {",
              "  function updatePurchaseUnit(value: string) {\n    setPurchaseUnit(value);\n    const suggestion = suggestIngredientUnits(value);\n    setRecipeUnit(suggestion.recipeUnit);\n    setConversionFactor(String(suggestion.conversionFactor));\n  }\n\n  async function reload() {",
          )
          replace_once(
              "      setName('');\n      setPurchasePrice('');\n      setSupplier('');",
              "      setName('');\n      setKind('ingredient');\n      setPurchaseUnit('kg');\n      setRecipeUnit('gram');\n      setConversionFactor('1000');\n      setPurchasePrice('');\n      setPurchaseQuantity('1');\n      setYieldPercent('100');\n      setWastePercent('0');\n      setStockQuantity('0');\n      setMinimumStock('0');\n      setSupplier('');\n      setCreateStep(1);",
          )

          start_marker = '      <details className="rounded-xl border border-portal-line bg-white group">'
          end_marker = '      {!canManage ? ('
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          new_segment = r'''      <section className="overflow-hidden rounded-xl border border-portal-line bg-white">
        <div className="border-b border-portal-line p-4 sm:p-5">
          <div className="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
            <div>
              <p className="font-bold text-portal-ink">Tambah bahan atau kemasan baru</p>
              <p className="mt-0.5 text-xs text-portal-soft">
                Isi yang penting dulu. Satuan resep dan konversi umum dihitung otomatis.
              </p>
            </div>
            <p className="rounded-full bg-portal-mist px-3 py-1.5 text-xs font-semibold text-portal-forest">
              1 {purchaseUnit || 'unit'} = {quantityNumber.format(n(conversionFactor) || 1)} {recipeUnit || 'unit'} · otomatis
            </p>
          </div>

          <div className="mt-4 grid grid-cols-3 gap-2" aria-label="Langkah tambah bahan">
            {([
              [1, '1. Bahan'],
              [2, '2. Harga & satuan'],
              [3, '3. Stok & supplier'],
            ] as const).map(([step, label]) => (
              <button
                key={step}
                type="button"
                onClick={() => setCreateStep(step)}
                className={`min-h-10 rounded-xl border px-2 text-[11px] font-bold sm:text-xs ${
                  createStep === step
                    ? 'border-portal-forest bg-portal-forest text-white'
                    : 'border-portal-line bg-white text-portal-soft'
                }`}
              >
                {label}
              </button>
            ))}
          </div>
        </div>

        <div className="p-4 sm:p-5">
          {createStep === 1 ? (
            <div className="grid gap-4 lg:grid-cols-[minmax(0,1fr)_minmax(280px,0.8fr)]">
              <label className="text-xs font-semibold text-portal-soft">
                Nama bahan / kemasan
                <input
                  className="mt-1 min-h-12 w-full rounded-xl border border-portal-line px-3 text-sm text-portal-ink"
                  placeholder="Contoh: Alpukat, Cup 16 oz"
                  value={name}
                  onChange={event => setName(event.target.value)}
                  autoFocus
                />
              </label>
              <div>
                <p className="text-xs font-semibold text-portal-soft">Jenis</p>
                <div className="mt-1 grid grid-cols-2 gap-2 sm:grid-cols-3 lg:grid-cols-2">
                  {([
                    ['ingredient', 'Bahan'],
                    ['packaging', 'Kemasan'],
                    ['semi_finished', 'Bahan olahan'],
                    ['utility', 'Utilitas'],
                  ] as const).map(([value, label]) => (
                    <button
                      key={value}
                      type="button"
                      onClick={() => setKind(value)}
                      className={`min-h-11 rounded-xl border px-3 text-sm font-semibold ${
                        kind === value
                          ? 'border-portal-forest bg-portal-mist text-portal-forest'
                          : 'border-portal-line bg-white text-portal-soft'
                      }`}
                    >
                      {label}
                    </button>
                  ))}
                </div>
                <button
                  type="button"
                  onClick={() => setKind('labor')}
                  className={`mt-2 text-xs font-semibold ${kind === 'labor' ? 'text-portal-forest' : 'text-portal-soft'}`}
                >
                  {kind === 'labor' ? '✓ ' : ''}Tenaga langsung
                </button>
              </div>
            </div>
          ) : null}

          {createStep === 2 ? (
            <div className="space-y-4">
              <div className="grid gap-3 sm:grid-cols-3">
                <label className="text-xs font-semibold text-portal-soft">
                  Harga beli
                  <input
                    type="number"
                    min="0"
                    className="mt-1 min-h-12 w-full rounded-xl border border-portal-line px-3 text-sm text-portal-ink"
                    placeholder="34000"
                    value={purchasePrice}
                    onChange={event => setPurchasePrice(event.target.value)}
                  />
                </label>
                <label className="text-xs font-semibold text-portal-soft">
                  Jumlah dibeli
                  <input
                    type="number"
                    step="any"
                    min="0.0001"
                    className="mt-1 min-h-12 w-full rounded-xl border border-portal-line px-3 text-sm text-portal-ink"
                    value={purchaseQuantity}
                    onChange={event => setPurchaseQuantity(event.target.value)}
                  />
                </label>
                <label className="text-xs font-semibold text-portal-soft">
                  Satuan beli
                  <input
                    className="mt-1 min-h-12 w-full rounded-xl border border-portal-line px-3 text-sm text-portal-ink"
                    value={purchaseUnit}
                    onChange={event => updatePurchaseUnit(event.target.value)}
                    placeholder="kg, liter, pcs, lusin"
                  />
                </label>
              </div>

              <div className="rounded-xl border border-emerald-200 bg-emerald-50 p-3 text-sm text-emerald-900">
                <p className="font-bold">Konversi otomatis</p>
                <p className="mt-1 text-xs leading-5">
                  1 {purchaseUnit || 'unit'} = {quantityNumber.format(n(conversionFactor) || 1)} {recipeUnit || 'unit'}.
                  Angka ini dipakai untuk stok dan HPP supaya kamu tidak perlu menghitung manual.
                </p>
              </div>

              <details className="rounded-xl border border-portal-line bg-white p-3">
                <summary className="cursor-pointer text-xs font-bold text-portal-soft">
                  Atur satuan manual
                </summary>
                <div className="mt-3 grid gap-3 sm:grid-cols-2">
                  <label className="text-xs font-semibold text-portal-soft">
                    Satuan resep / stok
                    <input
                      className="mt-1 min-h-11 w-full rounded-xl border border-portal-line px-3 text-sm text-portal-ink"
                      value={recipeUnit}
                      onChange={event => setRecipeUnit(event.target.value)}
                    />
                  </label>
                  <label className="text-xs font-semibold text-portal-soft">
                    Isi per 1 satuan beli
                    <input
                      type="number"
                      step="any"
                      min="0.0001"
                      className="mt-1 min-h-11 w-full rounded-xl border border-portal-line px-3 text-sm text-portal-ink"
                      value={conversionFactor}
                      onChange={event => setConversionFactor(event.target.value)}
                    />
                  </label>
                </div>
              </details>
            </div>
          ) : null}

          {createStep === 3 ? (
            <div className="space-y-4">
              <div className="grid gap-3 sm:grid-cols-3">
                <label className="text-xs font-semibold text-portal-soft">
                  Stok awal ({recipeUnit || 'unit'})
                  <input
                    type="number"
                    min="0"
                    step="any"
                    className="mt-1 min-h-12 w-full rounded-xl border border-portal-line px-3 text-sm text-portal-ink"
                    value={stockQuantity}
                    onChange={event => setStockQuantity(event.target.value)}
                  />
                </label>
                <label className="text-xs font-semibold text-portal-soft">
                  Ingatkan kalau stok tinggal
                  <input
                    type="number"
                    min="0"
                    step="any"
                    className="mt-1 min-h-12 w-full rounded-xl border border-portal-line px-3 text-sm text-portal-ink"
                    value={minimumStock}
                    onChange={event => setMinimumStock(event.target.value)}
                    placeholder="Contoh: 500"
                  />
                </label>
                <label className="text-xs font-semibold text-portal-soft">
                  Supplier <span className="font-normal">(opsional)</span>
                  <input
                    className="mt-1 min-h-12 w-full rounded-xl border border-portal-line px-3 text-sm text-portal-ink"
                    value={supplier}
                    onChange={event => setSupplier(event.target.value)}
                    placeholder="Contoh: Pasar Induk"
                  />
                </label>
              </div>

              <details className="rounded-xl border border-portal-line bg-white p-3">
                <summary className="cursor-pointer text-xs font-bold text-portal-soft">
                  Hasil terpakai & susut (opsional)
                </summary>
                <div className="mt-3 grid gap-3 sm:grid-cols-2">
                  <label className="text-xs font-semibold text-portal-soft">
                    Hasil terpakai %
                    <input
                      type="number"
                      min="1"
                      max="100"
                      className="mt-1 min-h-11 w-full rounded-xl border border-portal-line px-3 text-sm text-portal-ink"
                      value={yieldPercent}
                      onChange={event => setYieldPercent(event.target.value)}
                    />
                  </label>
                  <label className="text-xs font-semibold text-portal-soft">
                    Susut %
                    <input
                      type="number"
                      min="0"
                      max="99"
                      className="mt-1 min-h-11 w-full rounded-xl border border-portal-line px-3 text-sm text-portal-ink"
                      value={wastePercent}
                      onChange={event => setWastePercent(event.target.value)}
                    />
                  </label>
                </div>
              </details>
            </div>
          ) : null}

          <div className="mt-5 flex flex-wrap items-center justify-between gap-3 border-t border-portal-line pt-4">
            <div className="flex gap-2">
              {createStep > 1 ? (
                <button
                  type="button"
                  onClick={() => setCreateStep(current => (current - 1) as 1 | 2 | 3)}
                  className="portal-button-secondary min-h-11"
                >
                  Kembali
                </button>
              ) : null}
              {createStep < 3 ? (
                <button
                  type="button"
                  onClick={() => {
                    if (createStep === 1 && name.trim().length < 2) {
                      setMessage('Isi nama bahan atau kemasan terlebih dahulu.');
                      return;
                    }
                    setMessage('');
                    setCreateStep(current => (current + 1) as 1 | 2 | 3);
                  }}
                  className="portal-button-primary min-h-11"
                >
                  Lanjut
                </button>
              ) : (
                <button
                  type="button"
                  disabled={saving || !canManage}
                  onClick={() => void save()}
                  className="portal-button-primary min-h-11 disabled:opacity-60"
                >
                  {saving ? <Loader2 className="h-4 w-4 animate-spin" /> : <Plus className="h-4 w-4" />}
                  Simpan bahan
                </button>
              )}
            </div>
            {message ? <p className="text-xs font-semibold text-portal-soft" role="status">{message}</p> : null}
          </div>
        </div>
      </section>

'''
          source = source[:start] + new_segment + source[end:]
          path.write_text(source)
          PY

          rm .github/workflows/tmp-inventory-workspace-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/apps/usaha/src/components/business-control/IngredientWorkspace.tsx .github/workflows/tmp-inventory-workspace-refactor.yml
          git diff --cached --check
          git commit -m "feat(inventory): simplify ingredient setup flow"
          git push origin HEAD:fix/inventory-simplify-20260915
