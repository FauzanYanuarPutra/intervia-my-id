name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        type: choice
        required: true
        options: [staging, production]
      image_tag:
        description: Immutable image tag, for example sha-<40-char-git-sha>
        type: string
        required: true
  workflow_run:
    workflows: ["Build Images"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'workflow_run' && 'production' || inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    name: Deploy ${{ github.event_name == 'workflow_run' && 'production' || inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event_name == 'workflow_run' && 'production' || inputs.environment }}
    steps:
      - name: Resolve immutable release
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_ENV: ${{ inputs.environment }}
          MANUAL_IMAGE_TAG: ${{ inputs.image_tag }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            [[ "$WORKFLOW_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo "Build Images workflow did not expose a valid 40-character head SHA." >&2
              exit 1
            }
            target_env=production
            release_sha="$WORKFLOW_HEAD_SHA"
            image_tag="sha-$WORKFLOW_HEAD_SHA"
          else
            [[ "$MANUAL_ENV" == "staging" || "$MANUAL_ENV" == "production" ]] || {
              echo "Manual deployment environment must be staging or production." >&2
              exit 1
            }
            [[ "$MANUAL_IMAGE_TAG" =~ ^sha-[0-9a-f]{40}$ ]] || {
              echo "image_tag must be sha- followed by the full 40-character commit SHA." >&2
              exit 1
            }
            target_env="$MANUAL_ENV"
            image_tag="$MANUAL_IMAGE_TAG"
            release_sha="${MANUAL_IMAGE_TAG#sha-}"
          fi

          {
            echo "target_env=$target_env"
            echo "image_tag=$image_tag"
            echo "release_sha=$release_sha"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.release_sha }}

      - name: Validate release contract
        shell: bash
        env:
          TARGET_ENV: ${{ steps.release.outputs.target_env }}
          IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_ENV" == "staging" || "$TARGET_ENV" == "production" ]] || { echo "Invalid deployment environment." >&2; exit 1; }
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "release_sha must be a full commit SHA." >&2; exit 1; }
          [[ "$IMAGE_TAG" == "sha-$RELEASE_SHA" ]] || { echo "image_tag and checked-out release SHA must match exactly." >&2; exit 1; }
      - name: Prepare SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Package deployment contract
        shell: bash
        env:
          TARGET_ENV: ${{ steps.release.outputs.target_env }}
        run: |
          set -euo pipefail
          overlay="docker-compose.${TARGET_ENV}.yml"
          [[ "$TARGET_ENV" == "production" ]] && overlay="docker-compose.prod.yml"
          tar -czf /tmp/lajukan-deploy.tgz docker-compose.yml "$overlay" docker-compose.observability.yml infrastructure/caddy infrastructure/observability infrastructure/rabbitmq services/chat_service/priv/scylladb scripts/ops/minio_storage_probe.sh scripts/ops/minio_media_recovery.sh scripts/ops/postgres_logical_backup.sh scripts/ops/verify_backup_set.sh scripts/ops/community_media_backup.sh scripts/ops/verify_community_media_backup.sh
      - name: Upload deployment contract
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          scp -P "${DEPLOY_PORT:-22}" /tmp/lajukan-deploy.tgz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/lajukan-deploy.tgz"
      - name: Apply deployment
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          TARGET_ENV: ${{ steps.release.outputs.target_env }}
          IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
        run: |
          set -euo pipefail
          ssh -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_PATH='$DEPLOY_PATH' TARGET_ENV='$TARGET_ENV' IMAGE_TAG='$IMAGE_TAG' DOCKERHUB_NAMESPACE='$DOCKERHUB_NAMESPACE' DOCKERHUB_TOKEN='$DOCKERHUB_TOKEN' bash -s" <<'REMOTE'
          set -euo pipefail
          mkdir -p "$DEPLOY_PATH"
          tar -xzf /tmp/lajukan-deploy.tgz -C "$DEPLOY_PATH"
          rm -f /tmp/lajukan-deploy.tgz
          cd "$DEPLOY_PATH"
          if [[ "$TARGET_ENV" == production ]]; then overlay=docker-compose.prod.yml; env_file=.env.production; else overlay=docker-compose.staging.yml; env_file=.env.staging; fi
          [[ -f "$env_file" ]] || { echo "Missing server-managed $DEPLOY_PATH/$env_file" >&2; exit 1; }

          # Production paging must never silently use the repository's null
          # Alertmanager receiver when observability is enabled.
          compose_profiles="$(awk -F= '$1 == "COMPOSE_PROFILES" { sub(/\r$/, "", $2); print $2; exit }' "$env_file")"
          alertmanager_config_path="$(awk -F= '$1 == "ALERTMANAGER_CONFIG_PATH" { sub(/\r$/, "", $2); print $2; exit }' "$env_file")"
          if [[ "$TARGET_ENV" == production && ",$compose_profiles," == *",observability,"* ]]; then
            [[ -n "$alertmanager_config_path" ]] || {
              echo "Production observability requires ALERTMANAGER_CONFIG_PATH in $env_file." >&2
              exit 1
            }

            case "$alertmanager_config_path" in
              ./infrastructure/observability/alertmanager.yml|infrastructure/observability/alertmanager.yml)
                echo "Production observability refuses the repository local-null Alertmanager config. Point ALERTMANAGER_CONFIG_PATH to a server-managed paging config." >&2
                exit 1
                ;;
            esac

            if [[ "$alertmanager_config_path" = /* ]]; then
              resolved_alertmanager_config="$alertmanager_config_path"
            else
              resolved_alertmanager_config="$DEPLOY_PATH/${alertmanager_config_path#./}"
            fi

            [[ -f "$resolved_alertmanager_config" ]] || {
              echo "Server-managed Alertmanager config does not exist: $resolved_alertmanager_config" >&2
              exit 1
            }

            if grep -Eq 'name:[[:space:]]*local-null' "$resolved_alertmanager_config"; then
              echo "Production Alertmanager config still contains the local-null receiver. Refusing silent alert discard." >&2
              exit 1
            fi

            export ALERTMANAGER_CONFIG_PATH="$resolved_alertmanager_config"
          fi

          # Resolve production media storage before Compose evaluates the overlay.
          # Never source the server env file: read only the single non-secret value we need.
          if [[ "$TARGET_ENV" == production ]]; then
            configured_minio_volume="$(awk -F= '$1 == "MINIO_DATA_VOLUME" { sub(/\r$/, "", $2); print $2; exit }' "$env_file")"
            [[ -z "$configured_minio_volume" || "$configured_minio_volume" =~ ^[A-Za-z0-9_.-]+$ ]] || {
              echo "MINIO_DATA_VOLUME in $env_file contains an invalid Docker volume name." >&2
              exit 1
            }

            mapfile -t active_minio_volumes < <(
              docker ps -q --filter 'label=com.docker.compose.service=minio' |
                xargs -r docker inspect --format '{{range .Mounts}}{{if and (eq .Destination "/data") (eq .Type "volume")}}{{.Name}}{{println}}{{end}}{{end}}' |
                sed '/^$/d' | sort -u
            )

            if [[ -n "$configured_minio_volume" ]]; then
              docker volume inspect "$configured_minio_volume" >/dev/null 2>&1 || {
                echo "Configured production MinIO volume '$configured_minio_volume' does not exist. Refusing to create an empty replacement." >&2
                exit 1
              }
              if ((${#active_minio_volumes[@]} > 1)); then
                printf 'Multiple active MinIO /data volumes detected: %s\n' "${active_minio_volumes[*]}" >&2
                exit 1
              fi
              if ((${#active_minio_volumes[@]} == 1)) && [[ "${active_minio_volumes[0]}" != "$configured_minio_volume" ]]; then
                echo "Configured MINIO_DATA_VOLUME '$configured_minio_volume' differs from active MinIO /data volume '${active_minio_volumes[0]}'. Refusing storage switch." >&2
                exit 1
              fi
              export MINIO_DATA_VOLUME="$configured_minio_volume"
            else
              if ((${#active_minio_volumes[@]} != 1)); then
                echo "MINIO_DATA_VOLUME is unset and exactly one active named MinIO /data volume could not be resolved. Set it explicitly in $env_file after inventorying production storage." >&2
                exit 1
              fi
              export MINIO_DATA_VOLUME="${active_minio_volumes[0]}"
              docker volume inspect "$MINIO_DATA_VOLUME" >/dev/null 2>&1 || {
                echo "Resolved active MinIO volume '$MINIO_DATA_VOLUME' no longer exists." >&2
                exit 1
              }
              echo "Resolved production MINIO_DATA_VOLUME from active MinIO: $MINIO_DATA_VOLUME"
            fi

            configured_community_volume="$(awk -F= '$1 == "COMMUNITY_UPLOADS_VOLUME" { sub(/\r$/, "", $2); print $2; exit }' "$env_file")"
            [[ -z "$configured_community_volume" || "$configured_community_volume" =~ ^[A-Za-z0-9_.-]+$ ]] || {
              echo "COMMUNITY_UPLOADS_VOLUME in $env_file contains an invalid Docker volume name." >&2
              exit 1
            }

            mapfile -t active_community_volumes < <(
              docker ps -q --filter 'label=com.docker.compose.service=community_service' |
                xargs -r docker inspect --format '{{range .Mounts}}{{if and (eq .Destination "/app/uploads/forum") (eq .Type "volume")}}{{.Name}}{{println}}{{end}}{{end}}' |
                sed '/^$/d' | sort -u
            )

            if [[ -n "$configured_community_volume" ]]; then
              docker volume inspect "$configured_community_volume" >/dev/null 2>&1 || {
                echo "Configured community uploads volume '$configured_community_volume' does not exist. Refusing to create an empty replacement." >&2
                exit 1
              }
              if ((${#active_community_volumes[@]} > 1)); then
                printf 'Multiple active Community upload volumes detected: %s\n' "${active_community_volumes[*]}" >&2
                exit 1
              fi
              if ((${#active_community_volumes[@]} == 1)) && [[ "${active_community_volumes[0]}" != "$configured_community_volume" ]]; then
                echo "Configured COMMUNITY_UPLOADS_VOLUME '$configured_community_volume' differs from active Community upload volume '${active_community_volumes[0]}'. Refusing storage switch." >&2
                exit 1
              fi
              export COMMUNITY_UPLOADS_VOLUME="$configured_community_volume"
            else
              if ((${#active_community_volumes[@]} != 1)); then
                echo "COMMUNITY_UPLOADS_VOLUME is unset and exactly one active named Community uploads volume could not be resolved. Set it explicitly after inventorying production storage." >&2
                exit 1
              fi
              export COMMUNITY_UPLOADS_VOLUME="${active_community_volumes[0]}"
              docker volume inspect "$COMMUNITY_UPLOADS_VOLUME" >/dev/null 2>&1 || {
                echo "Resolved active Community uploads volume '$COMMUNITY_UPLOADS_VOLUME' no longer exists." >&2
                exit 1
              }
              echo "Resolved production COMMUNITY_UPLOADS_VOLUME from active Community service: $COMMUNITY_UPLOADS_VOLUME"
            fi
          fi

          compose=(--env-file "$env_file" -f docker-compose.yml -f "$overlay" -f docker-compose.observability.yml)
          release_marker="$DEPLOY_PATH/.last-successful-${TARGET_ENV}-image-tag"
          previous_image_tag=""
          if [[ -f "$release_marker" ]]; then
            previous_image_tag="$(tr -d '\r\n' < "$release_marker")"
            [[ "$previous_image_tag" =~ ^sha-[0-9a-f]{40}$ ]] || previous_image_tag=""
          fi
          deployment_started=0
          rollback_on_error() {
            status=$?; trap - ERR
            echo "Deployment health gate failed for $IMAGE_TAG." >&2
            docker compose "${compose[@]}" ps -a || true
            docker compose "${compose[@]}" logs --no-color --tail=200 || true
            if [[ "$deployment_started" == 1 && -n "$previous_image_tag" ]]; then
              echo "Rolling back to $previous_image_tag." >&2
              export IMAGE_TAG="$previous_image_tag"
              docker compose "${compose[@]}" pull || true
              docker compose "${compose[@]}" up -d --remove-orphans --wait --wait-timeout 420 || true
            fi
            exit "$status"
          }
          trap rollback_on_error ERR
          printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_NAMESPACE" --password-stdin
          export IMAGE_TAG DOCKERHUB_NAMESPACE
          docker compose "${compose[@]}" config --quiet
          docker compose "${compose[@]}" pull
          deployment_started=1
          docker compose "${compose[@]}" up -d --remove-orphans --wait --wait-timeout 420
          if [[ "$TARGET_ENV" == production ]]; then
            bash scripts/ops/minio_storage_probe.sh "${compose[@]}"
          fi
          app_domain="$(awk -F= '$1 == "APP_DOMAIN" { sub(/\r$/, "", $2); print $2; exit }' "$env_file")"
          [[ "$app_domain" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "APP_DOMAIN is missing or invalid in $env_file." >&2; false; }
          # First verify the origin/edge stack locally. A healthy container alone is
          # insufficient: routing, locale handling and the News SSR path must all work.
          curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 20 --resolve "www.${app_domain}:443:127.0.0.1" "https://www.${app_domain}/" >/dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 20 --resolve "www.${app_domain}:443:127.0.0.1" "https://www.${app_domain}/api/health" >/dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 20 --resolve "www.${app_domain}:443:127.0.0.1" "https://www.${app_domain}/id/news" >/dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 20 --resolve "api.${app_domain}:443:127.0.0.1" "https://api.${app_domain}/ready" >/dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 20 --resolve "chat.${app_domain}:443:127.0.0.1" "https://chat.${app_domain}/api/ready" >/dev/null

          apex_location="$(
            curl --silent --show-error --head --retry 5 --retry-all-errors --max-time 20 \
              --resolve "${app_domain}:443:127.0.0.1" "https://${app_domain}/" |
              awk 'tolower($0) ~ /^location:/ { sub(/\r$/, "", $0); sub(/^[^:]+:[[:space:]]*/, "", $0); print $0; exit }'
          )"
          [[ "$apex_location" == "https://www.${app_domain}/" ]] || {
            echo "Apex redirect is invalid: expected https://www.${app_domain}/, got '${apex_location:-<none>}'." >&2
            false
          }

          # Then verify the real public path through DNS/CDN/tunnel. This catches the
          # exact failure mode where local Caddy is healthy but www is unreachable.
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 --max-time 20 "https://www.${app_domain}/api/health" >/dev/null
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 --max-time 20 "https://www.${app_domain}/id/news" >/dev/null
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 --max-time 20 "https://api.${app_domain}/ready" >/dev/null
          printf '%s\n' "$IMAGE_TAG" > "$release_marker"
          trap - ERR
          docker compose "${compose[@]}" ps
          REMOTE
