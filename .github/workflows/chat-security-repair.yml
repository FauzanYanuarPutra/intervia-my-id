name: Chat Security Repair

on:
  push:
    branches:
      - security/chat-dependencies-20260907
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/chat_service
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '26.2'
          elixir-version: '1.17.3'
      - name: Refresh vulnerable dependency families within declared constraints
        env:
          MIX_ENV: test
        run: |
          mix deps.get --only test
          mix deps.update phoenix plug_cowboy guardian html_sanitize_ex decimal
      - name: Commit dependency refresh before strict verification
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No dependency changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/chat_service/mix.lock services/chat_service/mix.exs
          git commit -m "security: refresh chat dependency lockfile"
          git push origin HEAD:security/chat-dependencies-20260907
      - name: Verify formatting
        run: mix format --check-formatted
      - name: Run tests
        env:
          MIX_ENV: test
        run: mix test
      - name: Audit advisories
        env:
          MIX_ENV: test
        run: mix hex.audit
