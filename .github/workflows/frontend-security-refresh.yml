name: Frontend Security Refresh

on:
  push:
    branches:
      - security/frontend-dependency-audit-20260907

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: security/frontend-dependency-audit-20260907
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Merge current main
        run: |
          set -euo pipefail
          git fetch origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit origin/main
      - name: Apply non-forced production audit fixes
        run: |
          set -euo pipefail
          for dir in frontend/apps/www frontend/apps/usaha frontend/apps/cms frontend/apps/crm; do
            echo "Refreshing $dir"
            (cd "$dir" && npm audit fix --package-lock-only --legacy-peer-deps --no-fund)
          done
      - name: Verify production audits
        run: |
          set -euo pipefail
          for dir in frontend/packages frontend/apps/www frontend/apps/usaha frontend/apps/cms frontend/apps/crm; do
            [[ -f "$dir/package-lock.json" ]] || continue
            echo "Auditing $dir"
            (cd "$dir" && npm audit --omit=dev --audit-level=high)
          done
      - name: Build shared UI
        working-directory: frontend/packages
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm run build
      - name: Verify frontend applications
        run: |
          set -euo pipefail
          for app in www usaha cms crm; do
            dir="frontend/apps/$app"
            cd "$GITHUB_WORKSPACE/$dir"
            npm ci --legacy-peer-deps --no-audit --no-fund
            if [[ "$app" == "www" && "$(uname -s)" == "Linux" && "$(uname -m)" == "x86_64" ]]; then
              swc_version=$(node -p "require('./node_modules/next-intl/node_modules/@swc/core/package.json').version")
              npm install --no-save --legacy-peer-deps --no-audit --no-fund \
                @parcel/watcher-linux-x64-glibc@2.5.6 \
                "@swc/core-linux-x64-gnu@$swc_version"
              node -e "require.resolve('@parcel/watcher-linux-x64-glibc'); require.resolve('@swc/core-linux-x64-gnu')"
            fi
            npm run lint --if-present
            npm run test:unit --if-present
            npm run test --if-present
            npm run typecheck --if-present
            npm run build --if-present
          done
      - name: Commit verified refresh
        run: |
          set -euo pipefail
          git add frontend/apps/*/package.json frontend/apps/*/package-lock.json frontend/apps/www/src/lib/seo/publicDetailSeo.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'security: refresh frontend production dependencies'
          fi
          git push origin HEAD:security/frontend-dependency-audit-20260907
