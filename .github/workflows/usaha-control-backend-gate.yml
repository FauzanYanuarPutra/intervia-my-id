name: Usaha Control Backend Gate

on:
  pull_request:
    paths:
      - 'services/marketplace_service/src/businesses/**'
      - 'services/marketplace_service/migrations/**'
      - '.github/workflows/usaha-control-backend-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  marketplace-control:
    name: Marketplace control compile and tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/marketplace_service
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/marketplace_service
      - name: Cargo check locked
        run: cargo check --locked
      - name: Business control unit tests
        run: cargo test --locked businesses::control::tests
      - name: Settlement domain tests
        run: cargo test --locked businesses::settlement::tests
      - name: Business route tests
        run: cargo test --locked businesses::routes::tests
      - name: Business service tests
        run: cargo test --locked businesses::service::tests
      - name: Release build locked
        run: cargo build --release --locked
      - name: Migration contract
        run: |
          test -s migrations/20260906002000_usaha_business_control_center.up.sql
          test -s migrations/20260906002000_usaha_business_control_center.down.sql
          grep -q 'business_ingredients' migrations/20260906002000_usaha_business_control_center.up.sql
          grep -q 'business_recipes' migrations/20260906002000_usaha_business_control_center.up.sql
          grep -q 'business_channel_settings' migrations/20260906002000_usaha_business_control_center.up.sql
          grep -q 'business_finance_entries' migrations/20260906002000_usaha_business_control_center.up.sql
          grep -q 'DROP TABLE IF EXISTS business_ingredients' migrations/20260906002000_usaha_business_control_center.down.sql
