name: Usaha Control Backend Gate

on:
  pull_request:
    paths:
      - 'services/marketplace_service/src/businesses/**'
      - 'services/marketplace_service/migrations/**'
      - 'services/marketplace_service/tests/**'
      - 'scripts/ci/check_business_os_migration_immutability.py'
      - 'scripts/ci/test_business_os_migration_immutability.py'
      - '.github/workflows/usaha-control-backend-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: usaha-control-backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  marketplace-control:
    name: Marketplace control compile and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: services/marketplace_service
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/marketplace_service
      - name: Verify applied Business OS migrations are immutable
        run: |
          python ../../scripts/ci/check_business_os_migration_immutability.py
          cd ../../scripts/ci
          python -m unittest -v test_business_os_migration_immutability.py
      - name: Cargo check locked
        run: cargo check --locked
      - name: Applied migration immutability contract
        run: cargo test --locked --test migration_immutability_contract
      - name: Business control unit tests
        run: cargo test --locked businesses::control::tests
      - name: Transaction kernel invariant tests
        run: cargo test --locked businesses::transactions
      - name: Identity business access tests
        run: cargo test --locked businesses::identity_client::tests
      - name: Public commerce modifier and order tests
        run: |
          cargo test --locked businesses::public_commerce::tests
          cargo test --locked businesses::public_commerce_tests
      - name: Wave 2 domain and route tests
        run: |
          cargo test --locked businesses::wave2::tests
          cargo test --locked businesses::wave2_routes::tests
      - name: Wave 2 migration tests
        run: cargo test --locked businesses::wave2_migration_tests
      - name: Wave 2 persistence tests
        run: cargo test --locked businesses::wave2_persistence_tests
      - name: Seller order domain and persistence tests
        run: |
          cargo test --locked businesses::seller_orders::tests
          cargo test --locked businesses::seller_orders_persistence_tests
      - name: Ingredient management integrity tests
        run: cargo test --locked businesses::ingredient_management
      - name: Incomplete-cost sale integrity tests
        run: cargo test --locked businesses::sales_incomplete_cost_persistence_tests
      - name: Sale persistence regression tests
        run: cargo test --locked businesses::sales_persistence_tests
      - name: Settlement domain tests
        run: cargo test --locked businesses::settlement::tests
      - name: Business route tests
        run: cargo test --locked businesses::routes::tests
      - name: Business service tests
        run: cargo test --locked businesses::service::tests
      - name: Release build locked
        run: cargo build --release --locked
      - name: Migration contract
        run: |
          test -s migrations/20260906002000_usaha_business_control_center.up.sql
          test -s migrations/20260906002000_usaha_business_control_center.down.sql
          grep -q 'business_ingredients' migrations/20260906002000_usaha_business_control_center.up.sql
          grep -q 'business_recipes' migrations/20260906002000_usaha_business_control_center.up.sql
          grep -q 'business_channel_settings' migrations/20260906002000_usaha_business_control_center.up.sql
          grep -q 'business_finance_entries' migrations/20260906002000_usaha_business_control_center.up.sql
          grep -q 'DROP TABLE IF EXISTS business_ingredients' migrations/20260906002000_usaha_business_control_center.down.sql
          test -s migrations/20260906003000_usaha_business_settlements.up.sql
          test -s migrations/20260906003000_usaha_business_settlements.down.sql
          grep -q 'business_settlements' migrations/20260906003000_usaha_business_settlements.up.sql
          grep -q 'expected_transfer_amount' migrations/20260906003000_usaha_business_settlements.up.sql
          grep -q 'difference_amount' migrations/20260906003000_usaha_business_settlements.up.sql
          grep -q 'DROP TABLE IF EXISTS business_settlements' migrations/20260906003000_usaha_business_settlements.down.sql
          test -s migrations/20260913080000_business_os_wave2.sql
          grep -q 'business_finance_plans' migrations/20260913080000_business_os_wave2.sql
          grep -q 'business_recurring_obligations' migrations/20260913080000_business_os_wave2.sql
          grep -q 'business_purchases' migrations/20260913080000_business_os_wave2.sql
          grep -q 'business_cash_shifts' migrations/20260913080000_business_os_wave2.sql
          grep -q 'business_product_primary_materials' migrations/20260913080000_business_os_wave2.sql
          grep -q 'business_material_yield_observations' migrations/20260913080000_business_os_wave2.sql
          test -s migrations/20260916001000_product_modifier_groups.up.sql
          grep -q 'modifier_groups JSONB' migrations/20260916001000_product_modifier_groups.up.sql
          grep -q 'idx_business_products_modifier_groups_gin' migrations/20260916001000_product_modifier_groups.up.sql
          test -s migrations/20260918124500_business_sale_request_hash.up.sql
          test -s migrations/20260918124500_business_sale_request_hash.down.sql
          grep -q 'request_hash' migrations/20260918124500_business_sale_request_hash.up.sql
          grep -q 'business_sales_request_hash_check' migrations/20260918124500_business_sale_request_hash.up.sql
          test -s migrations/20260918150000_business_order_transition_idempotency.up.sql
          test -s migrations/20260918150000_business_order_transition_idempotency.down.sql
          grep -q 'idempotency_key UUID' migrations/20260918150000_business_order_transition_idempotency.up.sql
          grep -q 'idx_order_state_transitions_idempotency_key' migrations/20260918150000_business_order_transition_idempotency.up.sql
          test -s migrations/20260918173000_business_order_stock_reservations.up.sql
          test -s migrations/20260918173000_business_order_stock_reservations.down.sql
          grep -q 'business_order_stock_reservations' migrations/20260918173000_business_order_stock_reservations.up.sql
          grep -q "state IN ('reserved', 'released', 'consumed')" migrations/20260918173000_business_order_stock_reservations.up.sql
          grep -q 'ON DELETE RESTRICT' migrations/20260918173000_business_order_stock_reservations.up.sql
          grep -q 'refusing to drop business_order_stock_reservations' migrations/20260918173000_business_order_stock_reservations.down.sql
