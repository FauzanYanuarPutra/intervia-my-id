name: Marketplace rkyv Diagnostic

on:
  push:
    branches: [security/rust-jwt-aws-lc-20260907]

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Trace rkyv dependency path
        working-directory: services/marketplace_service
        run: |
          set -euo pipefail
          cargo tree --locked -i rkyv
          cargo tree --locked -i rkyv --target all
