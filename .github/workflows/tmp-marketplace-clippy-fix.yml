name: Temporary Marketplace Clippy Fix

on:
  push:
    branches:
      - feat/business-os-wave-2-1d-team-access-hardening

permissions:
  contents: write

jobs:
  fix-marketplace-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/business-os-wave-2-1d-team-access-hardening
      - name: Apply behavior-preserving clippy fixes
        shell: python
        run: |
          from pathlib import Path

          ingredient = Path('services/marketplace_service/src/businesses/ingredient_management_routes.rs')
          text = ingredient.read_text()
          old_calls = '''        Err(response) => return response,'''
          if text.count(old_calls) != 3:
              raise SystemExit(f'expected 3 ingredient actor call sites, found {text.count(old_calls)}')
          text = text.replace(old_calls, '''        Err(status) => return api_error(status, "auth_required"),''')
          old_actor = '''fn actor(state: &AppState, headers: &HeaderMap) -> Result<Uuid, Response> {
    headers
        .get(header::AUTHORIZATION)
        .and_then(|value| value.to_str().ok())
        .map(str::trim)
        .filter(|value| value.starts_with("Bearer ") && value.len() > 7)
        .ok_or_else(|| api_error(StatusCode::UNAUTHORIZED, "auth_required"))?;
    user_id_from_auth(headers, &state.jwt_secret)
        .ok_or_else(|| api_error(StatusCode::UNAUTHORIZED, "auth_required"))
}'''
          new_actor = '''fn actor(state: &AppState, headers: &HeaderMap) -> Result<Uuid, StatusCode> {
    headers
        .get(header::AUTHORIZATION)
        .and_then(|value| value.to_str().ok())
        .map(str::trim)
        .filter(|value| value.starts_with("Bearer ") && value.len() > 7)
        .ok_or(StatusCode::UNAUTHORIZED)?;
    user_id_from_auth(headers, &state.jwt_secret).ok_or(StatusCode::UNAUTHORIZED)
}'''
          if old_actor not in text:
              raise SystemExit('ingredient actor helper did not match expected source')
          ingredient.write_text(text.replace(old_actor, new_actor))

          wave2 = Path('services/marketplace_service/src/businesses/wave2_routes.rs')
          text = wave2.read_text()
          old_access = '''    let (actor_id, authorization) = actor_and_authorization(state, headers)?;'''
          new_access = '''    let (actor_id, authorization) = actor_and_authorization(state, headers)
        .map_err(|status| api_error(status, "auth_required"))?;'''
          if text.count(old_access) != 1:
              raise SystemExit(f'expected 1 wave2 actor call site, found {text.count(old_access)}')
          text = text.replace(old_access, new_access)
          old_actor_auth = '''fn actor_and_authorization(
    state: &AppState,
    headers: &HeaderMap,
) -> Result<(Uuid, String), Response> {
    let authorization = headers
        .get(header::AUTHORIZATION)
        .and_then(|value| value.to_str().ok())
        .map(str::trim)
        .filter(|value| value.starts_with("Bearer ") && value.len() > 7)
        .ok_or_else(|| api_error(StatusCode::UNAUTHORIZED, "auth_required"))?;
    let actor_id = user_id_from_auth(headers, &state.jwt_secret)
        .ok_or_else(|| api_error(StatusCode::UNAUTHORIZED, "auth_required"))?;
    Ok((actor_id, authorization.to_owned()))
}'''
          new_actor_auth = '''fn actor_and_authorization(
    state: &AppState,
    headers: &HeaderMap,
) -> Result<(Uuid, String), StatusCode> {
    let authorization = headers
        .get(header::AUTHORIZATION)
        .and_then(|value| value.to_str().ok())
        .map(str::trim)
        .filter(|value| value.starts_with("Bearer ") && value.len() > 7)
        .ok_or(StatusCode::UNAUTHORIZED)?;
    let actor_id =
        user_id_from_auth(headers, &state.jwt_secret).ok_or(StatusCode::UNAUTHORIZED)?;
    Ok((actor_id, authorization.to_owned()))
}'''
          if old_actor_auth not in text:
              raise SystemExit('wave2 actor helper did not match expected source')
          wave2.write_text(text.replace(old_actor_auth, new_actor_auth))
      - name: Format marketplace
        run: cargo fmt --manifest-path services/marketplace_service/Cargo.toml
      - name: Verify clippy
        working-directory: services/marketplace_service
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/marketplace_service/src/businesses/ingredient_management_routes.rs services/marketplace_service/src/businesses/wave2_routes.rs
          git diff --cached --quiet && exit 0
          git commit -m "fix(marketplace): satisfy strict clippy auth helpers"
          git push origin HEAD:feat/business-os-wave-2-1d-team-access-hardening
