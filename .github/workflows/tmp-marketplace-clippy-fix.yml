name: Temporary Marketplace Clippy Autofix

on:
  push:
    branches: [fix/marketplace-quality-fresh-20260906]
    paths:
      - '.github/workflows/tmp-marketplace-clippy-fix.yml'

permissions:
  contents: write

jobs:
  clippy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/marketplace-quality-fresh-20260906
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Apply machine-safe Clippy fixes
        working-directory: services/marketplace_service
        shell: bash
        run: |
          set +e
          cargo clippy --fix --locked --all-targets --allow-dirty --allow-staged -- -D warnings
          status=$?
          echo "clippy_fix_exit=$status"
          exit 0
      - name: Format after Clippy fixes
        working-directory: services/marketplace_service
        run: cargo fmt
      - name: Commit machine-safe fixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- services/marketplace_service; then
            echo 'No machine-safe fixes were produced.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/marketplace_service
          git commit -m 'fix: apply marketplace clippy suggestions'
          git push origin HEAD:fix/marketplace-quality-fresh-20260906
