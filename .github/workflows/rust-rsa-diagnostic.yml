name: Rust RSA Diagnostic

on:
  push:
    branches:
      - security/rust-jwt-aws-lc-20260907

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: security/rust-jwt-aws-lc-20260907
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Trace stale RSA lockfile owner
        working-directory: services/marketplace_service
        run: |
          set -uo pipefail
          echo '=== rsa, all targets ==='
          cargo tree --locked --target all -i rsa || true
          echo '=== sqlx-mysql, all targets ==='
          cargo tree --locked --target all -i sqlx-mysql || true
          echo '=== jsonwebtoken 9.3.1, all targets ==='
          cargo tree --locked --target all -i jsonwebtoken@9.3.1 || true
          echo '=== packages whose lock entry depends on rsa ==='
          python - <<'PY'
          from pathlib import Path
          text = Path('Cargo.lock').read_text()
          blocks = text.split('[[package]]')
          for block in blocks:
              if '"rsa"' in block:
                  print('[[package]]' + block)
          PY
