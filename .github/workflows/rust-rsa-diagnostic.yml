name: Rust RSA Diagnostic

on:
  push:
    branches:
      - security/rust-jwt-aws-lc-20260907

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: security/rust-jwt-aws-lc-20260907
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Inspect SQLx macro and derive usage
        working-directory: services/marketplace_service
        run: |
          set -uo pipefail
          echo '=== compile-time sqlx macros ==='
          grep -RInE 'sqlx::(query|query_as|query_scalar|migrate)!' src tests 2>/dev/null || true
          echo '=== sqlx derives ==='
          grep -RInE '(derive\([^)]*(sqlx::)?(FromRow|Type)|sqlx::FromRow|sqlx::Type)' src tests 2>/dev/null || true
          echo '=== all FromRow references ==='
          grep -RIn 'FromRow' src tests 2>/dev/null || true
          echo '=== all sqlx::migrate references ==='
          grep -RIn 'sqlx::migrate' src tests 2>/dev/null || true
          echo '=== dependency paths ==='
          cargo tree --locked --target all -i sqlx-macros || true
          cargo tree --locked --target all -i sqlx-mysql || true
          cargo tree --locked --target all -i rsa || true
