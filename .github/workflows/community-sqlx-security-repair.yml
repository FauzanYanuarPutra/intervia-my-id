name: Community SQLx Security Repair

on:
  push:
    branches: [security/rust-jwt-aws-lc-20260907]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: security/rust-jwt-aws-lc-20260907
      - name: Upgrade Community SQLx and refresh lock
        working-directory: services/community_service
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('Cargo.toml')
          text = p.read_text().replace('sqlx = { version = "0.8.6"', 'sqlx = { version = "0.9.0"')
          if 'sqlx = { version = "0.9.0"' not in text:
              raise SystemExit('Community SQLx 0.9 target not present')
          p.write_text(text)
          PY
          cargo update -p sqlx
          if grep -q '^name = "rsa"$' Cargo.lock; then
            echo 'rsa still present in Community Cargo.lock' >&2
            exit 1
          fi
      - name: Verify Community
        working-directory: services/community_service
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo install cargo-audit --locked
          cargo audit
      - name: Persist verified Community dependency repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/community_service/Cargo.toml services/community_service/Cargo.lock
          git commit -m 'security: remove Community lock-only RSA path'
          git push origin HEAD:security/rust-jwt-aws-lc-20260907
