name: KYC Runtime Contract

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: kyc-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: KYC runtime contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run KYC runtime regression tests
        run: python -m unittest discover -s scripts/config -p 'test_*.py'
      - name: Validate KYC Compose model
        env:
          LIVENESS_MODELS_PATH: /tmp/lajukan-ci/liveness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lajukan-ci/liveness/anti_spoof_models
          printf 'ci-placeholder' > /tmp/lajukan-ci/liveness/anti_spoof_models/model.onnx
          docker compose \
            --profile kyc \
            --env-file .env.development.example \
            -f docker-compose.yml \
            -f docker-compose.dev.yml \
            config --format json > /tmp/compose.json
          python scripts/config/runtime_contract.py \
            --model /tmp/compose.json \
            --env-file .env.development.example \
            --environment development \
            --profile kyc

  liveness-runtime:
    name: Liveness container readiness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: contract
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: /tmp/lajukan-ci/liveness
          key: kyc-liveness-584d4421d7ac42c59e640796f46e886b0095367a-v1
      - name: Provision pinned liveness models
        run: python scripts/config/provision_kyc_models.py --root /tmp/lajukan-ci/liveness
      - name: Build liveness image
        run: docker build -t lajukan-liveness-ci services/liveness_service
      - name: Start liveness container
        shell: bash
        run: |
          set -euo pipefail
          docker run -d \
            --name lajukan-liveness-ci \
            -p 127.0.0.1:18002:8000 \
            -e LIVENESS_MODEL_DIR=/models/anti_spoof_models \
            -v /tmp/lajukan-ci/liveness:/models:ro \
            lajukan-liveness-ci
      - name: Require liveness readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:18002/ready > /tmp/ready.json; then
              cat /tmp/ready.json
              python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/ready.json').read_text())
          assert payload['status'] == 'ready', payload
          assert len(payload.get('models', [])) >= 1, payload
          PY
              exit 0
            fi
            sleep 2
          done
          docker logs lajukan-liveness-ci || true
          exit 1
      - name: Capture liveness diagnostics
        if: failure()
        run: docker logs lajukan-liveness-ci || true
      - name: Stop liveness container
        if: always()
        run: docker rm -f lajukan-liveness-ci >/dev/null 2>&1 || true

  kyc-runtime-gate:
    name: KYC runtime gate
    runs-on: ubuntu-latest
    if: always()
    needs: [contract, liveness-runtime]
    steps:
      - name: Require KYC contract and liveness readiness
        env:
          CONTRACT_RESULT: ${{ needs.contract.result }}
          LIVENESS_RESULT: ${{ needs.liveness-runtime.result }}
        shell: bash
        run: |
          set -euo pipefail
          echo "contract=$CONTRACT_RESULT"
          echo "liveness-runtime=$LIVENESS_RESULT"
          [[ "$CONTRACT_RESULT" == "success" ]]
          [[ "$LIVENESS_RESULT" == "success" ]]
