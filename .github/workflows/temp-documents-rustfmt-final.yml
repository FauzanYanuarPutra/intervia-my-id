name: Temporary Documents Rustfmt Final

on:
  push:
    branches:
      - automation/rustfmt-docs-6ffd1466

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: automation/rustfmt-docs-6ffd1466
      - run: rustup show
      - run: cd services/marketplace_service && cargo fmt
      - shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/marketplace_service
          git commit -m "style: format document approval kernel"
          git push origin HEAD:automation/rustfmt-docs-6ffd1466
