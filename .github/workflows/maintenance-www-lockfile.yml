name: Maintenance WWW Lockfile

on:
  pull_request:
    paths:
      - "frontend/apps/www/package.json"
      - "frontend/apps/www/package-lock.json"
      - ".github/workflows/maintenance-www-lockfile.yml"

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'FauzanYanuarPutra'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/apps/www/package-lock.json
      - name: Regenerate package lock
        working-directory: frontend/apps/www
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Verify patched Nodemailer is locked
        working-directory: frontend/apps/www
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const l=require("./package-lock.json"); const v=l.packages["node_modules/nodemailer"]?.version; if (v !== "9.1.1") throw new Error(`unexpected nodemailer lock: ${v}`); console.log(`nodemailer locked at ${v}`)'
      - name: Finalize lockfile and remove maintenance workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/maintenance-www-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/apps/www/package-lock.json .github/workflows/maintenance-www-lockfile.yml
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix(security): lock Nodemailer 9.1.1"
          git push origin HEAD:${{ github.head_ref }}
