name: Temporary run inventory refactor

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-run-inventory-refactor.yml

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/inventory-simplify-20260915
          fetch-depth: 0
      - name: Run branch-owned deterministic patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/tmp-inventory-workspace-refactor.yml')
          content = workflow.read_text()
          marker = '        run: |\n'
          if content.count(marker) != 1:
              raise SystemExit('unexpected temporary workflow format')
          script = textwrap.dedent(content.split(marker, 1)[1])
          Path('/tmp/apply-inventory-refactor.sh').write_text(script)
          PY
          bash /tmp/apply-inventory-refactor.sh
