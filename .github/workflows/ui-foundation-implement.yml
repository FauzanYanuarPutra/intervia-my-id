name: UI Foundation Implement

on:
  push:
    branches: [feat/ui-foundation-20260907]

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ui-foundation-20260907
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/packages/package-lock.json
      - name: Install test harness and prove RED
        working-directory: frontend/packages
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json','utf8'));
          p.scripts = {...p.scripts, test:'vitest run'};
          p.devDependencies = {...p.devDependencies,
            '@testing-library/jest-dom':'^6.9.1',
            '@testing-library/react':'^16.3.0',
            '@testing-library/user-event':'^14.6.1',
            'jsdom':'^26.1.0',
            'vitest':'^3.2.4'
          };
          fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');
          NODE
          npm install --package-lock-only --legacy-peer-deps
          npm ci --legacy-peer-deps
          mkdir -p test ui/__tests__
          cat > vitest.config.ts <<'EOF'
          import { defineConfig } from 'vitest/config';
          export default defineConfig({ test: { environment: 'jsdom', globals: true, setupFiles: ['./test/setup.ts'], include: ['ui/**/*.test.ts','ui/**/*.test.tsx'] } });
          EOF
          cat > test/setup.ts <<'EOF'
          import '@testing-library/jest-dom/vitest';
          import { cleanup } from '@testing-library/react';
          import { afterEach } from 'vitest';
          afterEach(() => cleanup());
          EOF
          cat > ui/__tests__/Button.test.tsx <<'EOF'
          import * as React from 'react';
          import { render, screen } from '@testing-library/react';
          import userEvent from '@testing-library/user-event';
          import { describe, expect, it, vi } from 'vitest';
          import { Button } from '../Button';
          describe('Button', () => {
            it('blocks duplicate activation and exposes pending text while loading', async () => {
              const user = userEvent.setup();
              const onClick = vi.fn();
              render(<Button loading loadingLabel="Menyimpan" onClick={onClick}>Simpan</Button>);
              const button = screen.getByRole('button', { name: 'Menyimpan' });
              expect(button).toBeDisabled();
              expect(button).toHaveAttribute('aria-busy','true');
              await user.click(button);
              expect(onClick).not.toHaveBeenCalled();
            });
          });
          EOF
          cat > ui/__tests__/tokens.test.ts <<'EOF'
          import { readFileSync } from 'node:fs';
          import { resolve } from 'node:path';
          import { describe, expect, it } from 'vitest';
          const css = readFileSync(resolve(process.cwd(),'tokens.css'),'utf8');
          for (const token of ['--color-info','--color-info-soft','--color-info-border','--color-focus','--content-width-sm','--content-width-md','--content-width-lg','--motion-fast','--motion-normal','--touch-target']) {
            it(`defines ${token}`, () => expect(css).toContain(token));
          }
          EOF
          if npm test; then
            echo 'Expected RED before implementation, but tests unexpectedly passed' >&2
            exit 1
          fi
      - name: Implement semantic foundation and shared primitives
        working-directory: frontend/packages
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tokens.css')
          s=p.read_text()
          s=s.replace('  --color-success-border: color-mix(in srgb, var(--color-success) 38%, transparent);\n', '  --color-success-border: color-mix(in srgb, var(--color-success) 38%, transparent);\n  --color-info: #2563eb;\n  --color-info-soft: #dbeafe;\n  --color-info-border: color-mix(in srgb, var(--color-info) 38%, transparent);\n  --color-focus: var(--color-primary);\n  --content-width-sm: 42rem;\n  --content-width-md: 64rem;\n  --content-width-lg: 80rem;\n  --motion-fast: 120ms;\n  --motion-normal: 180ms;\n  --touch-target: 2.75rem;\n',1)
          marker='  --color-success-border: color-mix(in srgb, var(--color-success) 38%, transparent);\n'
          idx=s.find(marker, s.find('.dark'))
          if idx!=-1:
            end=idx+len(marker)
            s=s[:end]+'  --color-info: #60a5fa;\n  --color-info-soft: #172554;\n  --color-info-border: color-mix(in srgb, var(--color-info) 38%, transparent);\n'+s[end:]
          p.write_text(s)
          PY
          cat > ui/Button.tsx <<'EOF'
          'use client';
          import * as React from 'react';
          import { cva, type VariantProps } from 'class-variance-authority';
          import { cn } from '../utils/cn';
          const buttonVariants = cva('inline-flex min-h-[var(--touch-target)] touch-manipulation items-center justify-center gap-2 rounded-[14px] text-sm font-semibold transition-all duration-[var(--motion-fast)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[color:var(--color-focus)] focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-60', { variants: { variant: { default:'bg-[color:var(--color-primary)] text-[color:var(--color-text-inverse)] shadow-sm hover:bg-[color:var(--color-primary-strong)]', secondary:'border border-[color:var(--color-border)] bg-[color:var(--color-surface)] text-[color:var(--color-text)] hover:bg-[color:var(--color-surface-muted)]', destructive:'bg-[color:var(--color-danger)] text-[color:var(--color-text-inverse)]', outline:'border border-[color:var(--color-border)] bg-transparent text-[color:var(--color-text)] hover:bg-[color:var(--color-surface-muted)]', ghost:'text-[color:var(--color-text)] hover:bg-[color:var(--color-surface-muted)]', link:'min-h-0 h-auto rounded-none px-0 text-[color:var(--color-primary)] underline-offset-4 hover:underline' }, size: { default:'px-4 py-2.5', sm:'min-h-[44px] rounded-xl px-3.5 text-xs', lg:'min-h-[52px] rounded-[16px] px-6 text-base', icon:'h-12 w-12 rounded-[14px] px-0' } }, defaultVariants:{variant:'default',size:'default'} });
          export interface ButtonProps extends React.ButtonHTMLAttributes<HTMLButtonElement>, VariantProps<typeof buttonVariants> { loading?: boolean; loadingLabel?: string }
          export const Button = React.forwardRef<HTMLButtonElement, ButtonProps>(({className,variant,size,loading=false,loadingLabel,disabled,children,...props},ref)=><button ref={ref} className={cn(buttonVariants({variant,size,className}))} disabled={disabled||loading} aria-busy={loading||undefined} {...props}>{loading ? (loadingLabel ?? children) : children}</button>);
          Button.displayName='Button'; export { buttonVariants };
          EOF
          cat > ui/StatusBadge.tsx <<'EOF'
          import * as React from 'react';
          import { cn } from '../utils/cn';
          export type StatusTone='neutral'|'primary'|'success'|'warning'|'danger'|'info';
          const tones:Record<StatusTone,string>={neutral:'border-[color:var(--color-border)] bg-[color:var(--color-surface-muted)] text-[color:var(--color-text-soft)]',primary:'border-[color:var(--color-primary-border)] bg-[color:var(--color-primary-soft)] text-[color:var(--color-primary-strong)]',success:'border-[color:var(--color-success-border)] bg-[color:var(--color-success-soft)] text-[color:var(--color-success)]',warning:'border-[color:var(--color-warning-border)] bg-[color:var(--color-warning-soft)] text-[color:var(--color-warning)]',danger:'border-[color:var(--color-danger-border)] bg-[color:var(--color-danger-soft)] text-[color:var(--color-danger)]',info:'border-[color:var(--color-info-border)] bg-[color:var(--color-info-soft)] text-[color:var(--color-info)]'};
          export function StatusBadge({tone='neutral',className,children,...props}:React.HTMLAttributes<HTMLSpanElement>&{tone?:StatusTone}){return <span className={cn('inline-flex items-center rounded-full border px-2.5 py-1 text-xs font-semibold',tones[tone],className)} {...props}>{children}</span>}
          EOF
          cat > ui/Alert.tsx <<'EOF'
          import * as React from 'react';
          import { cn } from '../utils/cn'; import type { StatusTone } from './StatusBadge';
          const tones:Record<StatusTone,string>={neutral:'border-[color:var(--color-border)] bg-[color:var(--color-surface-muted)]',primary:'border-[color:var(--color-primary-border)] bg-[color:var(--color-primary-soft)]',success:'border-[color:var(--color-success-border)] bg-[color:var(--color-success-soft)]',warning:'border-[color:var(--color-warning-border)] bg-[color:var(--color-warning-soft)]',danger:'border-[color:var(--color-danger-border)] bg-[color:var(--color-danger-soft)]',info:'border-[color:var(--color-info-border)] bg-[color:var(--color-info-soft)]'};
          export function Alert({tone='neutral',title,children,className}:React.PropsWithChildren<{tone?:StatusTone;title?:string;className?:string}>){return <div role={tone==='danger'?'alert':'status'} className={cn('rounded-2xl border p-4 text-sm text-[color:var(--color-text)]',tones[tone],className)}>{title?<p className="font-semibold">{title}</p>:null}<div className={title?'mt-1':''}>{children}</div></div>}
          EOF
          cat > ui/PageHeader.tsx <<'EOF'
          import * as React from 'react'; import { cn } from '../utils/cn';
          export function PageHeader({title,description,primaryAction,secondaryActions,className}: {title:React.ReactNode;description?:React.ReactNode;primaryAction?:React.ReactNode;secondaryActions?:React.ReactNode;className?:string}){return <header className={cn('flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between',className)}><div className="min-w-0"><h1 className="text-2xl font-bold tracking-tight text-[color:var(--color-text)] sm:text-3xl">{title}</h1>{description?<div className="mt-2 max-w-3xl text-sm leading-6 text-[color:var(--color-text-soft)]">{description}</div>:null}</div>{primaryAction||secondaryActions?<div className="flex flex-col-reverse gap-2 sm:flex-row sm:items-center">{secondaryActions}{primaryAction}</div>:null}</header>}
          EOF
          cat > ui/SectionHeader.tsx <<'EOF'
          import * as React from 'react'; import { cn } from '../utils/cn';
          export function SectionHeader({title,description,action,className}: {title:React.ReactNode;description?:React.ReactNode;action?:React.ReactNode;className?:string}){return <div className={cn('flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between',className)}><div><h2 className="text-lg font-semibold text-[color:var(--color-text)]">{title}</h2>{description?<p className="mt-1 text-sm leading-6 text-[color:var(--color-text-soft)]">{description}</p>:null}</div>{action}</div>}
          EOF
          cat > ui/FilterBar.tsx <<'EOF'
          import * as React from 'react'; import { cn } from '../utils/cn';
          export function FilterBar({search,filters,clearAction,className,...props}:React.HTMLAttributes<HTMLElement>&{search?:React.ReactNode;filters?:React.ReactNode;clearAction?:React.ReactNode}){return <section className={cn('flex flex-col gap-3 rounded-2xl border border-[color:var(--color-border)] bg-[color:var(--color-surface)] p-3 sm:flex-row sm:items-end',className)} {...props}><div className="min-w-0 flex-1">{search}</div>{filters?<div className="flex flex-wrap gap-2">{filters}</div>:null}{clearAction}</section>}
          EOF
          cat > ui/Pagination.tsx <<'EOF'
          import * as React from 'react'; import { Button } from './Button';
          export function Pagination({page,pageCount,onPageChange,label='Pagination'}:{page:number;pageCount:number;onPageChange:(page:number)=>void;label?:string}){if(pageCount<=1)return null;return <nav aria-label={label} className="flex items-center justify-between gap-3"><Button variant="secondary" size="sm" disabled={page<=1} onClick={()=>onPageChange(page-1)}>Sebelumnya</Button><span className="text-sm text-[color:var(--color-text-soft)]">{page} / {pageCount}</span><Button variant="secondary" size="sm" disabled={page>=pageCount} onClick={()=>onPageChange(page+1)}>Berikutnya</Button></nav>}
          EOF
          cat > ui/Table.tsx <<'EOF'
          import * as React from 'react'; import { cn } from '../utils/cn';
          export const TableScrollArea=React.forwardRef<HTMLDivElement,React.HTMLAttributes<HTMLDivElement>>(({className,...p},r)=><div ref={r} className={cn('w-full overflow-x-auto rounded-2xl border border-[color:var(--color-border)]',className)} {...p}/>); TableScrollArea.displayName='TableScrollArea';
          export const Table=React.forwardRef<HTMLTableElement,React.TableHTMLAttributes<HTMLTableElement>>(({className,...p},r)=><table ref={r} className={cn('w-full min-w-[640px] border-collapse text-sm',className)} {...p}/>); Table.displayName='Table';
          export const TableHeader=React.forwardRef<HTMLTableSectionElement,React.HTMLAttributes<HTMLTableSectionElement>>((p,r)=><thead ref={r} {...p}/>); TableHeader.displayName='TableHeader';
          export const TableBody=React.forwardRef<HTMLTableSectionElement,React.HTMLAttributes<HTMLTableSectionElement>>((p,r)=><tbody ref={r} {...p}/>); TableBody.displayName='TableBody';
          export const TableRow=React.forwardRef<HTMLTableRowElement,React.HTMLAttributes<HTMLTableRowElement>>(({className,...p},r)=><tr ref={r} className={cn('border-b border-[color:var(--color-border)] last:border-0',className)} {...p}/>); TableRow.displayName='TableRow';
          export const TableHead=React.forwardRef<HTMLTableCellElement,React.ThHTMLAttributes<HTMLTableCellElement>>(({className,...p},r)=><th ref={r} className={cn('bg-[color:var(--color-surface-muted)] px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-[color:var(--color-text-soft)]',className)} {...p}/>); TableHead.displayName='TableHead';
          export const TableCell=React.forwardRef<HTMLTableCellElement,React.TdHTMLAttributes<HTMLTableCellElement>>(({className,...p},r)=><td ref={r} className={cn('px-4 py-3 align-top text-[color:var(--color-text)]',className)} {...p}/>); TableCell.displayName='TableCell';
          EOF
          cat > ui/ConfirmDialog.tsx <<'EOF'
          'use client'; import * as React from 'react'; import { Modal } from './Modal'; import { Button } from './Button';
          export function ConfirmDialog({open,title,description,confirmLabel,cancelLabel='Batal',tone='primary',loading=false,onConfirm,onOpenChange}:{open:boolean;title:string;description:string;confirmLabel:string;cancelLabel?:string;tone?:'primary'|'danger';loading?:boolean;onConfirm:()=>void;onOpenChange:(open:boolean)=>void}){return <Modal open={open} onClose={()=>onOpenChange(false)} title={title} footer={<><Button variant="secondary" onClick={()=>onOpenChange(false)} disabled={loading}>{cancelLabel}</Button><Button variant={tone==='danger'?'destructive':'default'} loading={loading} loadingLabel={confirmLabel} onClick={onConfirm}>{confirmLabel}</Button></>}><p className="text-sm leading-6 text-[color:var(--color-text-soft)]">{description}</p></Modal>}
          EOF
          cat > ui/__tests__/StatusBadge.test.tsx <<'EOF'
          import * as React from 'react'; import { render, screen } from '@testing-library/react'; import { it, expect } from 'vitest'; import { StatusBadge } from '../StatusBadge';
          it('exposes status meaning as text rather than color alone',()=>{render(<StatusBadge tone="warning">Perlu tindakan</StatusBadge>);expect(screen.getByText('Perlu tindakan')).toBeVisible()});
          EOF
          cat > ui/__tests__/FilterBar.test.tsx <<'EOF'
          import * as React from 'react'; import { render, screen } from '@testing-library/react'; import { it, expect } from 'vitest'; import { FilterBar } from '../FilterBar'; import { Input } from '../Input';
          it('groups search, filters, and clear action in a named region',()=>{render(<FilterBar aria-label="Filter konten" search={<Input aria-label="Cari"/>} filters={<button>Aktif</button>} clearAction={<button>Reset</button>}/>);const region=screen.getByRole('region',{name:'Filter konten'});expect(region).toContainElement(screen.getByRole('textbox',{name:'Cari'}));expect(region).toContainElement(screen.getByRole('button',{name:'Reset'}))});
          EOF
          cat > ui/index.ts <<'EOF'
          export { Button, buttonVariants } from './Button'; export type { ButtonProps } from './Button';
          export { Card, CardHeader, CardFooter, CardTitle, CardDescription, CardContent } from './Card';
          export { Skeleton } from './Skeleton'; export { Input } from './Input'; export { EmptyState } from './EmptyState'; export { Modal } from './Modal';
          export { StatusBadge } from './StatusBadge'; export type { StatusTone } from './StatusBadge'; export { Alert } from './Alert'; export { PageHeader } from './PageHeader'; export { SectionHeader } from './SectionHeader'; export { FilterBar } from './FilterBar'; export { Pagination } from './Pagination'; export { Table, TableHeader, TableBody, TableRow, TableHead, TableCell, TableScrollArea } from './Table'; export { ConfirmDialog } from './ConfirmDialog';
          export { GuidedTour } from './GuidedTour'; export type { TourStep } from './GuidedTour'; export { useGuidedTour } from './useGuidedTour';
          EOF
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('tsconfig.build.json'); data=json.loads(p.read_text()); data['exclude']=['dist','node_modules','**/__tests__/**','test/**','vitest.config.ts']; p.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: Verify GREEN
        working-directory: frontend/packages
        run: |
          set -euo pipefail
          npm test
          npm run build
      - name: Persist verified foundation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/packages
          git commit -m 'feat: establish shared UI semantic foundation'
          git push origin HEAD:feat/ui-foundation-20260907
