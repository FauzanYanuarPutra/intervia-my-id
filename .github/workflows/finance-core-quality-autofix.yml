name: Finance Core Quality Autofix

on:
  push:
    branches:
      - fix/finance-core-quality-20260915

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/finance-core-quality-20260915
          fetch-depth: 0
      - name: Patch React compiler lint violations
        shell: python
        run: |
          from pathlib import Path

          ledger_path = Path('frontend/apps/usaha/src/components/business-control/FinanceLedgerV2.tsx')
          ledger = ledger_path.read_text(encoding='utf-8')
          old = """  useEffect(() => {\n    reloadAll(true).catch(() => {\n      // Initial server data remains a safe fallback if Finance Core is temporarily unavailable.\n    });\n    // businessId is stable for this page instance.\n    // eslint-disable-next-line react-hooks/exhaustive-deps\n  }, [businessId]);\n"""
          new = """  useEffect(() => {\n    const timer = window.setTimeout(() => {\n      void reloadAll(true).catch(() => {\n        // Initial server data remains a safe fallback if Finance Core is temporarily unavailable.\n      });\n    }, 0);\n    return () => window.clearTimeout(timer);\n    // businessId is stable for this page instance.\n    // eslint-disable-next-line react-hooks/exhaustive-deps\n  }, [businessId]);\n"""
          if old not in ledger:
              raise SystemExit('FinanceLedgerV2 effect block not found')
          ledger_path.write_text(ledger.replace(old, new, 1), encoding='utf-8')

          planning_path = Path('frontend/apps/usaha/src/components/business-control/FinancePlanningWorkspaceV2.tsx')
          planning = planning_path.read_text(encoding='utf-8')
          old_sort = """  const sortedObligations = useMemo(\n    () => [...activeObligations].sort((a, b) => a.next_due_on.localeCompare(b.next_due_on)),\n    [activeObligations],\n  );\n"""
          new_sort = """  const sortedObligations = [...activeObligations].sort((a, b) =>\n    a.next_due_on.localeCompare(b.next_due_on),\n  );\n"""
          if old_sort not in planning:
              raise SystemExit('FinancePlanningWorkspaceV2 memo block not found')
          planning = planning.replace(old_sort, new_sort, 1)
          old_effect = """  useEffect(() => {\n    reloadFinanceCore().catch(() => {\n      // Page stays usable for planning if the authoritative summary is temporarily unavailable.\n    });\n    // eslint-disable-next-line react-hooks/exhaustive-deps\n  }, [businessId]);\n"""
          new_effect = """  useEffect(() => {\n    const timer = window.setTimeout(() => {\n      void reloadFinanceCore().catch(() => {\n        // Page stays usable for planning if the authoritative summary is temporarily unavailable.\n      });\n    }, 0);\n    return () => window.clearTimeout(timer);\n    // eslint-disable-next-line react-hooks/exhaustive-deps\n  }, [businessId]);\n"""
          if old_effect not in planning:
              raise SystemExit('FinancePlanningWorkspaceV2 effect block not found')
          planning_path.write_text(planning.replace(old_effect, new_effect, 1), encoding='utf-8')
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt
      - name: Format marketplace Finance Core
        working-directory: services/marketplace_service
        run: cargo +1.97.1 fmt
      - name: Commit autofixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            frontend/apps/usaha/src/components/business-control/FinanceLedgerV2.tsx \
            frontend/apps/usaha/src/components/business-control/FinancePlanningWorkspaceV2.tsx \
            services/marketplace_service/src/businesses/finance_core.rs \
            services/marketplace_service/src/businesses/finance_core_routes.rs \
            services/marketplace_service/src/businesses/finance_core_tests.rs
          if git diff --cached --quiet; then
            echo 'No autofix changes were required.'
            exit 0
          fi
          git commit -m 'fix: satisfy Finance Core quality gates'
          git push origin HEAD:fix/finance-core-quality-20260915
