name: Temp Refresh Frontend Lockfiles

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Refresh frontend lockfiles
        shell: bash
        run: |
          set -euo pipefail
          for dir in frontend/apps/www frontend/apps/usaha frontend/apps/crm frontend/apps/cms; do
            echo "::group::Refreshing $dir"
            cd "$GITHUB_WORKSPACE/$dir"
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund --legacy-peer-deps
            echo "::endgroup::"
          done
      - name: Commit refreshed lockfiles
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/apps/www/package-lock.json frontend/apps/usaha/package-lock.json frontend/apps/crm/package-lock.json frontend/apps/cms/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes."
            exit 0
          fi
          git commit -m "chore: refresh frontend lockfiles"
          git push origin HEAD:fix/location-media-map-current
