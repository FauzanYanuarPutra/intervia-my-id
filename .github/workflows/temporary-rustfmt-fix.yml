name: Temporary Rustfmt Repair

on:
  push:
    branches: [fix/final-build-errors]
    paths-ignore:
      - .github/workflows/temporary-rustfmt-fix.yml

permissions:
  contents: write

jobs:
  rustfmt:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Format marketplace_service
        run: cargo fmt --manifest-path services/marketplace_service/Cargo.toml

      - name: Format ai_service
        run: cargo fmt --manifest-path services/ai_service/Cargo.toml

      - name: Commit formatter changes
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- services/marketplace_service services/ai_service; then
            echo "Rustfmt made no changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/marketplace_service services/ai_service
          git commit -m "chore: apply rustfmt [skip ci]"
          git push origin HEAD:fix/final-build-errors
