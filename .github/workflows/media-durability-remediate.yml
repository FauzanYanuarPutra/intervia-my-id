# Temporary branch-only remediation workflow. Remove after verified remediation is committed.
name: Media Durability Remediation

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: media-durability-remediate
  cancel-in-progress: false

jobs:
  remediate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.ref == 'hardening/media-durability-20260905'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: hardening/media-durability-20260905
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28.0'
          elixir-version: '1.18.4'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/apps/www/package-lock.json
            frontend/apps/cms/package-lock.json
            frontend/apps/crm/package-lock.json
            frontend/apps/usaha/package-lock.json

      - name: Configure git
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Format Rust services
        shell: bash
        run: |
          set -euo pipefail
          for service in identity_service marketplace_service community_service ai_service; do
            [[ -f "services/$service/Cargo.toml" ]] || continue
            (cd "services/$service" && cargo fmt)
          done

      - name: Format Chat service
        shell: bash
        run: |
          set -euo pipefail
          (cd services/chat_service && mix format)

      - name: Remediate frontend compatible dependencies
        shell: bash
        run: |
          set -euo pipefail
          for app in www cms crm usaha; do
            dir="frontend/apps/$app"
            [[ -f "$dir/package.json" ]] || continue
            pushd "$dir" >/dev/null
            # @emoji-mart/react 1.1.1 is the current upstream release and has a stale React <=18 peer declaration.
            # Use legacy peer resolution only while regenerating the lockfile, then prove runtime compatibility below with lint/test/build.
            npm install --package-lock-only --ignore-scripts --legacy-peer-deps next@16.3.4
            npm install --package-lock-only --ignore-scripts --legacy-peer-deps --save-dev postcss@8.5.8
            npm update --package-lock-only --ignore-scripts --legacy-peer-deps
            npm audit fix --package-lock-only --ignore-scripts --legacy-peer-deps || true
            popd >/dev/null
          done

      - name: Update compatible Rust lockfile dependencies
        shell: bash
        run: |
          set -euo pipefail
          for service in identity_service marketplace_service community_service ai_service; do
            dir="services/$service"
            [[ -f "$dir/Cargo.toml" ]] || continue
            (cd "$dir" && cargo update)
          done

      - name: Diagnose vulnerable Rust lockfile chain
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import tomllib
          from pathlib import Path

          lock = Path("services/marketplace_service/Cargo.lock")
          packages = tomllib.loads(lock.read_text(encoding="utf-8")).get("package", [])

          def dep_name(dep: str) -> str:
              return dep.split(" ", 1)[0]

          watched = {
              "rsa",
              "sqlx-mysql",
              "sqlx-sqlite",
              "sqlx-macros",
              "sqlx-macros-core",
              "jsonwebtoken",
          }

          print("== watched lockfile packages ==")
          for package in packages:
              if package["name"] in watched:
                  print(
                      f'{package["name"]} {package["version"]}: '
                      f'{package.get("dependencies", [])}'
                  )

          frontier = {"rsa"}
          seen = set()
          level = 0
          while frontier:
              print(f"== reverse lockfile parents level {level}: {sorted(frontier)} ==")
              parents = set()
              for package in packages:
                  deps = package.get("dependencies", [])
                  dep_names = {dep_name(dep) for dep in deps}
                  hits = sorted(dep_names & frontier)
                  if not hits:
                      continue
                  ident = (package["name"], package["version"])
                  if ident in seen:
                      continue
                  seen.add(ident)
                  print(f'{package["name"]} {package["version"]} -> {hits}: {deps}')
                  parents.add(package["name"])
              frontier = parents
              level += 1
          PY

      - name: Verify frontend production audits
        shell: bash
        run: |
          set -euo pipefail
          for app in www cms crm usaha; do
            dir="frontend/apps/$app"
            [[ -f "$dir/package-lock.json" ]] || continue
            echo "== npm audit: $app =="
            (cd "$dir" && npm audit --omit=dev --audit-level=high)
          done

      - name: Verify Rust security audits
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-audit --locked
          for service in identity_service marketplace_service community_service ai_service; do
            dir="services/$service"
            [[ -f "$dir/Cargo.lock" ]] || continue
            echo "== cargo audit: $service =="
            (cd "$dir" && cargo audit)
          done

      - name: Verify Rust quality
        shell: bash
        run: |
          set -euo pipefail
          for service in identity_service marketplace_service community_service ai_service; do
            dir="services/$service"
            [[ -f "$dir/Cargo.toml" ]] || continue
            (cd "$dir" && cargo fmt --check)
            (cd "$dir" && cargo clippy --all-targets --all-features -- -D warnings)
            (cd "$dir" && cargo test --all-targets --all-features)
          done

      - name: Verify Chat quality
        shell: bash
        run: |
          set -euo pipefail
          cd services/chat_service
          mix deps.get
          mix format --check-formatted
          mix test

      - name: Verify public frontend
        shell: bash
        run: |
          set -euo pipefail
          cd frontend/apps/www
          npm ci --ignore-scripts --legacy-peer-deps
          npm run lint
          npm test
          npm run build

      - name: Commit verified remediation and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/media-durability-remediate.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'No remediation changes were needed.'
            exit 0
          fi
          git commit -m 'chore: remediate quality and security baseline'
          git push origin HEAD:hardening/media-durability-20260905
