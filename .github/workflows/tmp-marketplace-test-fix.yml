name: Temporary Marketplace Regression Fix

on:
  push:
    branches:
      - feat/business-os-wave-2-1d-team-access-hardening

permissions:
  contents: write

jobs:
  fix-marketplace-regression-test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/business-os-wave-2-1d-team-access-hardening
      - name: Update stale historical-sale regression contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("services/marketplace_service/src/businesses/recipe_sales_versioning_tests.rs")
          text = path.read_text()
          text = text.replace(
              "use super::sales::{CreateSaleLineRequest, CreateSaleRequest, SaleRepository, SaleRepositoryError};",
              "use super::sales::{CreateSaleLineRequest, CreateSaleRequest, SaleRepository};",
              1,
          )
          start_marker = "#[sqlx::test(migrations = \"./migrations\")]\nasync fn sale_before_first_immutable_version_does_not_use_legacy_projection(pool: PgPool) {"
          end_marker = "\n#[sqlx::test(migrations = \"./migrations\")]\nasync fn current_day_sale_uses_version_effective_at_posting_time(pool: PgPool) {"
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit("historical-sale regression markers did not match expected source")
          prefix, tail = text.split(start_marker, 1)
          _, suffix = tail.split(end_marker, 1)
          replacement = '''#[sqlx::test(migrations = "./migrations")]
async fn sale_before_first_immutable_version_does_not_use_legacy_projection(pool: PgPool) {
    let seeded = seed_versioned_sale(&pool).await;
    let created = SaleRepository::new(pool.clone())
        .create(
            seeded.actor_id,
            seeded.business_id,
            seeded.organization_id,
            Uuid::new_v4(),
            CreateSaleRequest {
                occurred_on: NaiveDate::from_ymd_opt(2026, 8, 31).unwrap(),
                channel_key: Some("offline".into()),
                account_key: "cash".into(),
                lines: vec![CreateSaleLineRequest {
                    product_id: seeded.product_id,
                    quantity: Decimal::ONE,
                    unit_price_amount: 12_000,
                    discount_amount: 0,
                }],
            },
        )
        .await
        .unwrap();

    assert_eq!(created.sale.sale.cogs_amount, None);
    assert!(!created.sale.sale.cost_complete);
    assert_eq!(created.sale.lines[0].unit_cogs_amount, None);
    assert_eq!(created.sale.lines[0].line_cogs_amount, None);
    assert_eq!(
        created.sale.lines[0]
            .cost_snapshot
            .get("status")
            .and_then(|value| value.as_str()),
        Some("incomplete")
    );
    assert_eq!(
        created.sale.lines[0]
            .cost_snapshot
            .get("reason")
            .and_then(|value| value.as_str()),
        Some("recipe_missing")
    );

    let persisted_version_id: Option<Uuid> =
        sqlx::query_scalar("SELECT recipe_version_id FROM business_sale_lines WHERE sale_id=$1")
            .bind(created.sale.sale.id)
            .fetch_one(&pool)
            .await
            .unwrap();
    assert_eq!(persisted_version_id, None);

    let stock: Decimal =
        sqlx::query_scalar("SELECT stock_quantity FROM business_ingredients WHERE id=$1")
            .bind(seeded.ingredient_id)
            .fetch_one(&pool)
            .await
            .unwrap();
    assert_eq!(stock, Decimal::from(5_000));

    let movement_count: i64 = sqlx::query_scalar(
        "SELECT COUNT(*) FROM business_inventory_movements WHERE source_type='business_sale' AND source_id=$1",
    )
    .bind(created.sale.sale.id)
    .fetch_one(&pool)
    .await
    .unwrap();
    assert_eq!(movement_count, 0);

    let finance: (String, i64) = sqlx::query_as(
        "SELECT entry_type, amount FROM business_finance_entries WHERE business_id=$1 AND source_type='business_sale' AND source_id=$2",
    )
    .bind(seeded.business_id)
    .bind(created.sale.sale.id)
    .fetch_one(&pool)
    .await
    .unwrap();
    assert_eq!(finance.0, "sale_income");
    assert_eq!(finance.1, 12_000);
}
'''
          path.write_text(prefix + replacement + end_marker + suffix)
          PY
      - name: Format marketplace
        run: cargo fmt --manifest-path services/marketplace_service/Cargo.toml
      - name: Verify targeted regression
        working-directory: services/marketplace_service
        run: cargo test --locked sale_before_first_immutable_version_does_not_use_legacy_projection -- --exact
      - name: Verify strict clippy
        working-directory: services/marketplace_service
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Commit regression contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/marketplace_service/src/businesses/recipe_sales_versioning_tests.rs
          git diff --cached --quiet && exit 0
          git commit -m "test(marketplace): align historical sale costing contract"
          git push origin HEAD:feat/business-os-wave-2-1d-team-access-hardening
