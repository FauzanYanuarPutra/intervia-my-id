name: News Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: news-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  news-contract:
    name: News editorial and SEO contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate News editorial, trust, and SEO invariants
        run: python scripts/ci/check_news_contract.py
