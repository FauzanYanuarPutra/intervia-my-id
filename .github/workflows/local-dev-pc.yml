name: Local Dev PC

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-dev-pc
  cancel-in-progress: false

jobs:
  run-local-dev:
    name: Run Lajukan local stack on Windows PC
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 120

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          clean: false
          fetch-depth: 1

      - name: Prepare run directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\artifacts" | Out-Null
          Remove-Item "$env:GITHUB_WORKSPACE\artifacts\*" -Force -Recurse -ErrorAction SilentlyContinue

      - name: Verify Windows and Docker runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "Host: $env:COMPUTERNAME"
          Write-Host "User: $env:USERNAME"
          Write-Host "PowerShell: $($PSVersionTable.PSVersion)"
          docker version
          docker compose version
          docker info --format '{{json .ServerVersion}}'

      - name: Run Lajukan launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $log = Join-Path $env:GITHUB_WORKSPACE "artifacts\up.log"
          $args = @(
            "-NoLogo",
            "-NoProfile",
            "-ExecutionPolicy", "Bypass",
            "-File", "$env:GITHUB_WORKSPACE\up.ps1",
            "-Environment", "development",
            "-Profile", "backoffice",
            "-Profile", "edge",
            "-Profile", "local-ai",
            "-Profile", "kyc",
            "-Profile", "devtools",
            "-Profile", "tunnel",
            "-Build"
          )

          Write-Host "Running: pwsh $($args -join ' ')"
          & pwsh @args 2>&1 | Tee-Object -FilePath $log
          $exitCode = $LASTEXITCODE
          Write-Host "up.ps1 exit code: $exitCode"

          if ($exitCode -ne 0) {
            exit $exitCode
          }

      - name: Smoke test application runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $compose = @()
          if (Test-Path "$env:GITHUB_WORKSPACE\.env.development") {
            $compose += @("--env-file", ".env.development")
          } elseif (Test-Path "$env:GITHUB_WORKSPACE\.env") {
            $compose += @("--env-file", ".env")
          }
          $compose += @("-f", "docker-compose.yml")
          if (Test-Path "$env:GITHUB_WORKSPACE\docker-compose.dev.yml") {
            $compose += @("-f", "docker-compose.dev.yml")
          }

          foreach ($profile in @("backoffice","edge","local-ai","kyc","devtools","tunnel")) {
            $compose += @("--profile", $profile)
          }

          Write-Host "Checking marketplace readiness..."
          & docker compose @compose exec -T marketplace_service curl -fsS http://localhost:8081/ready | Write-Host

          Write-Host "Checking AI readiness..."
          & docker compose @compose exec -T ai_service curl -fsS http://localhost:8080/ready | Write-Host

          Write-Host "Checking AI deep inference..."
          & docker compose @compose exec -T ai_service curl -fsS http://localhost:8080/ready/deep | Write-Host
      - name: Collect Docker diagnostics
        if: always()
        shell: pwsh
        run: |
          $diag = Join-Path $env:GITHUB_WORKSPACE "artifacts\docker-diagnostics.txt"
          $ErrorActionPreference = "Continue"

          "===== docker info =====" | Out-File $diag
          docker info 2>&1 | Out-File $diag -Append

          ([Environment]::NewLine + "===== docker ps -a =====") | Out-File $diag -Append
          docker ps -a 2>&1 | Out-File $diag -Append

          if (Test-Path "$env:GITHUB_WORKSPACE\docker-compose.yml") {
            $envFile = if (Test-Path "$env:GITHUB_WORKSPACE\.env.development") { ".env.development" } elseif (Test-Path "$env:GITHUB_WORKSPACE\.env") { ".env" } else { $null }
            $composeArgs = @()
            if ($envFile) {
              $composeArgs += @("--env-file", $envFile)
            }
            $composeArgs += @("-f", "docker-compose.yml")
            if (Test-Path "$env:GITHUB_WORKSPACE\docker-compose.dev.yml") {
              $composeArgs += @("-f", "docker-compose.dev.yml")
            }

            foreach ($profile in @("backoffice","edge","local-ai","kyc","devtools","tunnel")) {
              $composeArgs += @("--profile", $profile)
            }

            ([Environment]::NewLine + "===== docker compose ps -a =====") | Out-File $diag -Append
            & docker compose @composeArgs ps -a 2>&1 | Out-File $diag -Append

            ([Environment]::NewLine + "===== docker compose logs (tail 250) =====") | Out-File $diag -Append
            & docker compose @composeArgs logs --no-color --tail 250 2>&1 | Out-File $diag -Append
          }

      - name: Classify likely failure cause
        if: always()
        shell: pwsh
        run: |
          $log = Join-Path $env:GITHUB_WORKSPACE "artifacts\up.log"
          $text = if (Test-Path $log) { Get-Content -Raw $log } else { "" }

          $matches = [ordered]@{
            "TypeScript / Next.js" = '(?m)TS\d{3,5}|Failed to type check|Type error|webpack.*error'
            "Rust / Cargo" = '(?m)error\[E\d+\]|cargo build.*failed|rustc'
            "Docker Engine" = '(?i)Cannot connect to the Docker daemon|dockerDesktopLinuxEngine|API route and version|/_ping|error during connect|error response from daemon'
            "Docker BuildKit" = '(?i)frontend grpc server closed unexpectedly|BuildKit|failed to solve|rpc error.*(?:Unavailable|Canceled)'
            "Docker registry / network" = '(?i)TLS handshake timeout|context deadline exceeded|i/o timeout|temporary failure in name resolution|registry-1\.docker\.io|too many requests|HTTP (?:502|503|504)'
            "Resource / memory / disk" = '(?i)out of memory|cannot allocate memory|no space left on device|ENOSPC|signal: killed'
            "PowerShell / launcher" = '(?i)CommandNotFoundException|ParameterBindingException|At .*\.ps1:\d+'
          }

          Add-Content $env:GITHUB_STEP_SUMMARY "## Lajukan local run"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Host: $env:COMPUTERNAME"
          Add-Content $env:GITHUB_STEP_SUMMARY "- User: $env:USERNAME"

          $found = $false
          foreach ($entry in $matches.GetEnumerator()) {
            if ($text -match $entry.Value) {
              $found = $true
              Add-Content $env:GITHUB_STEP_SUMMARY "- **$($entry.Key)** detected"
            }
          }

          if (-not $found) {
            Add-Content $env:GITHUB_STEP_SUMMARY "- No known error signature matched; open artifacts/up.log."
          }

      - name: Upload local run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lajukan-local-run
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
