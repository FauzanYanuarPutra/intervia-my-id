name: Frontend Security Repair

on:
  push:
    branches:
      - security/frontend-dependency-audit-20260907
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Refresh compatible production dependencies
        shell: bash
        run: |
          set -euo pipefail
          for dir in frontend/apps/www frontend/apps/usaha frontend/apps/cms frontend/apps/crm; do
            [[ -f "$dir/package-lock.json" ]] || continue
            echo "==> repairing $dir"
            (
              cd "$dir"
              npm ci --legacy-peer-deps --no-audit --no-fund
              npm audit fix --omit=dev --legacy-peer-deps --no-audit --no-fund
              npm audit --omit=dev --audit-level=high
            )
          done
      - name: Commit lockfile/package changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No dependency changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/apps/*/package.json frontend/apps/*/package-lock.json
          git commit -m "security: refresh frontend production dependencies"
          git push origin HEAD:security/frontend-dependency-audit-20260907
