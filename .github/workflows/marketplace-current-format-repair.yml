name: Marketplace Current Quality Repair

on:
  push:
    branches:
      - fix/marketplace-quality-current-20260907
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Add narrow Clippy exceptions for legacy boundary helpers
        shell: python
        run: |
          from pathlib import Path

          targets = {
              Path('services/marketplace_service/src/order_engine.rs'): [
                  'async fn insert_state_transition(',
              ],
              Path('services/marketplace_service/src/main.rs'): [
                  'async fn find_reusable_pending_topup_for_transaction(',
                  'async fn insert_wallet_ledger_entry_tx(',
                  'async fn build_provider_checkout(',
                  'async fn update_transaction_status(',
              ],
          }

          marker = '#[allow(clippy::too_many_arguments)]\n'
          for path, signatures in targets.items():
              text = path.read_text(encoding='utf-8')
              for signature in signatures:
                  needle = marker + signature
                  if needle in text:
                      continue
                  if signature not in text:
                      raise SystemExit(f'missing expected function signature: {path}: {signature}')
                  text = text.replace(signature, needle, 1)
              path.write_text(text, encoding='utf-8')
      - name: Apply machine-safe Clippy fixes
        working-directory: services/marketplace_service
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --fix --locked --all-targets --allow-dirty --allow-staged -- -D warnings || true
          cargo fmt
          cargo fmt --check
      - name: Commit repair output before strict verification
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No repair changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/marketplace_service
          git commit -m "fix: apply current marketplace clippy repairs"
          git push origin HEAD:fix/marketplace-quality-current-20260907
      - name: Verify Clippy after repair
        working-directory: services/marketplace_service
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run locked tests
        working-directory: services/marketplace_service
        run: cargo test --locked
