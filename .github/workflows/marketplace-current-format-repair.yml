name: Marketplace Current Format Repair

on:
  push:
    branches:
      - fix/marketplace-quality-current-20260907
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Format marketplace service
        working-directory: services/marketplace_service
        run: cargo fmt
      - name: Verify formatter output
        working-directory: services/marketplace_service
        run: cargo fmt --check
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatter changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/marketplace_service
          git commit -m "style: format current marketplace service"
          git push origin HEAD:fix/marketplace-quality-current-20260907
