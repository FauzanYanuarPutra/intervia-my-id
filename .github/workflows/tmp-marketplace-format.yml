name: Temporary Marketplace Format

on:
  push:
    branches:
      - feat/business-os-wave-2-1d-team-access-hardening

permissions:
  contents: write

jobs:
  format-marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/business-os-wave-2-1d-team-access-hardening
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Apply rustfmt
        run: cargo fmt --manifest-path services/marketplace_service/Cargo.toml
      - name: Commit formatting when needed
        run: |
          if git diff --quiet; then
            echo "Marketplace is already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/marketplace_service
          git commit -m "style(marketplace): apply cargo fmt"
          git push origin HEAD:feat/business-os-wave-2-1d-team-access-hardening
