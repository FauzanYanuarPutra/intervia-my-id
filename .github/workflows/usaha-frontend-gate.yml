name: Usaha Frontend Gate

on:
  push:
    branches: [main]
    paths:
      - 'frontend/apps/usaha/**'
      - 'frontend/packages/**'
      - '.github/workflows/usaha-frontend-gate.yml'
  pull_request:
    paths:
      - 'frontend/apps/usaha/**'
      - 'frontend/packages/**'
      - '.github/workflows/usaha-frontend-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: usaha-frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, tests, and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend/apps/usaha
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/apps/usaha/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint
