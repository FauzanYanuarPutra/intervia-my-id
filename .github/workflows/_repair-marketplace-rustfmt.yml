name: repair-marketplace-rustfmt

on:
  push:
    branches: [main]
    paths:
      - 'services/marketplace_service/**/*.rs'
      - 'services/marketplace_service/Cargo.toml'
      - 'services/marketplace_service/Cargo.lock'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/marketplace_service
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all
      - name: Commit formatting fixes
        working-directory: .
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/marketplace_service
          git commit -m "style(marketplace): apply rustfmt [skip ci]"
          git push origin main
