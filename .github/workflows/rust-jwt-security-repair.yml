name: Rust Security Repair

on:
  push:
    branches:
      - security/rust-jwt-aws-lc-20260907

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          ref: security/rust-jwt-aws-lc-20260907
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Merge current main
        run: |
          set -euo pipefail
          git fetch origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit origin/main
      - name: Use safe dependency feature sets
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          for rel in [
              'services/identity_service/Cargo.toml',
              'services/marketplace_service/Cargo.toml',
              'services/community_service/Cargo.toml',
          ]:
              path = Path(rel)
              text = path.read_text()
              old = 'jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }'
              new = 'jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }'
              if old in text:
                  text = text.replace(old, new)
              elif new not in text:
                  raise SystemExit(f'unexpected jsonwebtoken configuration in {rel}')
              path.write_text(text)

          marketplace = Path('services/marketplace_service/Cargo.toml')
          text = marketplace.read_text()
          text = text.replace('sqlx = { version = "0.8.6"', 'sqlx = { version = "0.9.0"')
          text = text.replace('sqlx = { version = "0.9.0", default-features = false, features = [\n    "runtime-tokio-rustls",\n    "postgres",\n    "uuid",\n    "chrono",\n    "json",\n    "rust_decimal",\n    "derive",\n    "migrate",\n] }', 'sqlx = { version = "0.9.0", default-features = false, features = [\n    "runtime-tokio-rustls",\n    "postgres",\n    "uuid",\n    "chrono",\n    "json",\n    "rust_decimal",\n    "macros",\n    "migrate",\n] }')
          if '"derive",' in text and 'sqlx = { version = "0.9.0"' in text:
              text = text.replace('"derive",', '"macros",')
          if 'sqlx = { version = "0.9.0"' not in text or '"macros",' not in text:
              raise SystemExit('Marketplace SQLx 0.9 macros configuration was not applied')
          marketplace.write_text(text)

          source = Path('services/marketplace_service/src/main.rs')
          text = source.read_text()
          old_import = 'use sqlx::{postgres::PgPoolOptions, FromRow, PgPool, Postgres, QueryBuilder, Row};'
          new_import = 'use sqlx::{postgres::PgPoolOptions, AssertSqlSafe, FromRow, PgPool, Postgres, QueryBuilder, Row};'
          if old_import in text:
              text = text.replace(old_import, new_import)
          elif new_import not in text:
              raise SystemExit('unexpected SQLx import layout in Marketplace main.rs')
          old_query = 'let rows = sqlx::query_as::<_, PublicUmkmStoreRow>(&store_sql)'
          new_query = 'let rows = sqlx::query_as::<_, PublicUmkmStoreRow>(AssertSqlSafe(store_sql))'
          if old_query in text:
              text = text.replace(old_query, new_query, 1)
          elif new_query not in text:
              raise SystemExit('expected audited dynamic store query was not found')
          source.write_text(text)
          PY
      - name: Refresh Rust lockfiles within declared constraints
        run: |
          set -euo pipefail
          for service in identity_service marketplace_service community_service ai_service; do
            echo "Updating $service"
            (cd "services/$service" && cargo update)
          done
      - name: Assert RSA is absent from Marketplace lockfile
        working-directory: services/marketplace_service
        run: |
          set -euo pipefail
          if grep -q '^name = "rsa"$' Cargo.lock; then
            echo 'rsa remains in the Marketplace lockfile' >&2
            exit 1
          fi
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Verify Rust services and advisories
        run: |
          set -euo pipefail
          for service in identity_service marketplace_service community_service ai_service; do
            echo "=== $service ==="
            cd "$GITHUB_WORKSPACE/services/$service"
            cargo fmt --check
            cargo clippy --locked --all-targets -- -D warnings
            cargo test --locked
            cargo audit
          done
      - name: Commit verified Rust security refresh
        run: |
          set -euo pipefail
          git add \
            services/identity_service/Cargo.toml services/identity_service/Cargo.lock \
            services/marketplace_service/Cargo.toml services/marketplace_service/Cargo.lock services/marketplace_service/src/main.rs \
            services/community_service/Cargo.toml services/community_service/Cargo.lock \
            services/ai_service/Cargo.toml services/ai_service/Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m 'security: refresh Rust dependency advisories'
          fi
          git push origin HEAD:security/rust-jwt-aws-lc-20260907
