name: Rust Security Repair

on:
  push:
    branches: [security/rust-jwt-aws-lc-20260907]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          ref: security/rust-jwt-aws-lc-20260907
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Merge current main
        run: |
          set -euo pipefail
          git fetch origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit origin/main
      - name: Apply targeted Rust security changes
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          for rel in [
              'services/identity_service/Cargo.toml',
              'services/marketplace_service/Cargo.toml',
              'services/community_service/Cargo.toml',
          ]:
              path = Path(rel)
              text = path.read_text().replace(
                  'jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }',
                  'jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }',
              )
              if 'jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }' not in text:
                  raise SystemExit(f'unexpected jsonwebtoken configuration in {rel}')
              path.write_text(text)

          cargo = Path('services/marketplace_service/Cargo.toml')
          text = cargo.read_text().replace(
              'sqlx = { version = "0.8.6"',
              'sqlx = { version = "0.9.0"',
          )
          if 'sqlx = { version = "0.9.0"' not in text or '"macros",' not in text:
              raise SystemExit('expected Marketplace SQLx 0.9 with macros feature')
          if 'serde = { version = "1", features = [' not in text or '"derive"' not in text:
              raise SystemExit('Marketplace Serde derive feature is missing')
          cargo.write_text(text)

          source = Path('services/marketplace_service/src/main.rs')
          text = source.read_text()
          text = text.replace(
              'use sqlx::{postgres::PgPoolOptions, FromRow, PgPool, Postgres, QueryBuilder, Row};',
              'use sqlx::{postgres::PgPoolOptions, AssertSqlSafe, FromRow, PgPool, Postgres, QueryBuilder, Row};',
          )
          text = text.replace(
              'let rows = sqlx::query_as::<_, PublicUmkmStoreRow>(&store_sql)',
              'let rows = sqlx::query_as::<_, PublicUmkmStoreRow>(AssertSqlSafe(store_sql))',
              1,
          )
          if 'AssertSqlSafe(store_sql)' not in text:
              raise SystemExit('audited dynamic store query was not applied')
          source.write_text(text)
          PY
      - name: Refresh lockfiles and patched advisory versions
        run: |
          set -euo pipefail
          for service in identity_service marketplace_service community_service ai_service; do
            cd "$GITHUB_WORKSPACE/services/$service"
            cargo update
            cargo update -p bytes --precise 1.11.1
            cargo update -p quinn-proto --precise 0.11.15
            cargo update -p rustls-webpki --precise 0.103.13
          done
      - name: Assert patched advisory floors
        run: |
          set -euo pipefail
          for service in identity_service marketplace_service community_service ai_service; do
            lock="$GITHUB_WORKSPACE/services/$service/Cargo.lock"
            if grep -A2 '^name = "bytes"$' "$lock" | grep -q 'version = "1.10.1"'; then
              echo "$service still has vulnerable bytes 1.10.1" >&2
              exit 1
            fi
            if grep -A2 '^name = "quinn-proto"$' "$lock" | grep -q 'version = "0.11.14"'; then
              echo "$service still has vulnerable quinn-proto 0.11.14" >&2
              exit 1
            fi
            if grep -A2 '^name = "rustls-webpki"$' "$lock" | grep -q 'version = "0.103.8"'; then
              echo "$service still has vulnerable rustls-webpki 0.103.8" >&2
              exit 1
            fi
          done
      - name: Assert Marketplace RSA removal
        working-directory: services/marketplace_service
        run: |
          set -euo pipefail
          if grep -q '^name = "rsa"$' Cargo.lock; then
            echo 'rsa remains in Marketplace Cargo.lock' >&2
            exit 1
          fi
      - name: Persist dependency refresh
        run: |
          set -euo pipefail
          git add services/*/Cargo.toml services/*/Cargo.lock services/marketplace_service/src/main.rs
          if ! git diff --cached --quiet; then
            git commit -m 'security: refresh Rust dependency advisories'
            git push origin HEAD:security/rust-jwt-aws-lc-20260907
          fi
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Verify Rust services
        run: |
          set -euo pipefail
          for service in identity_service marketplace_service community_service ai_service; do
            echo "=== $service ==="
            cd "$GITHUB_WORKSPACE/services/$service"
            cargo fmt --check
            cargo clippy --locked --all-targets -- -D warnings
            cargo test --locked
            cargo audit
          done
