name: Temporary PR304 Finalize

on:
  push:
    branches: [feat/usaha-flow-system]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/usaha-flow-system
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/apps/usaha/package-lock.json
      - name: Patch final user-visible flow contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 match, got {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          # Modal Produk: price belongs to Barang and is read-only here.
          hpp = 'frontend/apps/usaha/src/components/business-control/DurableHppWorkspace.tsx'
          replace_once(hpp,
              "  const [sellingPrice, setSellingPrice] = useState(priceFromLabel(products[0]?.priceLabel));\n",
              "")
          replace_once(hpp,
              "  const product = products.find(item => item.id === productId) ?? products[0];\n  const ingredientMap = useMemo(() => new Map(ingredients.map(item => [item.id, item])), [ingredients]);",
              "  const product = products.find(item => item.id === productId) ?? products[0];\n  const sellingPrice = priceFromLabel(product?.priceLabel);\n  const ingredientMap = useMemo(() => new Map(ingredients.map(item => [item.id, item])), [ingredients]);")
          text = Path(hpp).read_text()
          text = text.replace("            setSellingPrice(priceFromLabel(selected?.priceLabel));\n", "")
          text = text.replace("          setSellingPrice(priceFromLabel(selected?.priceLabel));\n", "")
          Path(hpp).write_text(text)
          replace_once(hpp,
              "          <label className=\"text-xs font-semibold text-portal-soft\">Harga jual\n            <input type=\"number\" min=\"0\" className=\"mt-1 min-h-11 w-full rounded-xl border border-portal-line px-3 text-base font-bold text-portal-ink\" value={sellingPrice} onChange={event => setSellingPrice(n(event.target.value))} />\n          </label>",
              "          <div className=\"text-xs font-semibold text-portal-soft\">Harga jual dari Barang\n            <div className=\"mt-1 flex min-h-11 items-center rounded-xl border border-portal-line bg-[#f7f8f5] px-3 text-base font-bold text-portal-ink\">{money.format(sellingPrice)}</div>\n            <Link href={`/businesses/${businessId}/products`} className=\"mt-1.5 inline-flex text-[11px] font-bold text-portal-forest hover:underline\">Ubah harga di Barang</Link>\n          </div>")

          # POS: a configured cart line can be reopened and replaced/merged safely.
          ws = 'frontend/apps/usaha/src/components/business-control/QuickSaleWorkspace.tsx'
          replace_once(ws,
              "type DraftLine = QuickSaleLineDraft & {\n  key: string;\n  productName: string;\n  configurationSummary?: string;\n};",
              "type DraftLine = QuickSaleLineDraft & {\n  key: string;\n  productName: string;\n  configurationSummary?: string;\n  configurable?: boolean;\n};")
          replace_once(ws,
              "    configurationSummary: configured?.configurationSummary || undefined,\n  };",
              "    configurationSummary: configured?.configurationSummary || undefined,\n    configurable: Boolean(configured),\n  };")
          replace_once(ws,
              "function CartLines({ lines, onQuantity }: { lines: DraftLine[]; onQuantity: (key: string, quantity: number) => void }) {",
              "function CartLines({ lines, onQuantity, onEdit }: { lines: DraftLine[]; onQuantity: (key: string, quantity: number) => void; onEdit: (line: DraftLine) => void }) {")
          replace_once(ws,
              "              <QuantityControl line={line} onQuantity={onQuantity} />\n              <button",
              "              <QuantityControl line={line} onQuantity={onQuantity} />\n              <div className=\"flex items-center gap-1\">\n                {line.configurable ? <button type=\"button\" className=\"min-h-10 rounded-lg px-2.5 text-xs font-bold text-portal-forest hover:bg-emerald-50\" onClick={() => onEdit(line)}>Edit racikan</button> : null}\n              <button")
          replace_once(ws,
              "                <Trash2 className=\"h-4 w-4\" />\n              </button>\n            </div>",
              "                <Trash2 className=\"h-4 w-4\" />\n              </button>\n              </div>\n            </div>")
          replace_once(ws,
              "  const [configuringProduct, setConfiguringProduct] = useState<ProductOption | null>(null);\n  const [advancedOpen, setAdvancedOpen] = useState(false);",
              "  const [configuringProduct, setConfiguringProduct] = useState<ProductOption | null>(null);\n  const [editingLineKey, setEditingLineKey] = useState<string | null>(null);\n  const [advancedOpen, setAdvancedOpen] = useState(false);")
          replace_once(ws,
              "    if (product.modifierGroups?.length) {\n      setConfiguringProduct(product);\n      return;\n    }",
              "    if (product.modifierGroups?.length) {\n      setEditingLineKey(null);\n      setConfiguringProduct(product);\n      return;\n    }")
          replace_once(ws,
              "  function addConfiguredProduct(input: ConfiguredProductInput) {\n    const product = configuringProduct;\n    if (!product) return;\n    changed();\n    setReceipt(null);\n    setLines(current => mergeQuickSaleLine(current, makeLine(product, input)) as DraftLine[]);\n  }",
              "  function addConfiguredProduct(input: ConfiguredProductInput) {\n    const product = configuringProduct;\n    if (!product) return;\n    changed();\n    setReceipt(null);\n    const nextLine = makeLine(product, input);\n    if (editingLineKey) {\n      nextLine.key = editingLineKey;\n      setLines(current => mergeQuickSaleLine(current.filter(line => line.key !== editingLineKey), nextLine) as DraftLine[]);\n      setEditingLineKey(null);\n      return;\n    }\n    setLines(current => mergeQuickSaleLine(current, nextLine) as DraftLine[]);\n  }\n\n  function editConfiguredLine(line: DraftLine) {\n    const product = products.find(item => item.id === line.productId);\n    if (!product?.modifierGroups?.length) return;\n    setCartOpen(false);\n    setEditingLineKey(line.key);\n    setConfiguringProduct(product);\n  }")
          replace_once(ws,
              "    setConfiguringProduct(null);\n    setTenderedAmount(0);",
              "    setConfiguringProduct(null);\n    setEditingLineKey(null);\n    setTenderedAmount(0);")
          text = Path(ws).read_text()
          text = text.replace("<CartLines lines={lines} onQuantity={setQuantity} />", "<CartLines lines={lines} onQuantity={setQuantity} onEdit={editConfiguredLine} />")
          Path(ws).write_text(text)
          replace_once(ws,
              "          key={configuringProduct.id}\n          open\n          onOpenChange={open => { if (!open) setConfiguringProduct(null); }}\n          productName={configuringProduct.name}",
              "          key={`${configuringProduct.id}:${editingLineKey ?? 'new'}`}\n          open\n          onOpenChange={open => { if (!open) { setConfiguringProduct(null); setEditingLineKey(null); } }}\n          productName={configuringProduct.name}")
          replace_once(ws,
              "          groups={configuringProduct.modifierGroups ?? []}\n          onConfirm={addConfiguredProduct}",
              "          groups={configuringProduct.modifierGroups ?? []}\n          initialSelection={editingLineKey ? (() => {\n            const line = lines.find(item => item.key === editingLineKey);\n            return line ? { quantity: Number(line.quantity), selectedOptions: line.selectedOptions ?? [], note: line.note } : undefined;\n          })() : undefined}\n          onConfirm={addConfiguredProduct}")

          # WWW: discounts must show a minus, surcharges a plus.
          www = 'frontend/apps/www/src/app/[locale]/(shared)/toko/[slug]/StorefrontProductConfigurator.tsx'
          replace_once(www,
              "{option.price_delta_cents ? <span className=\"shrink-0 text-xs font-bold text-slate-600 dark:text-slate-300\">+{formatIdrCents(option.price_delta_cents)}</span> : null}",
              "{option.price_delta_cents ? <span className=\"shrink-0 text-xs font-bold text-slate-600 dark:text-slate-300\">{option.price_delta_cents > 0 ? '+' : '-'}{formatIdrCents(Math.abs(option.price_delta_cents))}</span> : null}")
          PY
      - name: Install Usaha dependencies
        working-directory: frontend/apps/usaha
        run: npm ci
      - name: Verify Usaha final contracts
        working-directory: frontend/apps/usaha
        run: |
          npm test -- --run src/components/business-control/usaha-flow-final.contract.test.ts src/components/business-control/quick-sale.test.ts src/components/business-control/QuickSaleWorkspace.test.ts
          npm run typecheck
      - name: Commit verified final flow fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/apps/usaha/src/components/business-control/DurableHppWorkspace.tsx \
                  frontend/apps/usaha/src/components/business-control/QuickSaleWorkspace.tsx \
                  'frontend/apps/www/src/app/[locale]/(shared)/toko/[slug]/StorefrontProductConfigurator.tsx'
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix(usaha): finish customer choice flow contracts"
            git push origin HEAD:feat/usaha-flow-system
          fi
