name: Temporary Business Verify Latest

on:
  push:
    branches:
      - automation/verify-48bedf3a

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: marketplace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d marketplace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/marketplace
      SQLX_OFFLINE: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: automation/verify-48bedf3a
      - name: Toolchain
        run: rustup show
      - name: Format source
        run: cd services/marketplace_service && cargo fmt
      - name: Commit formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add services/marketplace_service
            git commit -m "style: format verified business core"
            git push origin HEAD:automation/verify-48bedf3a
          fi
      - name: Check format
        run: cd services/marketplace_service && cargo fmt --check
      - name: Clippy
        run: cd services/marketplace_service && cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cd services/marketplace_service && cargo test --all-targets --all-features
      - name: Business OS contract
        run: python scripts/ci/check_usaha_business_os_contract.py
