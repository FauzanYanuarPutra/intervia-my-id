name: Identity Backoffice Repair Verify
on:
  push:
    branches: [fix/identity-backoffice-format-20260907]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/identity_service
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --check
      - name: Clippy all targets
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked
