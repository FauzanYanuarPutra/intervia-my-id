name: Temporary Documents Rustfmt

on:
  push:
    branches:
      - automation/rustfmt-docs-9e66f2f8

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: automation/rustfmt-docs-9e66f2f8
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Format Marketplace
        run: cd services/marketplace_service && cargo fmt
      - name: Commit formatted files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/marketplace_service
          git commit -m "style: format document kernel"
          git push origin HEAD:automation/rustfmt-docs-9e66f2f8
