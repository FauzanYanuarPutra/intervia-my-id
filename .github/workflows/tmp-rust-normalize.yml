name: Temporary Rust Normalize

on:
  push:
    branches: [fix/ai-lockfile-prod-build-20260918]
    paths:
      - ".github/workflows/tmp-rust-normalize.yml"
      - "services/ai_service/**"
      - "services/marketplace_service/**"
      - "services/identity_service/**"
      - "services/community_service/**"

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/ai-lockfile-prod-build-20260918
      - name: Reconcile AI lockfile and format Rust services
        shell: bash
        run: |
          set -euo pipefail
          (
            cd services/ai_service
            cargo metadata --format-version 1 >/dev/null
            cargo fmt
          )
          for service in marketplace_service identity_service community_service; do
            (cd "services/$service" && cargo fmt)
          done
          git diff --check
          git diff -- services/ai_service services/marketplace_service services/identity_service services/community_service
      - name: Commit normalized Rust state
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- services/ai_service services/marketplace_service services/identity_service services/community_service; then
            echo "No normalization changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/ai_service services/marketplace_service services/identity_service services/community_service
          git commit -m "chore(rust): normalize lockfile and formatting"
          git push origin HEAD:fix/ai-lockfile-prod-build-20260918
