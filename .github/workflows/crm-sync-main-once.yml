name: CRM Sync Main Once
on:
  push:
    branches: [feat/crm-workspace-wave2-20260907]
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/crm-workspace-wave2-20260907
          fetch-depth: 0
      - name: Merge latest main and remove helper
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git rm .github/workflows/crm-sync-main-once.yml
          git commit -m "chore: sync CRM with verified main"
          git push origin HEAD:feat/crm-workspace-wave2-20260907
