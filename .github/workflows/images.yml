name: Build Images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "frontend/**"
      - ".github/workflows/images.yml"
      - "docker-compose*.yml"

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: lajukan-identity
            context: ./services/identity_service
            dockerfile: Dockerfile
          - image: lajukan-marketplace
            context: ./services/marketplace_service
            dockerfile: Dockerfile
          - image: lajukan-community
            context: ./services/community_service
            dockerfile: Dockerfile
          - image: lajukan-chat
            context: ./services/chat_service
            dockerfile: Dockerfile
          - image: lajukan-ai
            context: ./services/ai_service
            dockerfile: Dockerfile
          - image: lajukan-ocr
            context: ./services/ocr_service
            dockerfile: Dockerfile
          - image: lajukan-liveness
            context: ./services/liveness_service
            dockerfile: Dockerfile
          - image: lajukan-www
            context: ./frontend
            dockerfile: apps/www/Dockerfile
          - image: lajukan-usaha
            context: ./frontend
            dockerfile: apps/usaha/Dockerfile
          - image: lajukan-cms
            context: ./frontend
            dockerfile: apps/cms/Dockerfile
          - image: lajukan-crm
            context: ./frontend
            dockerfile: apps/crm/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Require registry credentials
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$DOCKERHUB_USERNAME" ]] || { echo "DOCKERHUB_USERNAME is missing" >&2; exit 1; }
          [[ -n "$DOCKERHUB_TOKEN" ]] || { echo "DOCKERHUB_TOKEN is missing" >&2; exit 1; }

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true
