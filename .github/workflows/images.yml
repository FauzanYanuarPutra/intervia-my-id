name: Build Images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: &image_paths
      - "services/**"
      - "frontend/**"
      - ".github/workflows/images.yml"
      - ".github/workflows/deploy.yml"
      - "docker-compose*.yml"
      - "infrastructure/caddy/**"
      - "scripts/ops/**"
  pull_request:
    branches: [main]
    paths: *image_paths

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pr:
    if: github.event_name == 'pull_request'
    name: PR build / ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy: &image_strategy
      fail-fast: false
      matrix:
        include:
          - image: lajukan-identity
            context: ./services/identity_service
            dockerfile: Dockerfile
          - image: lajukan-marketplace
            context: ./services/marketplace_service
            dockerfile: Dockerfile
          - image: lajukan-community
            context: ./services/community_service
            dockerfile: Dockerfile
          - image: lajukan-chat
            context: ./services/chat_service
            dockerfile: Dockerfile
          - image: lajukan-ai
            context: ./services/ai_service
            dockerfile: Dockerfile
          - image: lajukan-ocr
            context: ./services/ocr_service
            dockerfile: Dockerfile
          - image: lajukan-liveness
            context: ./services/liveness_service
            dockerfile: Dockerfile
          - image: lajukan-profile
            context: ./services/profile_service
            dockerfile: Dockerfile
          - image: lajukan-media
            context: ./services/media_service
            dockerfile: Dockerfile
          - image: lajukan-news
            context: ./services/news_service
            dockerfile: Dockerfile
          - image: lajukan-order
            context: ./services/order_service
            dockerfile: Dockerfile
          - image: lajukan-payment
            context: ./services/payment_service
            dockerfile: Dockerfile
          - image: lajukan-promotion
            context: ./services/promotion_service
            dockerfile: Dockerfile
          - image: lajukan-crm-service
            context: ./services/crm_service
            dockerfile: Dockerfile
          - image: lajukan-communication
            context: ./services/communication_service
            dockerfile: Dockerfile
          - image: lajukan-trust
            context: ./services/trust_service
            dockerfile: Dockerfile
          - image: lajukan-support
            context: ./services/support_service
            dockerfile: Dockerfile
          - image: lajukan-review
            context: ./services/review_service
            dockerfile: Dockerfile
          - image: lajukan-www
            context: ./frontend
            dockerfile: apps/www/Dockerfile
          - image: lajukan-usaha
            context: ./frontend
            dockerfile: apps/usaha/Dockerfile
          - image: lajukan-cms
            context: ./frontend
            dockerfile: apps/cms/Dockerfile
          - image: lajukan-crm
            context: ./frontend
            dockerfile: apps/crm/Dockerfile

    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image without publishing
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: false
          tags: local/${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true

  publish:
    if: github.event_name != 'pull_request'
    name: Publish / ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy: *image_strategy

    steps:
      - uses: actions/checkout@v7

      - name: Resolve GHCR namespace
        id: registry
        shell: bash
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="${REPOSITORY_OWNER,,}"
          [[ "$owner" =~ ^[a-z0-9][a-z0-9._-]*$ ]] || {
            echo "Repository owner cannot be converted to a valid GHCR namespace." >&2
            exit 1
          }
          echo "namespace=ghcr.io/$owner" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish immutable image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.registry.outputs.namespace }}/${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true
