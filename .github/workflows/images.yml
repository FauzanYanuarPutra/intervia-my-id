name: Build Images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "frontend/**"
      - ".github/workflows/images.yml"
      - "docker-compose*.yml"

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: lajukan-identity
            context: ./services/identity_service
            dockerfile: Dockerfile
          - image: lajukan-marketplace
            context: ./services/marketplace_service
            dockerfile: Dockerfile
          - image: lajukan-community
            context: ./services/community_service
            dockerfile: Dockerfile
          - image: lajukan-chat
            context: ./services/chat_service
            dockerfile: Dockerfile
          - image: lajukan-ai
            context: ./services/ai_service
            dockerfile: Dockerfile
          - image: lajukan-ocr
            context: ./services/ocr_service
            dockerfile: Dockerfile
          - image: lajukan-liveness
            context: ./services/liveness_service
            dockerfile: Dockerfile
          - image: lajukan-www
            context: ./frontend
            dockerfile: apps/www/Dockerfile
          - image: lajukan-usaha
            context: ./frontend
            dockerfile: apps/usaha/Dockerfile
          - image: lajukan-cms
            context: ./frontend
            dockerfile: apps/cms/Dockerfile
          - image: lajukan-crm
            context: ./frontend
            dockerfile: apps/crm/Dockerfile

    steps:
      - uses: actions/checkout@v7

      - name: Resolve registry publishing mode
        id: registry
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "namespace=$DOCKERHUB_USERNAME" >> "$GITHUB_OUTPUT"
            echo "Docker Hub credentials are configured; this run will build and publish immutable images."
            exit 0
          fi

          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "namespace=local" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual image publication requires DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository/environment secrets." >&2
            exit 1
          fi
          echo "Docker Hub credentials are not configured; validating image builds without publishing."

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        if: steps.registry.outputs.available == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image and publish when registry credentials exist
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: ${{ steps.registry.outputs.available == 'true' }}
          tags: ${{ steps.registry.outputs.namespace }}/${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true
