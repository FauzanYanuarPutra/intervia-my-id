name: Temporary Usaha Flow Finalize V2

on:
  push:
    branches: [feat/usaha-flow-system]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/usaha-flow-system
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/packages/package-lock.json
            frontend/apps/usaha/package-lock.json
      - name: Apply corrected finalization patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import re

          workflow = Path('.github/workflows/tmp-usaha-flow-finalize.yml').read_text()
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = dedent(workflow[start:end])
          if "helpers = r'''" not in script:
              raise SystemExit('expected raw helper block was not found')
          script = script.replace("helpers = r'''", "helpers = '''", 1)
          exec(compile(script, '<usaha-flow-finalizer>', 'exec'))

          sales = Path('services/marketplace_service/src/businesses/sales.rs')
          sales_text = sales.read_text()
          marker = '    #[serde(default)]\n    pub(crate) unit_price_amount: i64,'
          replacement = '    #[serde(default)]\n    #[allow(dead_code)]\n    pub(crate) unit_price_amount: i64,'
          if marker not in sales_text:
              raise SystemExit('sales compatibility price field marker missing')
          sales.write_text(sales_text.replace(marker, replacement, 1))

          fixture_paths = [
              'services/marketplace_service/src/businesses/recipe_sales_versioning_tests.rs',
              'services/marketplace_service/src/businesses/availability_persistence_tests.rs',
              'services/marketplace_service/src/businesses/sales_incomplete_cost_persistence_tests.rs',
              'services/marketplace_service/src/businesses/sales_persistence_tests.rs',
          ]
          initializer = re.compile(r'CreateSaleLineRequest \{(?P<body>.*?)\n(?P<indent>\s*)\}', re.S)
          total_patched = 0
          for fixture_path in fixture_paths:
              p = Path(fixture_path)
              text = p.read_text()
              def patch(match):
                  body = match.group('body')
                  if 'selected_options:' in body:
                      return match.group(0)
                  indent = match.group('indent')
                  global total_patched
                  total_patched += 1
                  return 'CreateSaleLineRequest {' + body + f'\n{indent}    selected_options: Vec::new(),\n{indent}    note: None,\n{indent}' + '}'
              p.write_text(initializer.sub(patch, text))
          if total_patched != 6:
              raise SystemExit(f'expected to patch 6 legacy sale fixtures, patched {total_patched}')
          PY
      - name: Verify Marketplace
        working-directory: services/marketplace_service
        run: |
          cargo fmt
          cargo check --all-targets
          cargo test businesses::modifier_resolution
          cargo test businesses::sales::tests
      - name: Verify shared product package
        working-directory: frontend/packages
        run: |
          npm ci
          npm test -- --run
          npm run build
      - name: Verify Usaha
        working-directory: frontend/apps/usaha
        run: |
          npm ci
          npm test -- --run
          npm run typecheck
          npm run lint
          npm run build
      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/apps/usaha services/marketplace_service
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
            exit 1
          fi
          git commit -m "feat(usaha): complete configured POS and product costing flow"
          git push origin HEAD:feat/usaha-flow-system
