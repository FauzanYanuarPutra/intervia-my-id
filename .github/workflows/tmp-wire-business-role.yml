name: Temporary Wire Business Role

on:
  push:
    branches:
      - feat/business-os-sales-cogs-20260909

permissions:
  contents: write

jobs:
  wire-role:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/business-os-sales-cogs-20260909
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/apps/usaha/package-lock.json
      - name: Wire canonical role mapper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/apps/usaha/src/lib/business-server.ts')
          text = path.read_text()
          needle = "import { readAccessToken } from '@/lib/auth-session';\n"
          addition = needle + "import { normalizeWorkspaceRole } from '@/lib/business-role';\n"
          if "from '@/lib/business-role'" not in text:
              if needle not in text:
                  raise SystemExit('auth-session import anchor missing')
              text = text.replace(needle, addition, 1)
          old = """function normalizeRole(value: string, isOwner: boolean): PortalRole {\n  if (isOwner || value === 'owner') return 'owner';\n  if (['admin', 'manager', 'org_admin'].includes(value)) return 'manager';\n  if (['cashier', 'staff', 'operator'].includes(value)) return 'cashier';\n  return 'viewer';\n}\n\n"""
          if old in text:
              text = text.replace(old, '', 1)
          text = text.replace('const role = normalizeRole(', 'const role = normalizeWorkspaceRole(', 1)
          path.write_text(text)
          PY
          rm .github/workflows/tmp-wire-business-role.yml
      - name: Validate Usaha role mapping
        working-directory: frontend/apps/usaha
        run: |
          npm ci --legacy-peer-deps --include=optional --ignore-scripts --no-audit --no-fund
          npm test
          npm run typecheck
      - name: Commit wiring and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/apps/usaha/src/lib/business-server.ts \
                  frontend/apps/usaha/src/lib/business-role.ts \
                  .github/workflows/tmp-wire-business-role.yml
          git diff --cached --check
          git commit -m "fix(usaha): wire workspace role mapping"
          git push origin HEAD:feat/business-os-sales-cogs-20260909
