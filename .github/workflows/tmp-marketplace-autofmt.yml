name: Temporary Marketplace Autofmt

on:
  push:
    branches: [fix/marketplace-format-20260906]
    paths:
      - '.github/workflows/tmp-marketplace-autofmt.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/marketplace-format-20260906
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Format marketplace
        working-directory: services/marketplace_service
        run: cargo fmt
      - name: Verify formatter
        working-directory: services/marketplace_service
        run: cargo fmt --check
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- services/marketplace_service; then
            echo 'No formatter changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/marketplace_service
          git commit -m 'style: format marketplace service'
          git push origin HEAD:fix/marketplace-format-20260906
