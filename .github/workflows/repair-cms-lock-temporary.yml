name: Temporary CMS Lock Repair

on:
  push:
    branches:
      - feat/business-profile-capability-runtime

permissions:
  contents: write

concurrency:
  group: repair-cms-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/business-profile-capability-runtime
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Regenerate CMS package lock deterministically
        working-directory: frontend/apps/cms
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit repaired lock only when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- frontend/apps/cms/package-lock.json; then
            echo "CMS lock already normalized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/apps/cms/package-lock.json
          git commit -m "fix: normalize cms package lock"
          git push origin HEAD:feat/business-profile-capability-runtime
