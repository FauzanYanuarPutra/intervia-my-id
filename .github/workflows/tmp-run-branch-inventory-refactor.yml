name: Temporary run branch inventory refactor

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  run:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/inventory-simplify-20260915
          fetch-depth: 0
      - name: Run branch-owned deterministic patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/tmp-inventory-workspace-refactor.yml')
          content = workflow.read_text()
          marker = '        run: |\n'
          if content.count(marker) != 1:
              raise SystemExit('unexpected temporary workflow format')
          Path('/tmp/apply-inventory-refactor.sh').write_text(
              textwrap.dedent(content.split(marker, 1)[1])
          )
          PY
          bash /tmp/apply-inventory-refactor.sh
      - name: Remove this temporary runner
        shell: bash
        run: |
          git rm .github/workflows/tmp-run-branch-inventory-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ci): remove temporary inventory refactor runner"
          git push origin HEAD:fix/inventory-simplify-20260915
