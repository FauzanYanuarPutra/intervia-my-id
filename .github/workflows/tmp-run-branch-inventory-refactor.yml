name: Temporary run branch inventory refactor

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  run:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/inventory-simplify-20260915
          fetch-depth: 0
      - name: Extract and run deterministic Python patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/tmp-inventory-workspace-refactor.yml').read_text().splitlines()
          start = workflow.index("          python - <<'PY'") + 1
          end = workflow.index('          PY', start)
          lines = workflow[start:end]
          result = []
          inside_segment = False
          for line in lines:
              if not inside_segment and line.startswith('          '):
                  line = line[10:]
              result.append(line)
              if not inside_segment and "new_segment = r'''" in line:
                  inside_segment = True
              elif inside_segment and line.strip() == "'''":
                  inside_segment = False
          Path('/tmp/apply-inventory-refactor.py').write_text('\n'.join(result) + '\n')
          PY
          python /tmp/apply-inventory-refactor.py
          rm .github/workflows/tmp-inventory-workspace-refactor.yml
          rm .github/workflows/tmp-run-branch-inventory-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/apps/usaha/src/components/business-control/IngredientWorkspace.tsx .github/workflows/tmp-inventory-workspace-refactor.yml .github/workflows/tmp-run-branch-inventory-refactor.yml
          git diff --cached --check
          git commit -m "feat(inventory): simplify ingredient setup flow"
          git push origin HEAD:fix/inventory-simplify-20260915
