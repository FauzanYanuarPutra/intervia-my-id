name: Usaha Business OS Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "frontend/apps/usaha/**"
      - "frontend/apps/www/**"
      - "services/identity_service/**"
      - "services/marketplace_service/**"
      - "scripts/ci/check_usaha_business_os_contract.py"
      - ".github/workflows/usaha-business-os-gate.yml"
  push:
    branches: [main]
    paths:
      - "frontend/apps/usaha/**"
      - "frontend/apps/www/**"
      - "services/identity_service/**"
      - "services/marketplace_service/**"
      - "scripts/ci/check_usaha_business_os_contract.py"
      - ".github/workflows/usaha-business-os-gate.yml"

permissions:
  contents: write

concurrency:
  group: usaha-business-os-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase0a:
    name: Canonical business Phase 0A
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/canonical-business-phase0-20260825' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/canonical-business-phase0-20260825
          fetch-depth: 0
      - name: Apply deterministic WWW and Usaha integration patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          route = Path('frontend/apps/www/src/app/api/super-app/umkm/stores/route.ts')
          text = route.read_text()
          old_import = "  createUmkmStore,\n"
          if old_import not in text:
              raise SystemExit('expected createUmkmStore import not found')
          text = text.replace(old_import, '', 1)

          anchor = "import { sanitizeOwnerWritableUmkmMetadata } from '@/lib/super-app/umkm-owner-metadata';\n"
          addition = anchor + "import {\n  createDurableMarketplaceStore,\n  ensureWorkspaceOrganization,\n} from '@/lib/super-app/business-workspace';\n"
          if "from '@/lib/super-app/business-workspace'" not in text:
              if anchor not in text:
                  raise SystemExit('workspace import anchor not found')
              text = text.replace(anchor, addition, 1)

          old = """    const store = await createUmkmStore({
      ownerUserId: auth.ctx.userId,
      name: payload.name,
      slug: payload.slug,
      description: payload.description,
      city: payload.city,
      address: payload.address,
      lat: payload.lat,
      lng: payload.lng,
      phone: payload.phone,
      onlineOrderEnabled: payload.online_order_enabled,
      offlineOrderEnabled: payload.offline_order_enabled,
      metadata: {
        ...(payload.business_category
          ? {
              umkm_category: payload.business_category,
              business_type: payload.business_category,
              segment: getUmkmBusinessCategoryLabel(
                payload.business_category,
                true,
              ),
            }
          : {}),
        recommended_qr: (payload.table_count || 0) > 0 ? 'offline' : 'online',
        ...(sanitizeOwnerWritableUmkmMetadata(payload.metadata) || {}),
      },
    });
"""
          new = """    const organizationId = await ensureWorkspaceOrganization({
      token: auth.ctx.token,
      name: payload.name,
    });

    const store = await createDurableMarketplaceStore({
      token: auth.ctx.token,
      ownerUserId: auth.ctx.userId,
      organizationId,
      name: payload.name,
      slug: payload.slug,
      description: payload.description,
      city: payload.city,
      address: payload.address,
      lat: payload.lat,
      lng: payload.lng,
      phone: payload.phone,
      onlineOrderEnabled: payload.online_order_enabled,
      offlineOrderEnabled: payload.offline_order_enabled,
      metadata: {
        ...(payload.business_category
          ? {
              umkm_category: payload.business_category,
              business_type: payload.business_category,
              segment: getUmkmBusinessCategoryLabel(
                payload.business_category,
                true,
              ),
            }
          : {}),
        recommended_qr: (payload.table_count || 0) > 0 ? 'offline' : 'online',
        ...(sanitizeOwnerWritableUmkmMetadata(payload.metadata) || {}),
      },
    });
"""
          if old not in text:
              raise SystemExit('expected WWW Store creation block not found')
          text = text.replace(old, new, 1)
          route.write_text(text)

          usaha = Path('frontend/apps/usaha/src/lib/business-server.ts')
          text = usaha.read_text()
          old = "  const organizationId = stringValue(metadata.organization_id ?? metadata.organizationId);\n"
          new = "  const organizationId =\n    stringValue(store.organization_id) ||\n    stringValue(metadata.organization_id ?? metadata.organizationId);\n"
          if old not in text:
              raise SystemExit('expected Usaha organization mapping not found')
          text = text.replace(old, new, 1)
          usaha.write_text(text)
          PY
          git diff --check
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/apps/www/package-lock.json
      - name: Install WWW dependencies
        working-directory: frontend/apps/www
        run: npm ci --legacy-peer-deps --include=optional --ignore-scripts --no-audit --no-fund
      - name: Test durable business workspace
        working-directory: frontend/apps/www
        run: npm test -- src/lib/super-app/business-workspace.test.ts
      - name: Typecheck WWW
        working-directory: frontend/apps/www
        run: npx tsc --noEmit --pretty false
      - name: Commit verified integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/apps/www/src/app/api/super-app/umkm/stores/route.ts frontend/apps/usaha/src/lib/business-server.ts
          if git diff --cached --quiet; then
            echo 'No Phase 0A integration diff.'
            exit 0
          fi
          git commit -m 'fix(business): unify WWW and Usaha workspace creation'
          git push origin HEAD:fix/canonical-business-phase0-20260825

  contract:
    name: Usaha business OS contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate application boundary
        run: python scripts/ci/check_usaha_business_os_contract.py

  frontend:
    name: Usaha frontend validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend/apps/usaha
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/apps/usaha/package-lock.json
      - name: Install Usaha dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! npm ci --legacy-peer-deps --include=optional --ignore-scripts --no-audit --no-fund; then
            echo "package-lock.json is stale or incompatible; matching the Dockerfile fallback to npm install"
            rm -rf node_modules
            npm install --legacy-peer-deps --include=optional --ignore-scripts --no-audit --no-fund --package-lock=false
          fi
      - name: Typecheck Usaha
        run: npm run typecheck
      - name: Build Usaha
        env:
          NEXT_PUBLIC_WWW_URL: http://localhost:3000
          NEXT_PUBLIC_USAHA_URL: http://localhost:3003
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXT_PUBLIC_MARKETPLACE_URL: http://localhost:8081
        run: npm run build

  gate:
    name: Usaha business OS gate
    runs-on: ubuntu-latest
    if: always()
    needs: [contract, frontend]
    steps:
      - name: Require contract and frontend validation
        env:
          CONTRACT_RESULT: ${{ needs.contract.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        shell: bash
        run: |
          set -euo pipefail
          echo "contract=$CONTRACT_RESULT"
          echo "frontend=$FRONTEND_RESULT"
          [[ "$CONTRACT_RESULT" == "success" ]]
          [[ "$FRONTEND_RESULT" == "success" ]]
