name: Temporary Main Rustfmt Stable

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: main-rustfmt-stable
  cancel-in-progress: true

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/marketplace_service
      - name: Format Marketplace with CI stable toolchain
        working-directory: services/marketplace_service
        run: cargo fmt
      - name: Verify format
        working-directory: services/marketplace_service
        run: cargo fmt --check
      - name: Commit verified formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/marketplace_service
          if git diff --cached --quiet; then
            echo "No formatting changes"
          else
            git commit -m "style(marketplace): normalize stable-toolchain formatting on main"
            git push origin HEAD:main
          fi
