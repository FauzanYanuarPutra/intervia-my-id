name: Usaha Next Actions RED

on:
  push:
    branches:
      - feature/usaha-ux-simplification-20260907

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/usaha-ux-simplification-20260907
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install Usaha dependencies
        working-directory: frontend/apps/usaha
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Run next-action test (expected to fail before implementation)
        working-directory: frontend/apps/usaha
        run: npx vitest run src/lib/business-control/next-actions.test.ts
