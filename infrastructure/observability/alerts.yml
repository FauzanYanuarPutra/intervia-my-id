groups:
  - name: lajukan-platform
    rules:
      - alert: LajukanProbeFailed
        expr: probe_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Lajukan dependency probe failed"
          description: "{{ $labels.instance }} has failed readiness/connectivity probes for more than 2 minutes."

      - alert: LajukanExporterDown
        expr: up{job=~"node|cadvisor|postgres_.*|redis|rabbitmq"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Lajukan observability exporter is down"
          description: "{{ $labels.job }} target {{ $labels.instance }} is not scrapeable."

      - alert: LajukanPostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Lajukan PostgreSQL exporter reports database unavailable"
          description: "{{ $labels.instance }} cannot reach its PostgreSQL source."

      - alert: LajukanRedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Lajukan Redis is unavailable"
          description: "Redis exporter cannot reach the cache/coordination service."

      - alert: LajukanNodeMemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Lajukan host memory is low"
          description: "Available host memory has remained below 10% for 5 minutes."

      - alert: LajukanNodeFilesystemLow
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|devtmpfs|overlay|squashfs"}
          /
          node_filesystem_size_bytes{fstype!~"tmpfs|devtmpfs|overlay|squashfs"}
          < 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Lajukan host filesystem space is low"
          description: "{{ $labels.mountpoint }} has remained below 10% free space for 10 minutes."

      - alert: LajukanNodeCpuHigh
        expr: 1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Lajukan host CPU is saturated"
          description: "Average CPU utilization has remained above 90% for 10 minutes."


      - alert: LajukanHttp5xxRateHigh
        expr: |
          sum by (service) (rate(lajukan_http_responses_total{class="5xx"}[5m]))
          /
          clamp_min(sum by (service) (rate(lajukan_http_requests_total[5m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Lajukan HTTP 5xx rate is high"
          description: "{{ $labels.service }} has exceeded a 5% 5xx rate for 5 minutes."

      - alert: LajukanHttpP95LatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (service, le) (
              rate(lajukan_http_request_duration_seconds_bucket[5m])
            )
          ) > 1.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Lajukan HTTP p95 latency is high"
          description: "{{ $labels.service }} p95 latency has exceeded 1.5 seconds for 10 minutes."

      - alert: LajukanHttpInFlightHigh
        expr: lajukan_http_in_flight_requests > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Lajukan HTTP in-flight requests are high"
          description: "{{ $labels.service }} has more than 100 in-flight requests for 10 minutes; validate against measured capacity."


      - alert: LajukanRabbitMqBacklogHigh
        expr: sum(rabbitmq_queue_messages_ready) > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Lajukan RabbitMQ ready backlog is high"
          description: "RabbitMQ has more than 1000 ready messages for 10 minutes. Validate consumer lag and calibrate this threshold against measured traffic."

      - alert: LajukanRabbitMqNoConsumers
        expr: sum(rabbitmq_queue_messages_ready) > 0 and sum(rabbitmq_queue_consumers) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Lajukan RabbitMQ has backlog with no consumers"
          description: "RabbitMQ has queued work but reports no queue consumers for 5 minutes."


      - alert: LajukanRabbitMqMetricsDown
        expr: up{job="rabbitmq"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Lajukan RabbitMQ metrics are unavailable"
          description: "Prometheus cannot scrape the RabbitMQ metrics endpoint for 2 minutes; broker health or visibility may be impaired."


  - name: lajukan-application-state
    rules:
      - alert: LajukanOutboxBacklogHigh
        expr: lajukan_outbox_backlog > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Lajukan transactional outbox backlog is high"
          description: "{{ $labels.service }} has more than 100 unpublished outbox events for 10 minutes. Check broker availability and publisher progress."

      - alert: LajukanOutboxBacklogCritical
        expr: lajukan_outbox_backlog > 1000
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Lajukan transactional outbox backlog is critical"
          description: "{{ $labels.service }} has more than 1000 unpublished outbox events for 10 minutes. Business writes may be committed while downstream projections are stale."

      - alert: LajukanOutboxOldestEventStale
        expr: lajukan_outbox_oldest_age_seconds > 300
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Lajukan transactional outbox has stale unpublished events"
          description: "{{ $labels.service }} has an unpublished outbox event older than 5 minutes. Check broker availability, publisher leases and retry state."

      - alert: LajukanOutboxOldestEventCritical
        expr: lajukan_outbox_oldest_age_seconds > 1800
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Lajukan transactional outbox is critically stale"
          description: "{{ $labels.service }} has an unpublished outbox event older than 30 minutes. Downstream projections may be materially stale."

      - alert: LajukanMetricsDbQueryFailed
        expr: lajukan_metrics_db_query_ok == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Lajukan application metrics cannot query its database"
          description: "{{ $labels.service }} cannot evaluate DB-backed runtime metrics; service/database visibility is impaired."

      - alert: LajukanDbPoolSaturated
        expr: |
          1 -
          (
            lajukan_db_pool_connections{state="idle"}
            /
            clamp_min(lajukan_db_pool_connections{state="total"}, 1)
          )
          > 0.90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Lajukan database pool is highly utilized"
          description: "{{ $labels.service }} has used more than 90% of its SQL pool for 10 minutes. Check slow queries, lock waits and pool sizing before increasing limits."
