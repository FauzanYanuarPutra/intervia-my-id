[package]
name = "ai_service"
version = "2.0.1"
edition = "2021"
publish = false

[dependencies]
axum = { version = "0.8", features = ["multipart", "json"] }
bytes = "1"

reqwest = {
    version = "0.11",
    default-features = false,
    features = ["json", "multipart", "rustls-tls"]
}

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = {
    version = "1",
    features = [
        "macros",
        "rt-multi-thread",
        "net",
        "sync",
        "signal",
        "time"
    ]
}

tower-http = { version = "0.5", features = ["cors"] }

tracing-subscriber = {
    version = "0.3",
    features = ["fmt", "env-filter"]
}

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"