[package]
name = "communication_service"
version = "0.1.0"
edition = "2021"
[dependencies]
axum="0.8.7"
tokio={version="1",features=["full"]}
sqlx={version="0.9.0",default-features=false,features=["runtime-tokio","postgres","macros","migrate","uuid","chrono","json"]}
serde_json="1"
tracing="0.1"
tracing-subscriber={version="0.3",features=["fmt","env-filter","json"]}
uuid={version="1",features=["v4","serde"]}
anyhow="1"
