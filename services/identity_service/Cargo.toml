[package]
name = "identity_service"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.7"
tokio = { version = "1", features = ["full"] }

serde = { version = "1", features = ["derive", "alloc"] }
serde_json = "1"

sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "postgres",
    "macros",
    "uuid",
    "chrono",
    "json",
    "migrate"
] }

redis = { version = "0.32.7", features = ["tokio-comp", "connection-manager"] }
deadpool-redis = { version = "0.22.0", features = ["serde"] }

dotenvy = "0.15"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

lapin = "3.7.1"

argon2 = "0.5"
bcrypt = "0.15"

jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }

uuid = { version = "1", features = ["v4", "serde"] }

# ⭐ FIX UTAMA DI SINI
chrono = { version = "0.4", features = ["serde"] }

thiserror = "2.0.17"
anyhow = "1"

base64ct = "1.7"

hyper = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

tower = { version = "0.5.2", features = ["limit"] }
tower-http = { version = "0.7.0", features = [
    "trace",
    "cors",
    "compression-br",
    "catch-panic",
    "request-id",
    "set-header"
] }

futures = "0.3"

lettre = { version = "0.11", features = ["tokio1", "tokio1-native-tls"] }

validator = { version = "0.20.0", features = ["derive"] }

regex = "1.10"

async-trait = "0.1"

totp-rs = "5.4"
qrcode = "0.14.1"

headers = "0.4"
once_cell = "1.20"

# Axum cookies (WAJIB dipakai di handler)
axum-extra = { version = "0.12.2", features = ["cookie", "typed-header"] }

# Cookie mentah (boleh tetap ada, tapi JANGAN dipakai di CookieJar)
cookie = "0.16"

time = "0.3"

# Argon2 compatible
rand = "0.8.5"
rand_core = "0.6.4"
