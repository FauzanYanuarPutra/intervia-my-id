services:
  # ---------------- Identity Service (Rust) ----------------
  identity_service:
    build:
      context: ./services/identity_service
      dockerfile: Dockerfile
    container_name: laju_identity_service
    environment:
      # --- Base Config ---
      ENV: ${ENV:-development}
      APP_NAME: ${APP_NAME:-identity_service}
      APP_PORT: "8080"
      APP_VERSION: ${APP_VERSION:-0.1.0}
      RUST_LOG: ${RUST_LOG:-info} # Default info lebih baik untuk tracking error awal

      # --- Database & Cache ---
      IDENTITY_DATABASE_URL: postgres://${DB_USER}:${DB_PASS}@identity_db:5432/identity_db
      POSTGRES_HOST: identity_db
      POSTGRES_USER: ${DB_USER}

      REDIS_URL: redis://:${REDIS_PASS}@redis_cache:6379
      REDIS_HOST: redis_cache
      REDIS_PASSWORD: ${REDIS_PASS}

      # --- Message Broker ---
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBIT_USER}
      RABBITMQ_PASSWORD: ${RABBIT_PASS}
      RABBITMQ_URL: amqp://${RABBIT_USER}:${RABBIT_PASS}@rabbitmq:5672/%2f
      IDENTITY_OUTBOX_EXCHANGE: ${IDENTITY_OUTBOX_EXCHANGE:-identity.outbox}
      IDENTITY_OUTBOX_BATCH_SIZE: ${IDENTITY_OUTBOX_BATCH_SIZE:-50}
      IDENTITY_OUTBOX_POLL_MS: ${IDENTITY_OUTBOX_POLL_MS:-750}

      # --- Auth & Security (Sinkron dengan Rust Config) ---
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-laju}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-laju_users}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

      # Gunakan variabel yang sama dengan struct Config di Rust
      ACCESS_TOKEN_EXP_HOURS: "1"
      REFRESH_TOKEN_EXP_DAYS: "30"
      MAX_LOGIN_ATTEMPTS: "5"
      LOCKOUT_DURATION_MIN: "15"
      FAILED_LOGIN_DELAY_MS: "1000"
      # --- Domain & CORS ---
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS_IDENTITY:-true}

    # Tambahkan Healthcheck supaya service lain tahu kalau identity sudah benar-benar up
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    depends_on:
      identity_db: { condition: service_healthy }
      redis_cache: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

    ports:
      - "8080:8080"

    # Optimasi resource agar tidak memakan seluruh RAM server
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

    networks:
      - web
    restart: unless-stopped

  # ---------------- PostgreSQL ----------------
  # postgres_db:
  #   image: postgres:16-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: ${DB_USER}
  #     POSTGRES_PASSWORD: ${DB_PASS}
  #     POSTGRES_DB: ${DB_NAME}
  #   command: [ "postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "max_connections=100", "-c", "shared_buffers=128MB" ]
  #   volumes:
  #     - ./postgres/00-create-databases.sh:/docker-entrypoint-initdb.d/00-create-databases.sh:ro
  #     - ./postgres/marketplace.sql:/docker-entrypoint-initdb.d/marketplace.sql:ro
  #     - ./postgres/community.sql:/docker-entrypoint-initdb.d/community.sql:ro
  #     - ./postgres/identity.sql:/docker-entrypoint-initdb.d/identity.sql:ro
  #     - postgres_data:/var/lib/postgresql/data
  #   ports:
  #     - "${PORT_POSTGRES:-5432}:5432"
  #   healthcheck:
  #     test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     web:
  #       aliases:
  #         - compreface-postgres-db

  identity_db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: identity_db
    command: [ "postgres", "-c", "shared_preload_libraries=pg_stat_statements" ]
    volumes:
      - identity_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d identity_db" ]
    networks:
      - web

  community_db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: community_db
    volumes:
      - community_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d community_db" ]
    networks:
      - web

  marketplace_db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: marketplace_db
    volumes:
      - marketplace_postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d marketplace_db" ]
    networks:
      - web

  # ---------------- Redis ----------------
  redis_cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: [ "redis-server", "--requirepass", "${REDIS_PASS}" ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASS}", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - web
  # ---------------- RabbitMQ ----------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 120s
    networks:
      - web

  # ---------------- ScyllaDB ----------------
  scylla_db:
    image: scylladb/scylla:2025.2
    environment:
      SCYLLA_CLUSTER_NAME: "${APP_NAME}Cluster"
    command: --smp 1 --memory 512M --overprovisioned 1 --developer-mode 1
    volumes:
      - scylla_data:/var/lib/scylla
    healthcheck:
      test: [ "CMD", "nodetool", "status" ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - web

  scylla_keyspace_setup:
    image: scylladb/scylla:2025.2
    volumes:
      - ./services/chat_service/priv/scylladb:/scylladb
    networks:
      - web
    depends_on:
      scylla_db: { condition: service_healthy }
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        sed -i 's/\r//g' /scylladb/setup_keyspace_init.sh
        echo "Running ScyllaDB keyspace setup..."
        sh /scylladb/setup_keyspace_init.sh

  # ---------------- Chat Service (Elixir) ----------------
  chat_service:
    build:
      context: ./services/chat_service
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      APP_NAME: "${APP_NAME} Chat"
      ENV: ${ENV}
      PHX_SERVER: "true"
      PHX_HOST: auth.${APP_DOMAIN}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      SCYLLA_HOST: scylla_db
      SCYLLA_PORT: "9042"
      SCYLLA_KEYSPACE: laju_chat
      REDIS_HOST: redis_cache
      REDIS_PASSWORD: ${REDIS_PASS}
      RABBITMQ_URL: amqp://${RABBIT_USER}:${RABBIT_PASS}@rabbitmq:5672/%2f
      JWT_SECRET: ${JWT_SECRET}
      USE_OLLAMA: ${USE_OLLAMA:-false}
      SUPPORT_AI_USE_OLLAMA: ${SUPPORT_AI_USE_OLLAMA:-false}
      CHAT_OLLAMA_URL: ${CHAT_OLLAMA_URL:-http://ollama:11434}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_SUPPORT_MODEL: ${OLLAMA_SUPPORT_MODEL:-}
      OLLAMA_BUSINESS_MODEL: ${OLLAMA_BUSINESS_MODEL:-llama3.2:3b}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      OLLAMA_SUPPORT_TIMEOUT_MS: ${OLLAMA_SUPPORT_TIMEOUT_MS:-8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-}
      CHAT_MEDIA_ALLOWED_ORIGINS: ${CHAT_MEDIA_ALLOWED_ORIGINS:-}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4000/api/health" ]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 90s
    networks:
      - web
    restart: unless-stopped
    depends_on:
      scylla_keyspace_setup: { condition: service_completed_successfully }
      redis_cache: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  # ---------------- Marketplace Service (Rust) ----------------
  marketplace_service:
    build:
      context: ./services/marketplace_service
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${PORT_MARKETPLACE:-8081}:8081"
    environment:
      APP_PORT: "8081"
      MARKETPLACE_DATABASE_URL: postgres://${DB_USER}:${DB_PASS}@marketplace_db:5432/marketplace_db
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_KEY}
      REDIS_URL: redis://:${REDIS_PASS}@redis_cache:6379
      REDIS_HOST: redis_cache
      REDIS_PASSWORD: ${REDIS_PASS}
      RABBITMQ_URL: amqp://${RABBIT_USER}:${RABBIT_PASS}@rabbitmq:5672/%2f
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBIT_USER}
      RABBITMQ_PASSWORD: ${RABBIT_PASS} # Tambahkan ini agar entrypoint.sh bisa baca
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003}
      OUTBOX_EXCHANGE: ${OUTBOX_EXCHANGE:-marketplace.outbox}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-50}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-1500}
      WALLET_DEFAULT_ENV: ${WALLET_DEFAULT_ENV:-development}
      WALLET_LIVE_ENABLED: ${WALLET_LIVE_ENABLED:-false}
      WALLET_DEFAULT_PROVIDER: ${WALLET_DEFAULT_PROVIDER:-midtrans}
      WALLET_DEV_AUTO_SETTLE: ${WALLET_DEV_AUTO_SETTLE:-true}
      WALLET_ALLOW_LIVE_IN_NON_PROD: ${WALLET_ALLOW_LIVE_IN_NON_PROD:-false}
      WALLET_ALLOW_MOCK_IN_LIVE: ${WALLET_ALLOW_MOCK_IN_LIVE:-false}
      WALLET_MIDTRANS_FALLBACK_TO_MOCK: ${WALLET_MIDTRANS_FALLBACK_TO_MOCK:-true}
      MIDTRANS_MERCHANT_ID: ${MIDTRANS_MERCHANT_ID:-}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_SERVER_KEY_SANDBOX: ${MIDTRANS_SERVER_KEY_SANDBOX:-}
      MIDTRANS_SERVER_KEY_LIVE: ${MIDTRANS_SERVER_KEY_LIVE:-}
      MIDTRANS_PAYMENT_NOTIFICATION_URL: ${MIDTRANS_PAYMENT_NOTIFICATION_URL:-}
      WALLET_MIDTRANS_NOTIFICATION_URL: ${WALLET_MIDTRANS_NOTIFICATION_URL:-}
      MIDTRANS_FINISH_REDIRECT_URL: ${MIDTRANS_FINISH_REDIRECT_URL:-}
      MIDTRANS_UNFINISH_REDIRECT_URL: ${MIDTRANS_UNFINISH_REDIRECT_URL:-}
      MIDTRANS_ERROR_REDIRECT_URL: ${MIDTRANS_ERROR_REDIRECT_URL:-}
      WALLET_MIDTRANS_FINISH_REDIRECT_URL: ${WALLET_MIDTRANS_FINISH_REDIRECT_URL:-}
      WALLET_MIDTRANS_UNFINISH_REDIRECT_URL: ${WALLET_MIDTRANS_UNFINISH_REDIRECT_URL:-}
      WALLET_MIDTRANS_ERROR_REDIRECT_URL: ${WALLET_MIDTRANS_ERROR_REDIRECT_URL:-}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS_MARKETPLACE:-true}
    depends_on:
      marketplace_db: { condition: service_healthy }
      redis_cache: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      meilisearch: { condition: service_healthy }
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/health" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 180s
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - web
    restart: unless-stopped

  # ---------------- Community Service (Rust) ----------------
  community_service:
    build:
      context: ./services/community_service
      dockerfile: Dockerfile
    ports:
      - "${PORT_COMMUNITY:-8082}:8082"
    environment:
      ENV: ${ENV:-development}
      APP_NAME: ${APP_NAME:-community_service}
      APP_PORT: "8082"
      COMMUNITY_DATABASE_URL: postgres://${DB_USER}:${DB_PASS}@community_db:5432/community_db
      REDIS_URL: redis://:${REDIS_PASS}@redis_cache:6379
      REDIS_HOST: redis_cache
      REDIS_PASSWORD: ${REDIS_PASS}
      RABBITMQ_URL: amqp://${RABBIT_USER}:${RABBIT_PASS}@rabbitmq:5672/%2f
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBIT_USER}
      RABBITMQ_PASSWORD: ${RABBIT_PASS}
      IDENTITY_OUTBOX_EXCHANGE: ${IDENTITY_OUTBOX_EXCHANGE:-identity.outbox}
      COMMUNITY_IDENTITY_QUEUE: ${COMMUNITY_IDENTITY_QUEUE:-community.identity.profile}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003}
      COMMUNITY_UPLOAD_DIR: /app/uploads/forum
      COMMUNITY_MEDIA_PUBLIC_PATH: /api/forum/media
      INTERNAL_API_URL: http://identity_service:8080
      RUN_MIGRATIONS: ${RUN_MIGRATIONS_COMMUNITY:-true}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - community_uploads:/app/uploads/forum
    depends_on:
      community_db: { condition: service_healthy }
      identity_service: { condition: service_healthy }
      redis_cache: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8082/health" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - web
    restart: unless-stopped

  # ---------------- Meilisearch ----------------
  meilisearch:
    image: getmeili/meilisearch:v1.5
    environment:
      - MEILI_MASTER_KEY=${MEILI_KEY}
      - MEILI_ENV=${ENV}
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:7700/health" ]
      interval: 10s
    networks:
      - web
    restart: unless-stopped

