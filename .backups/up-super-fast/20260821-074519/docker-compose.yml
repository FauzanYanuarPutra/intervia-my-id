  # ---------------- Storage ----------------
  minio:
    image: minio/minio
    restart: unless-stopped
    ports:
      - "${PORT_MINIO_API:-9002}:9002" # API
      - "${PORT_MINIO_UI:-9005}:9001" # UI/Console (Changed default to 9005)
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS}
    volumes:
      - minio_data:/data
    command: server /data --address ":9002" --console-address ":9001"
    healthcheck:
      test: [ "CMD-SHELL", "mc alias set local http://localhost:9002 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" >/dev/null 2>&1 && mc ready local" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - web

  # ---------------- Frontend ----------------
  www:
    build:
      context: ./frontend
      dockerfile: www/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    ports:
      - "${PORT_FRONTEND:-3000}:3000"
    environment:
      NODE_ENV: production
      ENV: ${ENV:-development}
      APP_ENV: ${APP_ENV:-development}
      NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-development}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      # URL untuk Client-side (Browser)
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      NEXT_PUBLIC_MARKETPLACE_URL: http://localhost:8081
      NEXT_PUBLIC_MARKETPLACE_WS_URL: ${NEXT_PUBLIC_MARKETPLACE_WS_URL:-}
      NEXT_PUBLIC_CHAT_WS_URL: ${NEXT_PUBLIC_CHAT_WS_URL:-}
      NEXT_PUBLIC_NOTIFICATION_WS_URL: ${NEXT_PUBLIC_NOTIFICATION_WS_URL:-}
      NEXT_PUBLIC_WWW_URL: ${NEXT_PUBLIC_WWW_URL:-http://localhost:3000}
