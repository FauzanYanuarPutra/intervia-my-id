      - web

  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "${PORT_MAILHOG_SMTP:-1025}:1025"
      - "${PORT_MAILHOG_UI:-8025}:8025"
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Teruskan variabel dari .env ke dalam Caddy
      - APP_DOMAIN=${APP_DOMAIN:-localhost}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@lajukan.com}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - web

  cloudflare_tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles:
      - tunnel
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    command: tunnel --metrics 0.0.0.0:20241 --protocol http2 run
    ports:
      - "127.0.0.1:${PORT_CLOUDFLARE_METRICS:-20241}:20241"
    networks:
      - web

  # ---------------- UI TOOLS ----------------
  pgadmin:
    image: dpage/pgadmin4
    deploy:
      replicas: ${REPLICAS_UI:-1}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${DB_PASS}
      PGADMIN_CONFIG_ALLOW_SPECIAL_EMAIL_DOMAINS: '["local"]'
    ports:
      - "${PORT_PGADMIN:-5050}:80"
    networks:
      - web

  db_ui:
    image: dbgate/dbgate
    deploy:
      replicas: ${REPLICAS_UI:-1}
    environment:
      - CONNECTIONS=scylla_db_conn
      - LABEL_scylla_db_conn=ScyllaDB
      - ENGINE_scylla_db_conn=cassandra
      - SERVER_scylla_db_conn=scylla_db
      - PORT_scylla_db_conn=9042
    ports:
      - "${PORT_DBUI:-3005}:3000"
    networks:
      - web

  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: mailserver
    hostname: mail
    domainname: lajukan.com # Ganti dengan domain Anda
    ports:
      - "25:25" # SMTP (Inbound)
      - "587:587" # SMTP (Submission/Outbound)
      - "993:993" # IMAP (Secure)
    volumes:
      - ./docker-data/dms/mail-data/:/var/mail/
      - ./docker-data/dms/mail-state/:/var/mail-state/
      - ./docker-data/dms/mail-logs/:/var/log/mail/
      - ./docker-data/dms/config/:/tmp/docker-mailserver/
      - /etc/localtime:/etc/localtime:ro
    environment:
      - ENABLE_SPAMASSASSIN=1
      - ENABLE_CLAMAV=1
      - ENABLE_FAIL2BAN=1
      - ONE_DIR=1
      - DMS_DEBUG=0
      - SSL_TYPE=letsencrypt
    restart: always
    profiles:
      - mailserver
