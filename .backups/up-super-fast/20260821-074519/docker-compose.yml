  crm:
    build:
      context: ./frontend
      dockerfile: crm/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    ports:
      - "${PORT_CRM:-3002}:3002"
    environment:
      NODE_ENV: production
