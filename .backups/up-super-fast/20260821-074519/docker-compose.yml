    build:
      context: ./frontend
      dockerfile: cms/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    ports:
      - "${PORT_CMS:-3001}:3001"
    environment:
      NODE_ENV: production
