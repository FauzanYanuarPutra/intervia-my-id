      identity_service:
        condition: service_healthy
      ai_service:
        condition: service_healthy
        required: false
    ports:
      - "127.0.0.1:${PORT_CRM:-3002}:3002"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3002').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 768m
    cpus: "1.00"
    networks: [web]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # DEVELOPMENT TOOLS
  # ---------------------------------------------------------------------------

  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT_MAILHOG_SMTP:-1025}:1025"
      - "127.0.0.1:${PORT_MAILHOG_UI:-8025}:8025"
    mem_limit: 128m
    cpus: "0.25"
    networks: [web]
    logging: *default-logging

  pgadmin:
    profiles: [tools]
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-changeme-dev}
      PGADMIN_CONFIG_CHECK_EMAIL_DELIVERABILITY: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "127.0.0.1:${PORT_PGADMIN:-5050}:80"
    mem_limit: 384m
    cpus: "0.50"
    networks: [web]
    logging: *default-logging

  dbgate:
    profiles: [tools]
    image: dbgate/dbgate
    restart: unless-stopped
    environment:
      CONNECTIONS: scylla_db_conn
      LABEL_scylla_db_conn: ScyllaDB
      ENGINE_scylla_db_conn: cassandra
      SERVER_scylla_db_conn: scylla_db
      PORT_scylla_db_conn: "9042"
    ports:
      - "127.0.0.1:${PORT_DBUI:-3005}:3000"
    mem_limit: 256m
    cpus: "0.35"
    networks: [web]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # OPTIONAL LOCAL EDGE / TUNNEL / MAIL SERVER
  # ---------------------------------------------------------------------------

  caddy:
    profiles: [edge]
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@lajukan.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    mem_limit: 192m
    cpus: "0.30"
    networks: [web]
    logging: *default-logging

  cloudflare_tunnel:
    profiles: [tunnel]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    command: tunnel --protocol http2 run
    mem_limit: 192m
    cpus: "0.30"
    networks: [web]
    logging: *default-logging

  mailserver:
    profiles: [mailserver]
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: mailserver
    hostname: mail
    domainname: ${MAIL_DOMAIN:-lajukan.com}
    restart: unless-stopped
    ports:
      - "25:25"
      - "587:587"
      - "993:993"
    volumes:
      - ./docker-data/dms/mail-data/:/var/mail/
      - ./docker-data/dms/mail-state/:/var/mail-state/
      - ./docker-data/dms/mail-logs/:/var/log/mail/
      - ./docker-data/dms/config/:/tmp/docker-mailserver/
    environment:
      ENABLE_SPAMASSASSIN: "1"
