# Lajukan development stack
# Target: Windows 11 + Docker Desktop/WSL2, laptop kelas Acer Aspire 5 Ryzen 5 5500U / RAM 20 GB.
#
# Prinsip file ini:
# - Standalone development compose (tidak perlu digabung dengan docker-compose.yml).
# - Core service selalu aktif.
# - Backoffice/tools/KYC/RAG/edge diaktifkan lewat profile agar RAM tidak boros.
# - ai_service selalu aktif sebagai AI gateway yang ringan.
# - Ollama hanya aktif lewat profile `ai`; model dilepas setelah idle.
# - Browser/frontend tidak perlu mengakses Ollama langsung; www -> ai_service -> Ollama/provider.
# - Scylla tetap memakai data volume 2025.2; container diberi headroom 1.5 GB agar Seastar bisa start.
#
# Run core:
#   docker compose --env-file .env.development -f docker-compose.dev.yml up -d
#
# Run core + local AI:
#   docker compose --env-file .env.development -f docker-compose.dev.yml --profile ai up -d
#
# Run core + AI + backoffice:
#   docker compose --env-file .env.development -f docker-compose.dev.yml --profile ai --profile backoffice up -d
#
# Semua optional profile:
#   ai, backoffice, tools, kyc, rag, edge, tunnel, mailserver

x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

x-common-dns: &common-dns
  - 1.1.1.1
  - 8.8.8.8

services:
  # ---------------------------------------------------------------------------
  # DATA LAYER
  # ---------------------------------------------------------------------------

  identity_db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: identity_db
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_connections=80
      - -c
      - shared_buffers=96MB
    volumes:
      - identity_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${PORT_IDENTITY_DB:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d identity_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 384m
    cpus: "0.60"
    networks: [web]
    logging: *default-logging

  community_db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: community_db
    command:
      - postgres
      - -c
      - max_connections=70
      - -c
      - shared_buffers=80MB
    volumes:
      - community_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${PORT_COMMUNITY_DB:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d community_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 320m
    cpus: "0.50"
    networks: [web]
    logging: *default-logging

  marketplace_db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: marketplace_db
    command:
      - postgres
      - -c
      - max_connections=90
      - -c
      - shared_buffers=128MB
    volumes:
      - marketplace_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${PORT_MARKETPLACE_DB:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d marketplace_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 448m
    cpus: "0.70"
    networks: [web]
    logging: *default-logging

  redis_cache:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASS}
      - --save
      - "60"
      - "1"
      - --maxmemory
      - "192mb"
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${PORT_REDIS:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASS}' ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    cpus: "0.35"
    networks: [web]
    logging: *default-logging

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:${PORT_RABBITMQ:-5672}:5672"
      - "127.0.0.1:${PORT_RABBITMQ_UI:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 45s
    mem_limit: 512m
    cpus: "0.70"
    networks: [web]
    logging: *default-logging

  # NOTE:
  # Data volume yang sekarang berasal dari ScyllaDB 2025.2.
  # Jangan mengganti default image langsung ke 2026.x tanpa mengikuti upgrade path.
  # Setelah migration direncanakan, set SCYLLA_IMAGE ke patch LTS yang dituju.
  scylla_db:
    image: ${SCYLLA_IMAGE:-scylladb/scylla:2025.2}
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    environment:
      SCYLLA_CLUSTER_NAME: "${APP_NAME:-Lajukan}DevCluster"
    command:
      - --smp
      - "1"

      # Scylla/Seastar memory. Keep this below the container limit so
      # housekeeping, node_exporter, libc and OS/cgroup overhead have headroom.
      - --memory
      - 768M
      - --reserve-memory
      - 256M

      # Development/shared-machine mode.
      - --overprovisioned
      - "1"
      - --developer-mode
      - "1"
    volumes:
      - scylla_data:/var/lib/scylla
    ports:
      - "127.0.0.1:${PORT_SCYLLA:-9042}:9042"
    healthcheck:
      test: ["CMD", "nodetool", "status"]
      interval: 20s
      timeout: 15s
      retries: 20
      start_period: 120s

    # Scylla recommends at least ~1.5 GB/container even for Docker.
    # The database itself remains capped at 768M above.
    mem_limit: 1536m
    cpus: "1.20"
    networks: [web]
    logging: *default-logging

  scylla_keyspace_setup:
    image: ${SCYLLA_IMAGE:-scylladb/scylla:2025.2}
    restart: "no"
    volumes:
      - ./services/chat_service/priv/scylladb:/scylladb:ro
    depends_on:
      scylla_db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        sed 's/\r//g' /scylladb/setup_keyspace_init.sh > /tmp/setup_keyspace_init.sh
        echo "Running ScyllaDB keyspace setup..."
        sh /tmp/setup_keyspace_init.sh
    mem_limit: 256m
    cpus: "0.40"
    networks: [web]
    logging: *default-logging

  meilisearch:
    # Keep existing major/minor by default. Upgrade indexes intentionally, not silently.
    image: ${MEILI_IMAGE:-getmeili/meilisearch:v1.5}
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_KEY}
      MEILI_ENV: ${ENV:-development}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data
    ports:
      - "127.0.0.1:${PORT_MEILI:-7700}:7700"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    cpus: "0.80"
    networks: [web]
    logging: *default-logging

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --address ":9002" --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:${PORT_MINIO_API:-9002}:9002"
      - "127.0.0.1:${PORT_MINIO_UI:-9005}:9001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mc alias set local http://localhost:9002 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" >/dev/null 2>&1 && mc ready local",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 384m
    cpus: "0.50"
    networks: [web]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # CORE BACKEND SERVICES
  # ---------------------------------------------------------------------------

  identity_service:
    build:
      context: ./services/identity_service
      dockerfile: Dockerfile
    container_name: laju_identity_service
    restart: unless-stopped
    init: true
    environment:
      ENV: ${ENV:-development}
      APP_NAME: ${APP_NAME:-identity_service}
      APP_PORT: "8080"
      APP_VERSION: ${APP_VERSION:-0.1.0}
      RUST_LOG: ${RUST_LOG:-info}

      IDENTITY_DATABASE_URL: postgres://${DB_USER}:${DB_PASS}@identity_db:5432/identity_db
      POSTGRES_HOST: identity_db
      POSTGRES_USER: ${DB_USER}

      REDIS_URL: redis://:${REDIS_PASS}@redis_cache:6379
      REDIS_HOST: redis_cache
      REDIS_PASSWORD: ${REDIS_PASS}

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBIT_USER}
      RABBITMQ_PASSWORD: ${RABBIT_PASS}
      RABBITMQ_URL: amqp://${RABBIT_USER}:${RABBIT_PASS}@rabbitmq:5672/%2f
      IDENTITY_OUTBOX_EXCHANGE: ${IDENTITY_OUTBOX_EXCHANGE:-identity.outbox}
      IDENTITY_OUTBOX_BATCH_SIZE: ${IDENTITY_OUTBOX_BATCH_SIZE:-50}
      IDENTITY_OUTBOX_POLL_MS: ${IDENTITY_OUTBOX_POLL_MS:-750}

      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-laju}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-laju_users}
      ACCESS_TOKEN_EXP_HOURS: ${ACCESS_TOKEN_EXP_HOURS:-1}
      REFRESH_TOKEN_EXP_DAYS: ${REFRESH_TOKEN_EXP_DAYS:-30}
      MAX_LOGIN_ATTEMPTS: ${MAX_LOGIN_ATTEMPTS:-5}
      LOCKOUT_DURATION_MIN: ${LOCKOUT_DURATION_MIN:-15}
      FAILED_LOGIN_DELAY_MS: ${FAILED_LOGIN_DELAY_MS:-1000}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}

      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS_IDENTITY:-true}
    depends_on:
      identity_db:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT_IDENTITY:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 30s
    mem_limit: 512m
    cpus: "1.00"
    dns: *common-dns
    networks: [web]
    logging: *default-logging

  marketplace_service:
    build:
      context: ./services/marketplace_service
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      ENV: ${ENV:-development}
      APP_PORT: "8081"
      RUST_LOG: ${RUST_LOG:-info}

      MARKETPLACE_DATABASE_URL: postgres://${DB_USER}:${DB_PASS}@marketplace_db:5432/marketplace_db
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_KEY}

      REDIS_URL: redis://:${REDIS_PASS}@redis_cache:6379
      REDIS_HOST: redis_cache
      REDIS_PASSWORD: ${REDIS_PASS}

      RABBITMQ_URL: amqp://${RABBIT_USER}:${RABBIT_PASS}@rabbitmq:5672/%2f
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBIT_USER}
      RABBITMQ_PASSWORD: ${RABBIT_PASS}

      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003}
      OUTBOX_EXCHANGE: ${OUTBOX_EXCHANGE:-marketplace.outbox}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-50}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-1500}

      WALLET_DEFAULT_ENV: ${WALLET_DEFAULT_ENV:-development}
      WALLET_LIVE_ENABLED: ${WALLET_LIVE_ENABLED:-false}
      WALLET_DEFAULT_PROVIDER: ${WALLET_DEFAULT_PROVIDER:-midtrans}
      WALLET_DEV_AUTO_SETTLE: ${WALLET_DEV_AUTO_SETTLE:-true}
      WALLET_ALLOW_LIVE_IN_NON_PROD: ${WALLET_ALLOW_LIVE_IN_NON_PROD:-false}
      WALLET_ALLOW_MOCK_IN_LIVE: ${WALLET_ALLOW_MOCK_IN_LIVE:-false}
      WALLET_MIDTRANS_FALLBACK_TO_MOCK: ${WALLET_MIDTRANS_FALLBACK_TO_MOCK:-true}

      MIDTRANS_MERCHANT_ID: ${MIDTRANS_MERCHANT_ID:-}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_SERVER_KEY_SANDBOX: ${MIDTRANS_SERVER_KEY_SANDBOX:-}
      MIDTRANS_SERVER_KEY_LIVE: ${MIDTRANS_SERVER_KEY_LIVE:-}
      MIDTRANS_PAYMENT_NOTIFICATION_URL: ${MIDTRANS_PAYMENT_NOTIFICATION_URL:-}
      WALLET_MIDTRANS_NOTIFICATION_URL: ${WALLET_MIDTRANS_NOTIFICATION_URL:-}
      MIDTRANS_FINISH_REDIRECT_URL: ${MIDTRANS_FINISH_REDIRECT_URL:-}
      MIDTRANS_UNFINISH_REDIRECT_URL: ${MIDTRANS_UNFINISH_REDIRECT_URL:-}
      MIDTRANS_ERROR_REDIRECT_URL: ${MIDTRANS_ERROR_REDIRECT_URL:-}
      WALLET_MIDTRANS_FINISH_REDIRECT_URL: ${WALLET_MIDTRANS_FINISH_REDIRECT_URL:-}
      WALLET_MIDTRANS_UNFINISH_REDIRECT_URL: ${WALLET_MIDTRANS_UNFINISH_REDIRECT_URL:-}
      WALLET_MIDTRANS_ERROR_REDIRECT_URL: ${WALLET_MIDTRANS_ERROR_REDIRECT_URL:-}

      RUN_MIGRATIONS: ${RUN_MIGRATIONS_MARKETPLACE:-true}
    depends_on:
      marketplace_db:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT_MARKETPLACE:-8081}:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    mem_limit: 768m
    cpus: "1.25"
    dns: *common-dns
    networks: [web]
    logging: *default-logging

  community_service:
    build:
      context: ./services/community_service
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      ENV: ${ENV:-development}
      APP_NAME: ${APP_NAME:-community_service}
      APP_PORT: "8082"
      RUST_LOG: ${RUST_LOG:-info}

      COMMUNITY_DATABASE_URL: postgres://${DB_USER}:${DB_PASS}@community_db:5432/community_db
      REDIS_URL: redis://:${REDIS_PASS}@redis_cache:6379
      REDIS_HOST: redis_cache
      REDIS_PASSWORD: ${REDIS_PASS}

      RABBITMQ_URL: amqp://${RABBIT_USER}:${RABBIT_PASS}@rabbitmq:5672/%2f
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBIT_USER}
      RABBITMQ_PASSWORD: ${RABBIT_PASS}
      IDENTITY_OUTBOX_EXCHANGE: ${IDENTITY_OUTBOX_EXCHANGE:-identity.outbox}
      COMMUNITY_IDENTITY_QUEUE: ${COMMUNITY_IDENTITY_QUEUE:-community.identity.profile}

      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003}
      COMMUNITY_UPLOAD_DIR: /app/uploads/forum
      COMMUNITY_MEDIA_PUBLIC_PATH: /api/forum/media
      INTERNAL_API_URL: http://identity_service:8080
      RUN_MIGRATIONS: ${RUN_MIGRATIONS_COMMUNITY:-true}
    volumes:
      - community_uploads:/app/uploads/forum
    depends_on:
      community_db:
        condition: service_healthy
      identity_service:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT_COMMUNITY:-8082}:8082"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    mem_limit: 512m
    cpus: "0.90"
    dns: *common-dns
    networks: [web]
    logging: *default-logging

  chat_service:
    build:
      context: ./services/chat_service
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      APP_NAME: "${APP_NAME:-Lajukan} Chat"
      ENV: ${ENV:-development}
      PHX_SERVER: "true"
      PHX_HOST: ${PHX_HOST:-localhost}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}

      SCYLLA_HOST: scylla_db
      SCYLLA_PORT: "9042"
      SCYLLA_KEYSPACE: ${SCYLLA_KEYSPACE:-laju_chat}

      REDIS_HOST: redis_cache
      REDIS_PASSWORD: ${REDIS_PASS}
      RABBITMQ_URL: amqp://${RABBIT_USER}:${RABBIT_PASS}@rabbitmq:5672/%2f
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003}
    depends_on:
      scylla_keyspace_setup:
        condition: service_completed_successfully
      redis_cache:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT_CHAT:-4000}:4000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/api/health"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 90s
    mem_limit: 640m
    cpus: "1.00"
    dns: *common-dns
    networks: [web]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # LAJUKAN AI GATEWAY
  # ---------------------------------------------------------------------------

  ai_service:
    build:
      context: ./services/ai_service
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      PORT: "8080"
      RUST_LOG: ${AI_RUST_LOG:-info}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}

      # OpenAI-compatible inference endpoint. Ollama implements /v1/*.
      VLLM_URL: ${VLLM_URL:-http://ollama:11434/v1}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      VLLM_MODEL: ${VLLM_MODEL:-qwen3:4b}
      VLLM_STRUCTURED_MODEL: ${VLLM_STRUCTURED_MODEL:-qwen3:4b}
      VLLM_VISION_MODEL: ${VLLM_VISION_MODEL:-qwen3-vl:2b}
      VLLM_KYC_MODEL: ${VLLM_KYC_MODEL:-qwen3:4b}

      # Qwen3 thinking can consume the whole token budget and leave content empty.
      # Ollama's OpenAI-compatible endpoint supports reasoning_effort=none.
      VLLM_REASONING_EFFORT: ${VLLM_REASONING_EFFORT:-none}

      # Keep false until the selected Ollama/model combination is regression-tested.
      VLLM_STRUCTURED_OUTPUTS: ${VLLM_STRUCTURED_OUTPUTS:-false}

      # Optional KYC dependencies. AI service itself stays healthy without them.
      OCR_URL: ${OCR_URL:-http://ocr_service:8000/predict}
      LIVENESS_URL: ${LIVENESS_URL:-http://liveness_service:8000/check}
      FACE_MATCH_URL: ${FACE_MATCH_URL:-}
      FACE_MATCH_THRESHOLD: ${FACE_MATCH_THRESHOLD:-0.72}
      REQUIRE_FACE_MATCH_FOR_IDENTITY: ${REQUIRE_FACE_MATCH_FOR_IDENTITY:-true}
      KYC_INCLUDE_RAW_CAPTURE: ${KYC_INCLUDE_RAW_CAPTURE:-false}
      KYC_MAX_IMAGE_BYTES: ${KYC_MAX_IMAGE_BYTES:-7340032}

      # Optional RAG gateway. Do not point this directly at Qdrant REST API.
      RAG_URL: ${RAG_URL:-}
      RAG_SERVICE_TOKEN: ${RAG_SERVICE_TOKEN:-}
      RAG_LIMIT: ${RAG_LIMIT:-6}

      # Laptop-friendly limits.
      AI_MAX_CONCURRENT: ${AI_MAX_CONCURRENT:-1}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-800}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-90000}
      AI_DEPENDENCY_TIMEOUT_MS: ${AI_DEPENDENCY_TIMEOUT_MS:-15000}
      AI_MAX_BODY_BYTES: ${AI_MAX_BODY_BYTES:-14680064}
      AI_MAX_CONTEXT_CHARS: ${AI_MAX_CONTEXT_CHARS:-22000}
      AI_MAX_MESSAGE_CHARS: ${AI_MAX_MESSAGE_CHARS:-6000}
      AI_MAX_MESSAGES: ${AI_MAX_MESSAGES:-18}
      AI_MAX_INLINE_MEDIA_CHARS: ${AI_MAX_INLINE_MEDIA_CHARS:-3000000}

      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003}
    ports:
      - "127.0.0.1:${PORT_AI_SERVICE:-8084}:8080"
    healthcheck:
      # /health = process healthy. /ready intentionally depends on the model provider.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 320m
    cpus: "0.60"
    networks: [web]
    logging: *default-logging

  # Local inference engine. Disabled by default to keep laptop RAM cool.
  # Enable with: --profile ai
  ollama:
    image: ollama/ollama:latest
    profiles: [ai]
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_MAX_QUEUE: ${OLLAMA_MAX_QUEUE:-16}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-4096}
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-1}
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-q8_0}
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    mem_limit: 6g
    cpus: "6.00"
    networks: [web]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # OPTIONAL KYC / VISION INFRA
  # ---------------------------------------------------------------------------

  ocr_service:
    profiles: [kyc]
    build:
      context: ./services/ocr_service
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      LOG_LEVEL: ${OCR_LOG_LEVEL:-INFO}
      OCR_LANG: ${OCR_LANG:-id}
      OCR_VERSION: ${OCR_VERSION:-PP-OCRv5}
      OCR_DEVICE: ${OCR_DEVICE:-cpu}

      OCR_MAX_CONCURRENT: ${OCR_MAX_CONCURRENT:-1}
      OCR_QUEUE_TIMEOUT_SEC: ${OCR_QUEUE_TIMEOUT_SEC:-5}
      OCR_MAX_UPLOAD_BYTES: ${OCR_MAX_UPLOAD_BYTES:-8388608}
      OCR_MAX_IMAGE_PIXELS: ${OCR_MAX_IMAGE_PIXELS:-16000000}
      OCR_MAX_SIDE: ${OCR_MAX_SIDE:-2200}
      OCR_MIN_CARD_WIDTH: ${OCR_MIN_CARD_WIDTH:-1200}
      OCR_MAX_VARIANTS: ${OCR_MAX_VARIANTS:-3}
      OCR_MIN_SEGMENT_CONFIDENCE: ${OCR_MIN_SEGMENT_CONFIDENCE:-0.35}
      OCR_STRONG_MEAN_CONFIDENCE: ${OCR_STRONG_MEAN_CONFIDENCE:-0.78}

      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      OMP_NUM_THREADS: ${OCR_OMP_NUM_THREADS:-2}
      OPENBLAS_NUM_THREADS: ${OCR_OPENBLAS_NUM_THREADS:-2}
      MKL_NUM_THREADS: ${OCR_MKL_NUM_THREADS:-2}
      NUMEXPR_NUM_THREADS: ${OCR_NUMEXPR_NUM_THREADS:-2}
    volumes:
      - paddleocr_models:/home/app/.paddlex
    ports:
      - "127.0.0.1:${PORT_OCR:-8001}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 180s
    mem_limit: 2g
    cpus: "2.00"
    networks: [web]
    logging: *default-logging

  # Replace the current liveness_service block in docker-compose.dev.yml with this.
  liveness_service:
    profiles: [kyc]
    build:
      context: ./services/liveness_service
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      LOG_LEVEL: ${LIVENESS_LOG_LEVEL:-INFO}

      LIVENESS_MODEL_DIR: /app/resources/anti_spoof_models
      LIVENESS_THRESHOLD: ${LIVENESS_THRESHOLD:-0.90}
      LIVENESS_REAL_CLASS: ${LIVENESS_REAL_CLASS:-1}
      LIVENESS_OUTPUT_IS_LOGITS: ${LIVENESS_OUTPUT_IS_LOGITS:-true}
      LIVENESS_BINARY_OUTPUT_IS_REAL: ${LIVENESS_BINARY_OUTPUT_IS_REAL:-true}

      # Model preprocessing. Calibrate these to the exact ONNX model you deploy.
      LIVENESS_COLOR_ORDER: ${LIVENESS_COLOR_ORDER:-BGR}
      LIVENESS_INPUT_SCALE: ${LIVENESS_INPUT_SCALE:-255}
      LIVENESS_INPUT_MEAN: ${LIVENESS_INPUT_MEAN:-0,0,0}
      LIVENESS_INPUT_STD: ${LIVENESS_INPUT_STD:-1,1,1}
      LIVENESS_CROP_SCALE: ${LIVENESS_CROP_SCALE:-1.35}

      # Capture gates are quality checks only, never proof of liveness.
      LIVENESS_MIN_FACE_COVERAGE: ${LIVENESS_MIN_FACE_COVERAGE:-0.075}
      LIVENESS_MAX_FACE_COVERAGE: ${LIVENESS_MAX_FACE_COVERAGE:-0.70}
      LIVENESS_MIN_BLUR_VARIANCE: ${LIVENESS_MIN_BLUR_VARIANCE:-55}
      LIVENESS_MIN_BRIGHTNESS: ${LIVENESS_MIN_BRIGHTNESS:-45}
      LIVENESS_MAX_BRIGHTNESS: ${LIVENESS_MAX_BRIGHTNESS:-220}
      LIVENESS_MAX_CENTER_OFFSET: ${LIVENESS_MAX_CENTER_OFFSET:-0.38}

      LIVENESS_MAX_CONCURRENT: ${LIVENESS_MAX_CONCURRENT:-1}
      LIVENESS_QUEUE_TIMEOUT_SEC: ${LIVENESS_QUEUE_TIMEOUT_SEC:-5}
      LIVENESS_MAX_UPLOAD_BYTES: ${LIVENESS_MAX_UPLOAD_BYTES:-6291456}
      LIVENESS_MAX_IMAGE_PIXELS: ${LIVENESS_MAX_IMAGE_PIXELS:-12000000}

      LIVENESS_ORT_INTRA_OP_THREADS: ${LIVENESS_ORT_INTRA_OP_THREADS:-2}
      LIVENESS_ORT_INTER_OP_THREADS: ${LIVENESS_ORT_INTER_OP_THREADS:-1}
    ports:
      - "127.0.0.1:${PORT_LIVENESS:-8002}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 1024m
    cpus: "1.50"
    networks: [web]
    logging: *default-logging


  # Qdrant is infrastructure only. A RAG adapter/API still needs to sit between
  # ai_service and Qdrant so retrieval, filtering, reranking and authorization
  # stay outside the LLM.
  qdrant:
    profiles: [rag]
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.16.3}
    restart: unless-stopped
    environment:
      QDRANT__STORAGE__ALLOW_UNRECOGNIZED_FILESYSTEM: "true"
      QDRANT__LOGGER__LEVEL: ${QDRANT_LOG_LEVEL:-WARN}
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:${PORT_QDRANT:-6333}:6333"
      - "127.0.0.1:${PORT_QDRANT_GRPC:-6334}:6334"
    mem_limit: 768m
    cpus: "1.00"
    networks: [web]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # FRONTEND - MAIN APP
  # ---------------------------------------------------------------------------

  www:
    build:
      context: ./frontend
      dockerfile: www/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      ENV: ${ENV:-development}
      APP_ENV: ${APP_ENV:-development}
      NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-development}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}

      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      NEXT_PUBLIC_MARKETPLACE_URL: ${NEXT_PUBLIC_MARKETPLACE_URL:-http://localhost:8081}
      NEXT_PUBLIC_MARKETPLACE_WS_URL: ${NEXT_PUBLIC_MARKETPLACE_WS_URL:-}
      NEXT_PUBLIC_CHAT_WS_URL: ${NEXT_PUBLIC_CHAT_WS_URL:-}
      NEXT_PUBLIC_NOTIFICATION_WS_URL: ${NEXT_PUBLIC_NOTIFICATION_WS_URL:-}
      NEXT_PUBLIC_WWW_URL: ${NEXT_PUBLIC_WWW_URL:-http://localhost:3000}
      NEXT_PUBLIC_USAHA_URL: ${NEXT_PUBLIC_USAHA_URL:-http://localhost:3003}
      NEXT_PUBLIC_COMMUNITY_URL: ${NEXT_PUBLIC_COMMUNITY_URL:-http://localhost:8082}

      INTERNAL_API_URL: http://identity_service:8080
      INTERNAL_MARKETPLACE_URL: http://marketplace_service:8081
      MARKETPLACE_URL: http://marketplace_service:8081
      INTERNAL_COMMUNITY_URL: http://community_service:8082
      COMMUNITY_SERVICE_URL: http://community_service:8082
      INTERNAL_CHAT_URL: http://chat_service:4000

      # AI always goes through the Lajukan Rust gateway first.
      INTERNAL_AI_URL: ${INTERNAL_AI_URL:-http://ai_service:8080}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      # BFF timeout should be slightly larger than ai_service provider timeout.
      AI_REQUEST_TIMEOUT_MS: ${AI_GATEWAY_TIMEOUT_MS:-105000}
      USE_OLLAMA: "false"
      # Kept for startup/model tooling compatibility; frontend should not use it as primary provider.
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      OLLAMA_BUSINESS_MODEL: ${OLLAMA_BUSINESS_MODEL:-qwen3:4b}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-qwen3-vl:2b}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      PERSONAL_AI_FAST_PROVIDER_FIRST: ${PERSONAL_AI_FAST_PROVIDER_FIRST:-true}

      IMAGE_AI_ASSIST_ENABLED: ${IMAGE_AI_ASSIST_ENABLED:-false}
      NEXT_PUBLIC_IMAGE_AI_ASSIST_ENABLED: ${NEXT_PUBLIC_IMAGE_AI_ASSIST_ENABLED:-false}
      AI_LEARNING_ENABLED: ${AI_LEARNING_ENABLED:-true}
      AI_LEARNING_LOG_DIR: ${AI_LEARNING_LOG_DIR:-/app/www/.runtime/ai-learning}
      AI_LEARNING_MEMORY_FILE: ${AI_LEARNING_MEMORY_FILE:-/app/www/.runtime/ai-learning/create-from-image-memory.json}
      PERSONAL_AI_STORE_DIR: ${PERSONAL_AI_STORE_DIR:-/app/www/.runtime/personal-ai}
      SUPER_APP_POSTGRES_URL: ${SUPER_APP_POSTGRES_URL:-postgres://${DB_USER}:${DB_PASS}@marketplace_db:5432/marketplace_db}

      OLLAMA_VISION_TIMEOUT_MS: ${OLLAMA_VISION_TIMEOUT_MS:-90000}
      INTERNAL_VISION_TIMEOUT_MS: ${INTERNAL_VISION_TIMEOUT_MS:-90000}
      OPENAI_VISION_TIMEOUT_MS: ${OPENAI_VISION_TIMEOUT_MS:-45000}

      MINIO_ENDPOINT: http://minio:9002
      MINIO_ACCESS_KEY: ${MINIO_USER}
      MINIO_SECRET_KEY: ${MINIO_PASS}
      MINIO_BUCKET: ${MINIO_BUCKET:-laju-chat}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-}

      DISABLE_PWA: ${DISABLE_PWA:-true}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://:${REDIS_PASS}@redis_cache:6379
      ALLOW_BEARER_AUTH: ${ALLOW_BEARER_AUTH:-true}

      LOGIN_OTP_REQUIRED: ${LOGIN_OTP_REQUIRED:-false}
      NEXT_PUBLIC_LOGIN_OTP_REQUIRED: ${NEXT_PUBLIC_LOGIN_OTP_REQUIRED:-false}
      REGISTER_OTP_REQUIRED: ${REGISTER_OTP_REQUIRED:-true}
      REGISTER_PHONE_OTP_REQUIRED: ${REGISTER_PHONE_OTP_REQUIRED:-false}

      STACK_STARTUP_STATE_FILE: /app/www/.runtime/stack-startup.json
      STACK_STARTUP_PROBE_DEPS: ${STACK_STARTUP_PROBE_DEPS:-true}

      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-smtp}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      FROM_EMAIL: ${FROM_EMAIL:-}
      FROM_NAME: ${FROM_NAME:-Lajukan}

      CAPTCHA_PROVIDER: ${CAPTCHA_PROVIDER:-turnstile}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      HCAPTCHA_SECRET_KEY: ${HCAPTCHA_SECRET_KEY:-}
      NEXT_PUBLIC_CAPTCHA_PROVIDER: ${NEXT_PUBLIC_CAPTCHA_PROVIDER:-turnstile}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      NEXT_PUBLIC_HCAPTCHA_SITE_KEY: ${NEXT_PUBLIC_HCAPTCHA_SITE_KEY:-}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}

      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./.runtime:/app/www/.runtime:ro
      - ./.runtime/ai-learning:/app/www/.runtime/ai-learning
      - ./.runtime/personal-ai:/app/www/.runtime/personal-ai
    depends_on:
      identity_service:
        condition: service_healthy
      marketplace_service:
        condition: service_healthy
      community_service:
        condition: service_healthy
      chat_service:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai_service:
        condition: service_healthy
        required: false
    ports:
      - "${PORT_FRONTEND:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s
    mem_limit: 1280m
    cpus: "2.00"
    networks: [web]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # OPTIONAL BACKOFFICE APPS
  # ---------------------------------------------------------------------------

  usaha:
    profiles: [backoffice]
    build:
      context: ./frontend
      dockerfile: usaha/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      ENV: ${ENV:-development}
      APP_ENV: ${APP_ENV:-development}
      NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-development}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_USAHA_URL:-http://localhost:3003}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      NEXT_PUBLIC_MARKETPLACE_URL: ${NEXT_PUBLIC_MARKETPLACE_URL:-http://localhost:8081}
      NEXT_PUBLIC_MARKETPLACE_WS_URL: ${NEXT_PUBLIC_MARKETPLACE_WS_URL:-}
      NEXT_PUBLIC_CHAT_WS_URL: ${NEXT_PUBLIC_CHAT_WS_URL:-}
      NEXT_PUBLIC_NOTIFICATION_WS_URL: ${NEXT_PUBLIC_NOTIFICATION_WS_URL:-}
      NEXT_PUBLIC_WWW_URL: ${NEXT_PUBLIC_WWW_URL:-http://localhost:3000}
      NEXT_PUBLIC_USAHA_URL: ${NEXT_PUBLIC_USAHA_URL:-http://localhost:3003}
      NEXT_PUBLIC_COMMUNITY_URL: ${NEXT_PUBLIC_COMMUNITY_URL:-http://localhost:8082}

      INTERNAL_API_URL: http://identity_service:8080
      INTERNAL_MARKETPLACE_URL: http://marketplace_service:8081
      MARKETPLACE_URL: http://marketplace_service:8081
      INTERNAL_COMMUNITY_URL: http://community_service:8082
      COMMUNITY_SERVICE_URL: http://community_service:8082
      INTERNAL_CHAT_URL: http://chat_service:4000
      INTERNAL_AI_URL: ${INTERNAL_AI_URL:-http://ai_service:8080}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      AI_REQUEST_TIMEOUT_MS: ${AI_GATEWAY_TIMEOUT_MS:-105000}

      MINIO_ENDPOINT: http://minio:9002
      MINIO_ACCESS_KEY: ${MINIO_USER}
      MINIO_SECRET_KEY: ${MINIO_PASS}
      MINIO_BUCKET: ${MINIO_BUCKET:-laju-chat}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-}

      DISABLE_PWA: ${DISABLE_PWA:-true}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://:${REDIS_PASS}@redis_cache:6379
      ALLOW_BEARER_AUTH: ${ALLOW_BEARER_AUTH:-true}

      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-smtp}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      FROM_EMAIL: ${FROM_EMAIL:-}
      FROM_NAME: ${FROM_NAME:-Lajukan}

      CAPTCHA_PROVIDER: ${CAPTCHA_PROVIDER:-turnstile}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      HCAPTCHA_SECRET_KEY: ${HCAPTCHA_SECRET_KEY:-}
      NEXT_PUBLIC_CAPTCHA_PROVIDER: ${NEXT_PUBLIC_CAPTCHA_PROVIDER:-turnstile}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      NEXT_PUBLIC_HCAPTCHA_SITE_KEY: ${NEXT_PUBLIC_HCAPTCHA_SITE_KEY:-}

      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      identity_service:
        condition: service_healthy
      marketplace_service:
        condition: service_healthy
      community_service:
        condition: service_healthy
      chat_service:
        condition: service_healthy
      ai_service:
        condition: service_healthy
        required: false
    ports:
      - "127.0.0.1:${PORT_USAHA:-3003}:3003"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3003/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s
    mem_limit: 1024m
    cpus: "1.50"
    networks: [web]
    logging: *default-logging

  cms:
    profiles: [backoffice]
    build:
      context: ./frontend
      dockerfile: cms/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      NEXT_PUBLIC_USAHA_URL: ${NEXT_PUBLIC_USAHA_URL:-http://localhost:3003}
      INTERNAL_API_URL: http://identity_service:8080
    depends_on:
      identity_service:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT_CMS:-3001}:3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 768m
    cpus: "1.00"
    networks: [web]
    logging: *default-logging

  crm:
    profiles: [backoffice]
    build:
      context: ./frontend
      dockerfile: crm/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      NEXT_PUBLIC_WWW_URL: ${NEXT_PUBLIC_WWW_URL:-http://localhost:3000}
      NEXT_PUBLIC_CRM_URL: ${NEXT_PUBLIC_CRM_URL:-http://localhost:3002}
      NEXT_PUBLIC_MARKETPLACE_URL: ${NEXT_PUBLIC_MARKETPLACE_URL:-http://localhost:8081}
      NEXT_PUBLIC_USAHA_URL: ${NEXT_PUBLIC_USAHA_URL:-http://localhost:3003}
      INTERNAL_API_URL: http://identity_service:8080
      INTERNAL_CHAT_URL: http://chat_service:4000
      INTERNAL_AI_URL: ${INTERNAL_AI_URL:-http://ai_service:8080}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      AI_REQUEST_TIMEOUT_MS: ${AI_GATEWAY_TIMEOUT_MS:-105000}
      USE_OLLAMA: "false"
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
