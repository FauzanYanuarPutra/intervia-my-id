name: ${COMPOSE_PROJECT_NAME:-lajukan}

x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  logging: *default-logging

x-data-defaults: &data-defaults
  restart: unless-stopped
  logging: *default-logging

services:
  # ---------------------------------------------------------------------------
  # DATA LAYER
  # ---------------------------------------------------------------------------
  identity_db:
    <<: *data-defaults
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: identity_db
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
    volumes:
      - identity_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d identity_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [data]

  community_db:
    <<: *data-defaults
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: community_db
    volumes:
      - community_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d community_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [data]

  marketplace_db:
    <<: *data-defaults
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: marketplace_db
    volumes:
      - marketplace_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d marketplace_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [data]

  redis_cache:
    <<: *data-defaults
    image: redis:7-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASS}
      - --save
      - "60"
      - "1"
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASS}' ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [data, cache]

  rabbitmq:
    <<: *data-defaults
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 45s
    networks: [data]

  meilisearch:
    <<: *data-defaults
    image: ${MEILI_IMAGE:-getmeili/meilisearch:v1.5}
    environment:
      MEILI_MASTER_KEY: ${MEILI_KEY}
      MEILI_ENV: ${ENV:-development}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [data]

  minio:
    <<: *data-defaults
    image: ${MINIO_IMAGE:-minio/minio}
    command: server /data --address ":9002" --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS}
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mc alias set local http://localhost:9002 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" >/dev/null 2>&1 && mc ready local",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [data, media]

  # Development/staging Scylla. Production overrides Chat to use SCYLLA_NODES.
  scylla_db:
    <<: *data-defaults
    image: ${SCYLLA_IMAGE:-scylladb/scylla:2025.2}
    init: true
    stop_grace_period: 60s
    environment:
      SCYLLA_CLUSTER_NAME: "${APP_NAME:-Lajukan}Cluster"
    command:
      - --smp
      - "1"
      - --memory
      - 768M
      - --reserve-memory
      - 256M
      - --overprovisioned
      - "1"
      - --developer-mode
      - "1"
    volumes:
      - scylla_data:/var/lib/scylla
    healthcheck:
      test: ["CMD", "nodetool", "status"]
      interval: 20s
      timeout: 15s
      retries: 20
      start_period: 120s
    networks: [data]

  scylla_keyspace_setup:
    image: ${SCYLLA_IMAGE:-scylladb/scylla:2025.2}
    restart: "no"
    volumes:
      - ./services/chat_service/priv/scylladb:/scylladb:ro
    depends_on:
      scylla_db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        sed 's/\r//g' /scylladb/setup_keyspace_init.sh > /tmp/setup_keyspace_init.sh
        sh /tmp/setup_keyspace_init.sh
    networks: [data]
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # CORE BACKEND SERVICES
  # ---------------------------------------------------------------------------
  identity_service:
    <<: *service-defaults
    build:
      context: ./services/identity_service
      dockerfile: Dockerfile
    environment:
      ENV: ${ENV:-development}
      APP_NAME: ${APP_NAME:-Lajukan}
      APP_PORT: "8080"
      APP_VERSION: ${APP_VERSION:-0.1.0}
      RUST_LOG: ${RUST_LOG:-info}
      IDENTITY_DATABASE_URL: postgres://${DB_USER}:${DB_PASS}@identity_db:5432/identity_db
      POSTGRES_HOST: identity_db
      POSTGRES_USER: ${DB_USER}
      REDIS_URL: redis://:${REDIS_PASS}@redis_cache:6379
      REDIS_HOST: redis_cache
      REDIS_PASSWORD: ${REDIS_PASS}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBIT_USER}
      RABBITMQ_PASSWORD: ${RABBIT_PASS}
      RABBITMQ_URL: amqp://${RABBIT_USER}:${RABBIT_PASS}@rabbitmq:5672/%2f
      IDENTITY_OUTBOX_EXCHANGE: ${IDENTITY_OUTBOX_EXCHANGE:-identity.outbox}
      IDENTITY_OUTBOX_BATCH_SIZE: ${IDENTITY_OUTBOX_BATCH_SIZE:-50}
      IDENTITY_OUTBOX_POLL_MS: ${IDENTITY_OUTBOX_POLL_MS:-750}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-laju}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-laju_users}
      ACCESS_TOKEN_EXP_HOURS: ${ACCESS_TOKEN_EXP_HOURS:-1}
      REFRESH_TOKEN_EXP_DAYS: ${REFRESH_TOKEN_EXP_DAYS:-30}
      MAX_LOGIN_ATTEMPTS: ${MAX_LOGIN_ATTEMPTS:-5}
      LOCKOUT_DURATION_MIN: ${LOCKOUT_DURATION_MIN:-15}
      FAILED_LOGIN_DELAY_MS: ${FAILED_LOGIN_DELAY_MS:-1000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      identity_db: { condition: service_healthy }
      redis_cache: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 30s
    networks: [app, data]

  marketplace_service:
    <<: *service-defaults
    build:
      context: ./services/marketplace_service
      dockerfile: Dockerfile
    environment:
      ENV: ${ENV:-development}
      APP_PORT: "8081"
      RUST_LOG: ${RUST_LOG:-info}
      MARKETPLACE_DATABASE_URL: postgres://${DB_USER}:${DB_PASS}@marketplace_db:5432/marketplace_db
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_KEY}
      REDIS_URL: redis://:${REDIS_PASS}@redis_cache:6379
      REDIS_HOST: redis_cache
      REDIS_PASSWORD: ${REDIS_PASS}
      RABBITMQ_URL: amqp://${RABBIT_USER}:${RABBIT_PASS}@rabbitmq:5672/%2f
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBIT_USER}
      RABBITMQ_PASSWORD: ${RABBIT_PASS}
      JWT_SECRET: ${JWT_SECRET}
      IDENTITY_SERVICE_URL: http://identity_service:8080
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      OUTBOX_EXCHANGE: ${OUTBOX_EXCHANGE:-marketplace.outbox}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-50}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-1500}
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
      ORDER_ENGINE_API_ENABLED: ${ORDER_ENGINE_API_ENABLED:-false}
      WALLET_DEFAULT_ENV: ${WALLET_DEFAULT_ENV:-development}
      WALLET_LIVE_ENABLED: ${WALLET_LIVE_ENABLED:-false}
      WALLET_DEFAULT_PROVIDER: ${WALLET_DEFAULT_PROVIDER:-midtrans}
      WALLET_DEV_AUTO_SETTLE: ${WALLET_DEV_AUTO_SETTLE:-true}
      WALLET_ALLOW_LIVE_IN_NON_PROD: ${WALLET_ALLOW_LIVE_IN_NON_PROD:-false}
      WALLET_ALLOW_MOCK_IN_LIVE: ${WALLET_ALLOW_MOCK_IN_LIVE:-false}
      WALLET_MIDTRANS_FALLBACK_TO_MOCK: ${WALLET_MIDTRANS_FALLBACK_TO_MOCK:-true}
      MIDTRANS_MERCHANT_ID: ${MIDTRANS_MERCHANT_ID:-}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_SERVER_KEY_SANDBOX: ${MIDTRANS_SERVER_KEY_SANDBOX:-}
      MIDTRANS_SERVER_KEY_LIVE: ${MIDTRANS_SERVER_KEY_LIVE:-}
      MIDTRANS_PAYMENT_NOTIFICATION_URL: ${MIDTRANS_PAYMENT_NOTIFICATION_URL:-}
      WALLET_MIDTRANS_NOTIFICATION_URL: ${WALLET_MIDTRANS_NOTIFICATION_URL:-}
      MIDTRANS_FINISH_REDIRECT_URL: ${MIDTRANS_FINISH_REDIRECT_URL:-}
      MIDTRANS_UNFINISH_REDIRECT_URL: ${MIDTRANS_UNFINISH_REDIRECT_URL:-}
      MIDTRANS_ERROR_REDIRECT_URL: ${MIDTRANS_ERROR_REDIRECT_URL:-}
      WALLET_MIDTRANS_FINISH_REDIRECT_URL: ${WALLET_MIDTRANS_FINISH_REDIRECT_URL:-}
      WALLET_MIDTRANS_UNFINISH_REDIRECT_URL: ${WALLET_MIDTRANS_UNFINISH_REDIRECT_URL:-}
      WALLET_MIDTRANS_ERROR_REDIRECT_URL: ${WALLET_MIDTRANS_ERROR_REDIRECT_URL:-}
    depends_on:
      marketplace_db: { condition: service_healthy }
      redis_cache: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      meilisearch: { condition: service_healthy }
      identity_service: { condition: service_healthy }
    expose: ["8081"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 180s
    networks: [app, data]

  community_service:
    <<: *service-defaults
    build:
      context: ./services/community_service
      dockerfile: Dockerfile
    environment:
      ENV: ${ENV:-development}
      APP_NAME: ${APP_NAME:-Lajukan}
      APP_PORT: "8082"
      RUST_LOG: ${RUST_LOG:-info}
      COMMUNITY_DATABASE_URL: postgres://${DB_USER}:${DB_PASS}@community_db:5432/community_db
      REDIS_URL: redis://:${REDIS_PASS}@redis_cache:6379
      REDIS_HOST: redis_cache
      REDIS_PASSWORD: ${REDIS_PASS}
      RABBITMQ_URL: amqp://${RABBIT_USER}:${RABBIT_PASS}@rabbitmq:5672/%2f
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBIT_USER}
      RABBITMQ_PASSWORD: ${RABBIT_PASS}
      IDENTITY_OUTBOX_EXCHANGE: ${IDENTITY_OUTBOX_EXCHANGE:-identity.outbox}
      COMMUNITY_IDENTITY_QUEUE: ${COMMUNITY_IDENTITY_QUEUE:-community.identity.profile}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      COMMUNITY_UPLOAD_DIR: /app/uploads/forum
      COMMUNITY_MEDIA_PUBLIC_PATH: /api/forum/media
      INTERNAL_API_URL: http://identity_service:8080
    volumes:
      - community_uploads:/app/uploads/forum
    depends_on:
      community_db: { condition: service_healthy }
      redis_cache: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      identity_service: { condition: service_healthy }
    expose: ["8082"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks: [app, data]

  chat_service:
    <<: *service-defaults
    build:
      context: ./services/chat_service
      dockerfile: Dockerfile
    environment:
      ENV: ${ENV:-development}
      PHX_SERVER: "true"
      PHX_HOST: ${PHX_HOST:-localhost}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      SCYLLA_HOST: scylla_db
      SCYLLA_PORT: "9042"
      SCYLLA_KEYSPACE: ${SCYLLA_KEYSPACE:-laju_chat}
      REDIS_HOST: redis_cache
      REDIS_PASSWORD: ${REDIS_PASS}
      RABBITMQ_URL: amqp://${RABBIT_USER}:${RABBIT_PASS}@rabbitmq:5672/%2f
      JWT_SECRET: ${JWT_SECRET}
      USE_OLLAMA: ${USE_OLLAMA:-false}
      SUPPORT_AI_USE_OLLAMA: ${SUPPORT_AI_USE_OLLAMA:-false}
      CHAT_OLLAMA_URL: ${CHAT_OLLAMA_URL:-http://ollama:11434}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_SUPPORT_MODEL: ${OLLAMA_SUPPORT_MODEL:-}
      OLLAMA_BUSINESS_MODEL: ${OLLAMA_BUSINESS_MODEL:-llama3.2:3b}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      OLLAMA_SUPPORT_TIMEOUT_MS: ${OLLAMA_SUPPORT_TIMEOUT_MS:-8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-}
      CHAT_MEDIA_ALLOWED_ORIGINS: ${CHAT_MEDIA_ALLOWED_ORIGINS:-}
    depends_on:
      scylla_keyspace_setup: { condition: service_completed_successfully }
      redis_cache: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    expose: ["4000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/api/health"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 90s
    networks: [app, data]

  # ---------------------------------------------------------------------------
  # AI ORCHESTRATION / OPTIONAL MODEL AND KYC RUNTIMES
  # ---------------------------------------------------------------------------
  ai_service:
    <<: *service-defaults
    build:
      context: ./services/ai_service
      dockerfile: Dockerfile
    environment:
      ENV: ${ENV:-development}
      APP_ENV: ${APP_ENV:-development}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN}
      RAG_SERVICE_TOKEN: ${RAG_SERVICE_TOKEN:-}
      VLLM_URL: ${VLLM_URL:-http://ollama:11434/v1}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      VLLM_MODEL: ${VLLM_MODEL:-}
      AI_MODEL: ${AI_MODEL:-}
      VLLM_STRUCTURED_MODEL: ${VLLM_STRUCTURED_MODEL:-}
      VLLM_VISION_MODEL: ${VLLM_VISION_MODEL:-}
      VLLM_KYC_MODEL: ${VLLM_KYC_MODEL:-}
      OCR_URL: ${OCR_URL:-http://ocr_service:8000/predict}
      LIVENESS_URL: ${LIVENESS_URL:-http://liveness_service:8000/check}
      FACE_MATCH_URL: ${FACE_MATCH_URL:-}
      RAG_URL: ${RAG_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [app]

  ocr_service:
    <<: *service-defaults
    profiles: [kyc]
    build:
      context: ./services/ocr_service
      dockerfile: Dockerfile
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/ready"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks: [app]

  liveness_service:
    <<: *service-defaults
    profiles: [kyc]
    build:
      context: ./services/liveness_service
      dockerfile: Dockerfile
    environment:
      LIVENESS_FACE_DETECTOR_MODEL: /models/face_detection_yunet_2026may.onnx
      LIVENESS_MODEL_DIR: /models/anti_spoof_models
    volumes:
      - type: bind
        source: ${LIVENESS_MODELS_PATH:-./.runtime/models/liveness}
        target: /models
        read_only: true
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/ready"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [app]

  ollama:
    <<: *service-defaults
    profiles: [local-ai]
    image: ${OLLAMA_IMAGE:-ollama/ollama@sha256:4dea9fb511947e24a84237bb636b0203abcb2ff0d3fbc7b4ff865deb91362131}
    volumes:
      - ollama_data:/root/.ollama
    expose: ["11434"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks: [app]

  # ---------------------------------------------------------------------------
  # FRONTENDS
  # ---------------------------------------------------------------------------
  www:
    <<: *service-defaults
    build:
      context: ./frontend
      dockerfile: apps/www/Dockerfile
      args:
        NEXT_PUBLIC_APP_ENV: ${ENV:-development}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_WWW_URL: ${NEXT_PUBLIC_WWW_URL:-http://localhost:3000}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_MARKETPLACE_URL: ${NEXT_PUBLIC_MARKETPLACE_URL:-http://localhost:8081}
        NEXT_PUBLIC_COMMUNITY_URL: ${NEXT_PUBLIC_COMMUNITY_URL:-http://localhost:8082}
        NEXT_PUBLIC_CHAT_WS_URL: ${NEXT_PUBLIC_CHAT_WS_URL:-ws://localhost:4000/socket}
        NEXT_PUBLIC_MARKETPLACE_WS_URL: ${NEXT_PUBLIC_MARKETPLACE_WS_URL:-}
        NEXT_PUBLIC_NOTIFICATION_WS_URL: ${NEXT_PUBLIC_NOTIFICATION_WS_URL:-}
        NEXT_PUBLIC_LOGIN_OTP_REQUIRED: ${NEXT_PUBLIC_LOGIN_OTP_REQUIRED:-true}
        NEXT_PUBLIC_IMAGE_AI_ASSIST_ENABLED: ${NEXT_PUBLIC_IMAGE_AI_ASSIST_ENABLED:-false}
        NEXT_PUBLIC_DISABLE_PWA: ${NEXT_PUBLIC_DISABLE_PWA:-true}
        NEXT_PUBLIC_CAPTCHA_PROVIDER: ${NEXT_PUBLIC_CAPTCHA_PROVIDER:-turnstile}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_HCAPTCHA_SITE_KEY: ${NEXT_PUBLIC_HCAPTCHA_SITE_KEY:-}
        NEXT_PUBLIC_STUN_URLS: ${NEXT_PUBLIC_STUN_URLS:-stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302}
        NEXT_PUBLIC_TURN_URLS: ${NEXT_PUBLIC_TURN_URLS:-}
    environment:
      ENV: ${ENV:-development}
      APP_ENV: ${APP_ENV:-development}
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_APP_ENV: ${ENV:-development}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_WWW_URL: ${NEXT_PUBLIC_WWW_URL:-http://localhost:3000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      NEXT_PUBLIC_MARKETPLACE_URL: ${NEXT_PUBLIC_MARKETPLACE_URL:-http://localhost:8081}
      NEXT_PUBLIC_COMMUNITY_URL: ${NEXT_PUBLIC_COMMUNITY_URL:-http://localhost:8082}
      NEXT_PUBLIC_CHAT_WS_URL: ${NEXT_PUBLIC_CHAT_WS_URL:-ws://localhost:4000/socket}
      NEXT_PUBLIC_MARKETPLACE_WS_URL: ${NEXT_PUBLIC_MARKETPLACE_WS_URL:-}
      NEXT_PUBLIC_NOTIFICATION_WS_URL: ${NEXT_PUBLIC_NOTIFICATION_WS_URL:-}
      NEXT_PUBLIC_IMAGE_AI_ASSIST_ENABLED: ${NEXT_PUBLIC_IMAGE_AI_ASSIST_ENABLED:-false}
      NEXT_PUBLIC_DISABLE_PWA: ${NEXT_PUBLIC_DISABLE_PWA:-true}
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
      WALLET_LIVE_ENABLED: ${WALLET_LIVE_ENABLED:-false}
      INTERNAL_IDENTITY_URL: http://identity_service:8080
      INTERNAL_API_URL: http://identity_service:8080
      INTERNAL_MARKETPLACE_URL: http://marketplace_service:8081
      MARKETPLACE_URL: http://marketplace_service:8081
      INTERNAL_COMMUNITY_URL: http://community_service:8082
      COMMUNITY_SERVICE_URL: http://community_service:8082
      INTERNAL_CHAT_URL: http://chat_service:4000
      INTERNAL_AI_URL: http://ai_service:8080
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN}
      AI_LEARNING_ENABLED: ${AI_LEARNING_ENABLED:-false}
      AI_LEARNING_LOG_DIR: ${AI_LEARNING_LOG_DIR:-/app/apps/www/.runtime/ai-learning}
      AI_LEARNING_MEMORY_FILE: ${AI_LEARNING_MEMORY_FILE:-/app/apps/www/.runtime/ai-learning/create-from-image-memory.json}
      PERSONAL_AI_STORE_DIR: ${PERSONAL_AI_STORE_DIR:-/app/apps/www/.runtime/personal-ai}
      IMAGE_AI_ASSIST_ENABLED: ${IMAGE_AI_ASSIST_ENABLED:-false}
      MINIO_ENDPOINT: http://minio:9002
      MINIO_ACCESS_KEY: ${MINIO_USER}
      MINIO_SECRET_KEY: ${MINIO_PASS}
      MINIO_BUCKET: ${MINIO_BUCKET:-laju-chat}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9002}
      REDIS_URL: redis://:${REDIS_PASS}@redis_cache:6379
      REDIS_CONNECTION_NAME: ${REDIS_CONNECTION_NAME:-lajukan-www}
      JWT_SECRET: ${JWT_SECRET}
      ALLOW_BEARER_AUTH: ${ALLOW_BEARER_AUTH:-true}
      ENABLE_OTP_AUTH: ${ENABLE_OTP_AUTH:-true}
      ENABLE_PHONE_AUTH: ${ENABLE_PHONE_AUTH:-false}
      LOGIN_OTP_REQUIRED: ${LOGIN_OTP_REQUIRED:-true}
      LOGIN_PHONE_OTP_REQUIRED: ${LOGIN_PHONE_OTP_REQUIRED:-true}
      REGISTER_OTP_REQUIRED: ${REGISTER_OTP_REQUIRED:-true}
      REGISTER_PHONE_OTP_REQUIRED: ${REGISTER_PHONE_OTP_REQUIRED:-false}
      AUTH_PASSWORD_MIN_LENGTH: ${AUTH_PASSWORD_MIN_LENGTH:-15}
      REGISTER_RATE_LIMIT_PER_HOUR: ${REGISTER_RATE_LIMIT_PER_HOUR:-12}
      REGISTER_USERNAME_RATE_LIMIT_PER_HOUR: ${REGISTER_USERNAME_RATE_LIMIT_PER_HOUR:-3}
      LOGIN_RATE_LIMIT_PER_15_MIN: ${LOGIN_RATE_LIMIT_PER_15_MIN:-15}
      LOGIN_USERNAME_RATE_LIMIT_PER_15_MIN: ${LOGIN_USERNAME_RATE_LIMIT_PER_15_MIN:-5}
      OTP_LIMIT_PER_TARGET_PER_HOUR: ${OTP_LIMIT_PER_TARGET_PER_HOUR:-5}
      OTP_LIMIT_PER_IP_PER_HOUR: ${OTP_LIMIT_PER_IP_PER_HOUR:-30}
      CAPTCHA_PROVIDER: ${CAPTCHA_PROVIDER:-turnstile}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      HCAPTCHA_SECRET_KEY: ${HCAPTCHA_SECRET_KEY:-}
      NEXT_PUBLIC_LOGIN_OTP_REQUIRED: ${NEXT_PUBLIC_LOGIN_OTP_REQUIRED:-true}
      NEXT_PUBLIC_STUN_URLS: ${NEXT_PUBLIC_STUN_URLS:-stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302}
      NEXT_PUBLIC_TURN_URLS: ${NEXT_PUBLIC_TURN_URLS:-}
      TURN_URL: ${TURN_URL:-}
      TURN_URLS: ${TURN_URLS:-}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:-}
      TURN_CREDENTIAL_TTL_SECONDS: ${TURN_CREDENTIAL_TTL_SECONDS:-3600}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      CREATOR_INITIAL_COINS: ${CREATOR_INITIAL_COINS:-1000}
      CREATOR_DAILY_COINS: ${CREATOR_DAILY_COINS:-50}
      CREATOR_ACTION_COST_COINS: ${CREATOR_ACTION_COST_COINS:-10}
      CREATOR_DAILY_ACTION_LIMIT: ${CREATOR_DAILY_ACTION_LIMIT:-10}
      WHATSAPP_META_ACCESS_TOKEN: ${WHATSAPP_META_ACCESS_TOKEN:-}
      WHATSAPP_META_PHONE_NUMBER_ID: ${WHATSAPP_META_PHONE_NUMBER_ID:-}
      WHATSAPP_META_API_VERSION: ${WHATSAPP_META_API_VERSION:-v22.0}
      WHATSAPP_META_DEFAULT_COUNTRY_CODE: ${WHATSAPP_META_DEFAULT_COUNTRY_CODE:-62}
      WHATSAPP_META_OTP_MODE: ${WHATSAPP_META_OTP_MODE:-text}
      WHATSAPP_META_OTP_TEMPLATE_NAME: ${WHATSAPP_META_OTP_TEMPLATE_NAME:-lajukan_auth_otp}
      WHATSAPP_META_OTP_TEMPLATE_LANGUAGE: ${WHATSAPP_META_OTP_TEMPLATE_LANGUAGE:-id}
      WHATSAPP_META_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_META_WEBHOOK_VERIFY_TOKEN:-}
      WHATSAPP_META_APP_SECRET: ${WHATSAPP_META_APP_SECRET:-}
      WHATSAPP_META_WEBHOOK_REQUIRE_SIGNATURE: ${WHATSAPP_META_WEBHOOK_REQUIRE_SIGNATURE:-true}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-smtp}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      FROM_EMAIL: ${FROM_EMAIL:-}
      FROM_NAME: ${FROM_NAME:-Lajukan}
    volumes:
      - www_runtime:/app/apps/www/.runtime
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 45s
    depends_on:
      identity_service: { condition: service_healthy }
      marketplace_service: { condition: service_healthy }
      community_service: { condition: service_healthy }
      chat_service: { condition: service_healthy }
      ai_service: { condition: service_healthy }
      redis_cache: { condition: service_healthy }
      minio: { condition: service_healthy }
    networks: [app, cache, media]

  cms:
    <<: *service-defaults
    build:
      context: ./frontend
      dockerfile: apps/cms/Dockerfile
    environment:
      ENV: ${ENV:-development}
      APP_ENV: ${APP_ENV:-development}
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_APP_ENV: ${ENV:-development}
      NEXT_PUBLIC_WWW_URL: ${NEXT_PUBLIC_WWW_URL:-http://localhost:3000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8081}
    expose: ["3001"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 45s
    depends_on:
      identity_service: { condition: service_healthy }
    networks: [app]

  crm:
    <<: *service-defaults
    build:
      context: ./frontend
      dockerfile: apps/crm/Dockerfile
    environment:
      ENV: ${ENV:-development}
      APP_ENV: ${APP_ENV:-development}
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_APP_ENV: ${ENV:-development}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8081}
      NEXT_PUBLIC_IDENTITY_API_URL: /api/identity
      NEXT_PUBLIC_WWW_URL: ${NEXT_PUBLIC_WWW_URL:-http://localhost:3000}
      NEXT_PUBLIC_CRM_URL: ${NEXT_PUBLIC_CRM_URL:-http://localhost:3002}
      NEXT_PUBLIC_MARKETPLACE_URL: ${NEXT_PUBLIC_MARKETPLACE_URL:-http://localhost:8081}
      NEXT_PUBLIC_USAHA_URL: ${NEXT_PUBLIC_USAHA_URL:-http://localhost:3003}
    expose: ["3002"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 45s
    depends_on:
      identity_service: { condition: service_healthy }
    networks: [app]

  usaha:
    <<: *service-defaults
    build:
      context: ./frontend
      dockerfile: apps/usaha/Dockerfile
    environment:
      ENV: ${ENV:-development}
      APP_ENV: ${APP_ENV:-development}
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_APP_ENV: ${ENV:-development}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_USAHA_URL:-http://localhost:3003}
      NEXT_PUBLIC_WWW_URL: ${NEXT_PUBLIC_WWW_URL:-http://localhost:3000}
      NEXT_PUBLIC_USAHA_URL: ${NEXT_PUBLIC_USAHA_URL:-http://localhost:3003}
      INTERNAL_MARKETPLACE_URL: http://marketplace_service:8081
      INTERNAL_COMMUNITY_URL: http://community_service:8082
      COMMUNITY_SERVICE_URL: http://community_service:8082
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-smtp}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    expose: ["3003"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3003/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 45s
    depends_on:
      identity_service: { condition: service_healthy }
      marketplace_service: { condition: service_healthy }
      community_service: { condition: service_healthy }
    networks: [app]

  # ---------------------------------------------------------------------------
  # EDGE
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-ops@example.com}
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - www
      - usaha
      - cms
      - crm
    networks: [edge, app]
    logging: *default-logging

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.7.3}
    profiles: [tunnel]
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - --loglevel
      - info
      - --metrics
      - 0.0.0.0:2000
      - run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    expose: ["2000"]
    depends_on:
      caddy: { condition: service_started }
    networks: [edge]
    logging: *default-logging

  mailhog:
    profiles: [devtools]
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    expose: ["1025", "8025"]
    networks: [app]
    logging: *default-logging

networks:
  edge:
    driver: bridge
  app:
    driver: bridge
  cache:
    driver: bridge
    internal: true
  media:
    driver: bridge
    internal: true
  data:
    driver: bridge
    internal: true

volumes:
  identity_postgres_data:
  community_postgres_data:
  marketplace_postgres_data:
  redis_data:
  rabbitmq_data:
  meili_data:
  minio_data:
  scylla_data:
  community_uploads:
  ollama_data:
  caddy_data:
  caddy_config:
  www_runtime:
