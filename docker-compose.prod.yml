services:
  identity_service:
    build: !reset null
    image: ${DOCKERHUB_NAMESPACE:?DOCKERHUB_NAMESPACE is required}/lajukan-identity:${IMAGE_TAG:?IMAGE_TAG is required}
    pull_policy: always
    environment:
      ENV: production
      APP_ENV: production
      RUST_LOG: ${RUST_LOG:-warn}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}

  marketplace_service:
    build: !reset null
    image: ${DOCKERHUB_NAMESPACE:?DOCKERHUB_NAMESPACE is required}/lajukan-marketplace:${IMAGE_TAG:?IMAGE_TAG is required}
    pull_policy: always
    environment:
      ENV: production
      APP_ENV: production
      RUST_LOG: ${RUST_LOG:-warn}
      FRONTEND_URL: ${FRONTEND_URL:-https://www.lajukan.com}
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
      ORDER_ENGINE_API_ENABLED: ${ORDER_ENGINE_API_ENABLED:-false}
      WALLET_DEFAULT_ENV: ${WALLET_DEFAULT_ENV:-production}
      WALLET_LIVE_ENABLED: ${WALLET_LIVE_ENABLED:-false}
      WALLET_DEFAULT_PROVIDER: ${WALLET_DEFAULT_PROVIDER:-midtrans}
      WALLET_DEV_AUTO_SETTLE: "false"
      WALLET_ALLOW_LIVE_IN_NON_PROD: "false"
      WALLET_ALLOW_MOCK_IN_LIVE: "false"
      WALLET_MIDTRANS_FALLBACK_TO_MOCK: "false"
      MIDTRANS_MERCHANT_ID: ${MIDTRANS_MERCHANT_ID:-}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_SERVER_KEY_SANDBOX: ${MIDTRANS_SERVER_KEY_SANDBOX:-}
      MIDTRANS_SERVER_KEY_LIVE: ${MIDTRANS_SERVER_KEY_LIVE:-}
      MIDTRANS_PAYMENT_NOTIFICATION_URL: ${MIDTRANS_PAYMENT_NOTIFICATION_URL:-https://www.lajukan.com/api/wallet/providers/midtrans/notify}
      WALLET_MIDTRANS_NOTIFICATION_URL: ${WALLET_MIDTRANS_NOTIFICATION_URL:-https://www.lajukan.com/api/wallet/providers/midtrans/notify}
      MIDTRANS_FINISH_REDIRECT_URL: ${MIDTRANS_FINISH_REDIRECT_URL:-https://www.lajukan.com/id/payments}
      MIDTRANS_UNFINISH_REDIRECT_URL: ${MIDTRANS_UNFINISH_REDIRECT_URL:-https://www.lajukan.com/id/payments}
      MIDTRANS_ERROR_REDIRECT_URL: ${MIDTRANS_ERROR_REDIRECT_URL:-https://www.lajukan.com/id/payments}
      WALLET_MIDTRANS_FINISH_REDIRECT_URL: ${WALLET_MIDTRANS_FINISH_REDIRECT_URL:-https://www.lajukan.com/id/payments}
      WALLET_MIDTRANS_UNFINISH_REDIRECT_URL: ${WALLET_MIDTRANS_UNFINISH_REDIRECT_URL:-https://www.lajukan.com/id/payments}
      WALLET_MIDTRANS_ERROR_REDIRECT_URL: ${WALLET_MIDTRANS_ERROR_REDIRECT_URL:-https://www.lajukan.com/id/payments}

  community_service:
    build: !reset null
    image: ${DOCKERHUB_NAMESPACE:?DOCKERHUB_NAMESPACE is required}/lajukan-community:${IMAGE_TAG:?IMAGE_TAG is required}
    pull_policy: always
    environment:
      ENV: production
      APP_ENV: production
      RUST_LOG: ${RUST_LOG:-warn}
      COMMUNITY_UPLOAD_DIR: /app/uploads/forum
      COMMUNITY_MEDIA_PUBLIC_PATH: /api/forum/media
      INTERNAL_API_URL: http://identity_service:8080

  ai_service:
    build: !reset null
    image: ${DOCKERHUB_NAMESPACE:?DOCKERHUB_NAMESPACE is required}/lajukan-ai:${IMAGE_TAG:?IMAGE_TAG is required}
    pull_policy: always
    environment:
      ENV: production
      APP_ENV: production
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?AI_SERVICE_TOKEN is required in production}
      VLLM_URL: ${VLLM_URL:?VLLM_URL is required in production}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/ready"]
      start_period: 30s

  ocr_service:
    build: !reset null
    image: ${DOCKERHUB_NAMESPACE:?DOCKERHUB_NAMESPACE is required}/lajukan-ocr:${IMAGE_TAG:?IMAGE_TAG is required}
    pull_policy: always

  liveness_service:
    build: !reset null
    image: ${DOCKERHUB_NAMESPACE:?DOCKERHUB_NAMESPACE is required}/lajukan-liveness:${IMAGE_TAG:?IMAGE_TAG is required}
    pull_policy: always

  chat_service:
    build: !reset null
    image: ${DOCKERHUB_NAMESPACE:?DOCKERHUB_NAMESPACE is required}/lajukan-chat:${IMAGE_TAG:?IMAGE_TAG is required}
    pull_policy: always
    environment:
      ENV: production
      APP_ENV: production
      PHX_HOST: ${PHX_HOST:-lajukan.com}
      SCYLLA_NODES: ${SCYLLA_NODES:?SCYLLA_NODES must point to the production Scylla cluster}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/api/ready"]
    depends_on: !override
      redis_cache: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      scylla_migrate: { condition: service_completed_successfully }

  scylla_db:
    profiles: [development-database]
  scylla_keyspace_setup:
    profiles: [development-database]
  scylla_migrate:
    image: ${SCYLLA_IMAGE:-scylladb/scylla:2025.2}
    restart: "no"
    environment:
      SCYLLA_NODES: ${SCYLLA_NODES:?SCYLLA_NODES must point to the production Scylla cluster}
      SCYLLA_PORT: ${SCYLLA_PORT:-9042}
      SCYLLA_USERNAME: ${SCYLLA_USERNAME:-}
      SCYLLA_PASSWORD: ${SCYLLA_PASSWORD:-}
      SCYLLA_SSL: ${SCYLLA_SSL:-0}
    volumes:
      - ./services/chat_service/priv/scylladb:/scylladb:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        sed 's/\r$//' /scylladb/run_migrations.sh > /tmp/run_chat_migrations.sh
        exec /bin/sh /tmp/run_chat_migrations.sh
    networks: [app, data]

  www:
    build: !reset null
    image: ${DOCKERHUB_NAMESPACE:?DOCKERHUB_NAMESPACE is required}/lajukan-www:${IMAGE_TAG:?IMAGE_TAG is required}
    pull_policy: always
    environment:
      ENV: production
      APP_ENV: production
      NODE_ENV: production
      NEXT_PUBLIC_APP_ENV: production
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://www.lajukan.com}
      NEXT_PUBLIC_WWW_URL: ${NEXT_PUBLIC_WWW_URL:-https://www.lajukan.com}
      WWW_GOOGLE_REDIRECT_URI: ${WWW_GOOGLE_REDIRECT_URI:-https://www.lajukan.com/api/auth/google/callback}
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
      WALLET_LIVE_ENABLED: ${WALLET_LIVE_ENABLED:-false}
      INTERNAL_AI_URL: http://ai_service:8080
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?AI_SERVICE_TOKEN is required in production}
      EMAIL_TRANSPORT: smtp
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required in production}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?SMTP_USER is required in production}
      SMTP_PASS: ${SMTP_PASS:?SMTP_PASS is required in production}

  cms:
    build: !reset null
    image: ${DOCKERHUB_NAMESPACE:?DOCKERHUB_NAMESPACE is required}/lajukan-cms:${IMAGE_TAG:?IMAGE_TAG is required}
    pull_policy: always
    environment: { ENV: production, APP_ENV: production, NODE_ENV: production, NEXT_PUBLIC_APP_ENV: production }

  crm:
    build: !reset null
    image: ${DOCKERHUB_NAMESPACE:?DOCKERHUB_NAMESPACE is required}/lajukan-crm:${IMAGE_TAG:?IMAGE_TAG is required}
    pull_policy: always
    environment:
      ENV: production
      APP_ENV: production
      NODE_ENV: production
      NEXT_PUBLIC_APP_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.lajukan.com}
      NEXT_PUBLIC_WWW_URL: ${NEXT_PUBLIC_WWW_URL:-https://www.lajukan.com}
      NEXT_PUBLIC_CRM_URL: ${NEXT_PUBLIC_CRM_URL:-https://crm.lajukan.com}
      NEXT_PUBLIC_MARKETPLACE_URL: ${NEXT_PUBLIC_MARKETPLACE_URL:-https://api.lajukan.com}
      NEXT_PUBLIC_USAHA_URL: ${NEXT_PUBLIC_USAHA_URL:-https://usaha.lajukan.com}

  usaha:
    build: !reset null
    image: ${DOCKERHUB_NAMESPACE:?DOCKERHUB_NAMESPACE is required}/lajukan-usaha:${IMAGE_TAG:?IMAGE_TAG is required}
    pull_policy: always
    environment:
      ENV: production
      APP_ENV: production
      NODE_ENV: production
      NEXT_PUBLIC_APP_ENV: production
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_USAHA_URL:-https://usaha.lajukan.com}
      NEXT_PUBLIC_WWW_URL: ${NEXT_PUBLIC_WWW_URL:-https://www.lajukan.com}
      NEXT_PUBLIC_USAHA_URL: ${NEXT_PUBLIC_USAHA_URL:-https://usaha.lajukan.com}
      INTERNAL_API_URL: http://identity_service:8080
      INTERNAL_IDENTITY_URL: http://identity_service:8080
      INTERNAL_MARKETPLACE_URL: http://marketplace_service:8081
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      USAHA_GOOGLE_REDIRECT_URI: ${USAHA_GOOGLE_REDIRECT_URI:-https://usaha.lajukan.com/api/auth/google/callback}
      EMAIL_TRANSPORT: smtp
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required in production}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?SMTP_USER is required in production}
      SMTP_PASS: ${SMTP_PASS:?SMTP_PASS is required in production}

  caddy:
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-lajukan.com}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-ops@lajukan.com}
    volumes:
      - ./infrastructure/caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: !override [edge, app, media]

volumes:
  minio_data:
    # Never silently create/switch production media storage. deploy.yml resolves this
    # to the existing /data named volume before Docker Compose is evaluated.
    name: ${MINIO_DATA_VOLUME:?MINIO_DATA_VOLUME must resolve to the existing production MinIO volume}
