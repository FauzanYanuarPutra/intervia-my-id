services:
  identity_service:
    image: ${DOCKERHUB_NAMESPACE}/lajukan-identity:${IMAGE_TAG:-latest}
    environment:
      ENV: production
      APP_ENV: production
      RUST_LOG: ${RUST_LOG:-warn}

  marketplace_service:
    image: ${DOCKERHUB_NAMESPACE}/lajukan-marketplace:${IMAGE_TAG:-latest}
    environment:
      ENV: production
      APP_ENV: production

  ai_service:
    image: ${DOCKERHUB_NAMESPACE}/lajukan-ai:${IMAGE_TAG:-latest}
    environment:
      ENV: production
      APP_ENV: production

  chat_service:
    image: ${DOCKERHUB_NAMESPACE}/lajukan-chat:${IMAGE_TAG:-latest}
    environment:
      ENV: production
      APP_ENV: production

  ocr_service:
    image: ${DOCKERHUB_NAMESPACE}/lajukan-ocr:${IMAGE_TAG:-latest}

  liveness_service:
    image: ${DOCKERHUB_NAMESPACE}/lajukan-liveness:${IMAGE_TAG:-latest}

  www:
    image: ${DOCKERHUB_NAMESPACE}/lajukan-www:${IMAGE_TAG:-latest}
    environment:
      ENV: production
      APP_ENV: production
      NODE_ENV: production
      NEXT_PUBLIC_APP_ENV: production

  usaha:
    image: ${DOCKERHUB_NAMESPACE}/lajukan-usaha:${IMAGE_TAG:-latest}
    environment:
      ENV: production
      APP_ENV: production
      NODE_ENV: production
      NEXT_PUBLIC_APP_ENV: production

  cms:
    image: ${DOCKERHUB_NAMESPACE}/lajukan-cms:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production

  crm:
    image: ${DOCKERHUB_NAMESPACE}/lajukan-crm:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
