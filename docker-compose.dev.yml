services:
  # Ensure every target-domain database exists even when domain_db uses an
  # already-initialized Docker volume. The postgres init directory only runs on
  # first volume creation, so this idempotent bootstrap is required for upgrades.
  domain_db_bootstrap:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    depends_on:
      domain_db: { condition: service_healthy }
    command:
      - /bin/sh
      - -ec
      - |
        export PGPASSWORD="$$POSTGRES_PASSWORD"
        for db in profile_db media_db news_db order_db payment_db promotion_db crm_db communication_db trust_db audit_db support_db review_db; do
          if ! psql -h domain_db -U "$POSTGRES_USER" -d postgres -Atqc "SELECT 1 FROM pg_database WHERE datname='$db'" | grep -q 1; then
            psql -h domain_db -U "$POSTGRES_USER" -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"$db\""
          fi
        done
    networks: [data]
  # Development publishes only loopback ports. Caddy is opt-in through profile edge.
  domain_db:
    ports:
      - "127.0.0.1:${PORT_DOMAIN_DB:-5435}:5432"

  profile_service:
    depends_on:
      domain_db_bootstrap: { condition: service_completed_successfully }
    ports: ["127.0.0.1:${PORT_PROFILE:-8091}:8091"]
  media_service:
    depends_on:
      domain_db_bootstrap: { condition: service_completed_successfully }
    ports: ["127.0.0.1:${PORT_MEDIA:-8092}:8092"]
  news_service:
    depends_on:
      domain_db_bootstrap: { condition: service_completed_successfully }
    ports: ["127.0.0.1:${PORT_NEWS:-8093}:8093"]
  order_service:
    depends_on:
      domain_db_bootstrap: { condition: service_completed_successfully }
    ports: ["127.0.0.1:${PORT_ORDER:-8094}:8094"]
  payment_service:
    depends_on:
      domain_db_bootstrap: { condition: service_completed_successfully }
    ports: ["127.0.0.1:${PORT_PAYMENT:-8095}:8095"]
  promotion_service:
    depends_on:
      domain_db_bootstrap: { condition: service_completed_successfully }
    ports: ["127.0.0.1:${PORT_PROMOTION:-8096}:8096"]
  crm_service:
    depends_on:
      domain_db_bootstrap: { condition: service_completed_successfully }
    ports: ["127.0.0.1:${PORT_CRM_SERVICE:-8097}:8097"]
  communication_service:
    depends_on:
      domain_db_bootstrap: { condition: service_completed_successfully }
    ports: ["127.0.0.1:${PORT_COMMUNICATION:-8098}:8098"]
  trust_service:
    depends_on:
      domain_db_bootstrap: { condition: service_completed_successfully }
    ports: ["127.0.0.1:${PORT_TRUST:-8099}:8099"]

  support_service:
    depends_on:
      domain_db_bootstrap: { condition: service_completed_successfully }
    ports: ["127.0.0.1:${PORT_SUPPORT:-8100}:8100"]
  review_service:
    depends_on:
      domain_db_bootstrap: { condition: service_completed_successfully }
    ports: ["127.0.0.1:${PORT_REVIEW:-8101}:8101"]

  identity_db:
    ports:
      - "127.0.0.1:${PORT_IDENTITY_DB:-5432}:5432"

  community_db:
    ports:
      - "127.0.0.1:${PORT_COMMUNITY_DB:-5433}:5432"

  marketplace_db:
    ports:
      - "127.0.0.1:${PORT_MARKETPLACE_DB:-5434}:5432"

  redis_cache:
    ports:
      - "127.0.0.1:${PORT_REDIS:-6379}:6379"

  rabbitmq:
    ports:
      - "127.0.0.1:${PORT_RABBITMQ:-5672}:5672"
      - "127.0.0.1:${PORT_RABBITMQ_UI:-15672}:15672"
    # `rabbitmq-diagnostics ping` only proves the Erlang runtime/CLI is alive.
    # Downstream services need the AMQP listener to be accepting connections.
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  scylla_db:
    ports:
      - "127.0.0.1:${PORT_SCYLLA:-9042}:9042"

  meilisearch:
    ports:
      - "127.0.0.1:${PORT_MEILI:-7700}:7700"

  minio:
    ports:
      - "127.0.0.1:${PORT_MINIO_API:-9002}:9002"
      - "127.0.0.1:${PORT_MINIO_UI:-9005}:9001"

  identity_service:
    depends_on:
      rabbitmq: { condition: service_healthy }
    environment:
      ENV: development
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "127.0.0.1:${PORT_IDENTITY:-8080}:8080"

  marketplace_service:
    depends_on:
      rabbitmq: { condition: service_healthy }
    environment:
      ENV: development
      RUST_LOG: ${RUST_LOG:-info}
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
      ORDER_ENGINE_API_ENABLED: ${ORDER_ENGINE_API_ENABLED:-false}
      WALLET_DEFAULT_ENV: development
      WALLET_LIVE_ENABLED: "false"
      WALLET_DEV_AUTO_SETTLE: ${WALLET_DEV_AUTO_SETTLE:-true}
      WALLET_ALLOW_LIVE_IN_NON_PROD: "false"
      WALLET_ALLOW_MOCK_IN_LIVE: "false"
    ports:
      - "127.0.0.1:${PORT_MARKETPLACE:-8081}:8081"

  community_service:
    depends_on:
      rabbitmq: { condition: service_healthy }
    environment:
      ENV: development
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "127.0.0.1:${PORT_COMMUNITY:-8082}:8082"

  chat_service:
    environment:
      # The development stack intentionally uses the same HS256 contract as the
      # identity service. The chat runtime only permits this when ENV=development.
      ENV: development
      PHX_HOST: ${PHX_HOST:-localhost}
      JWT_ACCESS_ALG: ${JWT_ACCESS_ALG:-HS256}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "127.0.0.1:${PORT_CHAT:-4000}:4000"

  ai_service:
    ports:
      - "127.0.0.1:${PORT_AI_SERVICE:-8084}:8080"

  ocr_service:
    ports:
      - "127.0.0.1:${PORT_OCR:-8001}:8000"

  liveness_service:
    ports:
      - "127.0.0.1:${PORT_LIVENESS:-8002}:8000"

  ollama:
    ports:
      - "127.0.0.1:${PORT_OLLAMA:-11434}:11434"

  www:
    environment:
      ENV: development
      APP_ENV: development
      NODE_ENV: production
      NEXT_PUBLIC_APP_ENV: development
      # Leave callback empty by default so public tunnel requests derive the
      # callback from their trusted www.lajukan.com origin. Explicit local
      # development may still set this variable to a localhost callback.
      WWW_GOOGLE_REDIRECT_URI: ${WWW_GOOGLE_REDIRECT_URI:-}
    ports:
      - "127.0.0.1:${PORT_FRONTEND:-3000}:3000"

  # Backoffice remains available, but it is not part of the lightweight core
  # development stack. This preserves the pre-refactor startup contract and
  # avoids building three extra Next.js applications when working on WWW/API.
  cms:
    profiles: [backoffice]
    environment:
      ENV: development
      APP_ENV: development
      NODE_ENV: production
      NEXT_PUBLIC_APP_ENV: development
    ports:
      - "127.0.0.1:${PORT_CMS:-3001}:3001"

  crm:
    profiles: [backoffice]
    environment:
      ENV: development
      APP_ENV: development
      NODE_ENV: production
      NEXT_PUBLIC_APP_ENV: development
    ports:
      - "127.0.0.1:${PORT_CRM:-3002}:3002"

  usaha:
    profiles: [backoffice]
    environment:
      ENV: development
      APP_ENV: development
      NODE_ENV: production
      NEXT_PUBLIC_APP_ENV: development
      INTERNAL_API_URL: http://identity_service:8080
      INTERNAL_IDENTITY_URL: http://identity_service:8080
      INTERNAL_MARKETPLACE_URL: http://marketplace_service:8081
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Same contract as WWW: public tunnel traffic derives the callback from
      # usaha.lajukan.com unless an explicit matching callback is supplied.
      USAHA_GOOGLE_REDIRECT_URI: ${USAHA_GOOGLE_REDIRECT_URI:-}
    ports:
      - "127.0.0.1:${PORT_USAHA:-3003}:3003"

  caddy:
    profiles: [edge, tunnel]
    depends_on: !override
      www: { condition: service_started }
    ports: !override
      - "127.0.0.1:${PORT_CADDY_HTTP:-80}:80"
      - "127.0.0.1:${PORT_CADDY_HTTPS:-443}:443"
    networks: !override [edge, app, media]

  cloudflared:
    ports:
      - "127.0.0.1:${PORT_CLOUDFLARED_METRICS:-2000}:2000"

  # Local email/OTP flows expect SMTP_HOST=mailhog. Keep MailHog in the default
  # development stack; production/staging still inherit the base profile gate.
  mailhog:
    profiles: !reset []
    ports:
      - "127.0.0.1:${PORT_MAILHOG_SMTP:-1025}:1025"
      - "127.0.0.1:${PORT_MAILHOG_UI:-8025}:8025"
