services:
  # Development publishes only loopback ports. Caddy is opt-in through profile edge.
  identity_db:
    ports:
      - "127.0.0.1:${PORT_IDENTITY_DB:-5432}:5432"

  community_db:
    ports:
      - "127.0.0.1:${PORT_COMMUNITY_DB:-5433}:5432"

  marketplace_db:
    ports:
      - "127.0.0.1:${PORT_MARKETPLACE_DB:-5434}:5432"

  redis_cache:
    ports:
      - "127.0.0.1:${PORT_REDIS:-6379}:6379"

  rabbitmq:
    ports:
      - "127.0.0.1:${PORT_RABBITMQ:-5672}:5672"
      - "127.0.0.1:${PORT_RABBITMQ_UI:-15672}:15672"

  scylla_db:
    ports:
      - "127.0.0.1:${PORT_SCYLLA:-9042}:9042"

  meilisearch:
    ports:
      - "127.0.0.1:${PORT_MEILI:-7700}:7700"

  minio:
    ports:
      - "127.0.0.1:${PORT_MINIO_API:-9002}:9002"
      - "127.0.0.1:${PORT_MINIO_UI:-9005}:9001"

  identity_service:
    environment:
      ENV: development
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "127.0.0.1:${PORT_IDENTITY:-8080}:8080"

  marketplace_service:
    environment:
      ENV: development
      RUST_LOG: ${RUST_LOG:-info}
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
      ORDER_ENGINE_API_ENABLED: ${ORDER_ENGINE_API_ENABLED:-false}
      WALLET_DEFAULT_ENV: development
      WALLET_LIVE_ENABLED: "false"
      WALLET_DEV_AUTO_SETTLE: ${WALLET_DEV_AUTO_SETTLE:-true}
      WALLET_ALLOW_LIVE_IN_NON_PROD: "false"
      WALLET_ALLOW_MOCK_IN_LIVE: "false"
    ports:
      - "127.0.0.1:${PORT_MARKETPLACE:-8081}:8081"

  community_service:
    environment:
      ENV: development
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "127.0.0.1:${PORT_COMMUNITY:-8082}:8082"

  chat_service:
    environment:
      ENV: development
      PHX_HOST: localhost
    ports:
      - "127.0.0.1:${PORT_CHAT:-4000}:4000"

  ai_service:
    ports:
      - "127.0.0.1:${PORT_AI_SERVICE:-8084}:8080"

  ocr_service:
    ports:
      - "127.0.0.1:${PORT_OCR:-8001}:8000"

  liveness_service:
    ports:
      - "127.0.0.1:${PORT_LIVENESS:-8002}:8000"

  ollama:
    ports:
      - "127.0.0.1:${PORT_OLLAMA:-11434}:11434"

  www:
    build:
      args:
        NEXT_PUBLIC_APP_ENV: development
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_WWW_URL: ${NEXT_PUBLIC_WWW_URL:-http://localhost:3000}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_MARKETPLACE_URL: ${NEXT_PUBLIC_MARKETPLACE_URL:-http://localhost:8081}
        NEXT_PUBLIC_COMMUNITY_URL: ${NEXT_PUBLIC_COMMUNITY_URL:-http://localhost:8082}
        NEXT_PUBLIC_CHAT_WS_URL: ${NEXT_PUBLIC_CHAT_WS_URL:-ws://localhost:4000/socket}
        NEXT_PUBLIC_MARKETPLACE_WS_URL: ${NEXT_PUBLIC_MARKETPLACE_WS_URL:-}
        NEXT_PUBLIC_NOTIFICATION_WS_URL: ${NEXT_PUBLIC_NOTIFICATION_WS_URL:-}
        NEXT_PUBLIC_LOGIN_OTP_REQUIRED: ${NEXT_PUBLIC_LOGIN_OTP_REQUIRED:-true}
        NEXT_PUBLIC_IMAGE_AI_ASSIST_ENABLED: ${NEXT_PUBLIC_IMAGE_AI_ASSIST_ENABLED:-false}
        NEXT_PUBLIC_DISABLE_PWA: ${NEXT_PUBLIC_DISABLE_PWA:-true}
        NEXT_PUBLIC_CAPTCHA_PROVIDER: ${NEXT_PUBLIC_CAPTCHA_PROVIDER:-turnstile}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_HCAPTCHA_SITE_KEY: ${NEXT_PUBLIC_HCAPTCHA_SITE_KEY:-}
        NEXT_PUBLIC_STUN_URLS: ${NEXT_PUBLIC_STUN_URLS:-stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302}
        NEXT_PUBLIC_TURN_URLS: ${NEXT_PUBLIC_TURN_URLS:-}
    environment:
      ENV: development
      APP_ENV: development
      NODE_ENV: production
      NEXT_PUBLIC_APP_ENV: development
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3000/api/auth/google/callback}
    ports:
      - "127.0.0.1:${PORT_FRONTEND:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Internal backoffice remains opt-in for lightweight development.
  cms:
    profiles: [backoffice]
    build:
      args:
        NEXT_PUBLIC_APP_ENV: development
        NEXT_PUBLIC_WWW_URL: ${NEXT_PUBLIC_WWW_URL:-http://localhost:3000}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8081}
    environment:
      ENV: development
      APP_ENV: development
      NODE_ENV: production
      NEXT_PUBLIC_APP_ENV: development
    ports:
      - "127.0.0.1:${PORT_CMS:-3001}:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  crm:
    profiles: [backoffice]
    build:
      args:
        NEXT_PUBLIC_APP_ENV: development
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8081}
        NEXT_PUBLIC_IDENTITY_API_URL: /api/identity
        NEXT_PUBLIC_WWW_URL: ${NEXT_PUBLIC_WWW_URL:-http://localhost:3000}
        NEXT_PUBLIC_CRM_URL: ${NEXT_PUBLIC_CRM_URL:-http://localhost:3002}
        NEXT_PUBLIC_MARKETPLACE_URL: ${NEXT_PUBLIC_MARKETPLACE_URL:-http://localhost:8081}
        NEXT_PUBLIC_USAHA_URL: ${NEXT_PUBLIC_USAHA_URL:-http://localhost:3003}
    environment:
      ENV: development
      APP_ENV: development
      NODE_ENV: production
      NEXT_PUBLIC_APP_ENV: development
    ports:
      - "127.0.0.1:${PORT_CRM:-3002}:3002"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Usaha is a customer-facing Business OS surface, so it belongs to the
  # default development product stack instead of the internal backoffice profile.
  usaha:
    profiles: !reset []
    build:
      args:
        NEXT_PUBLIC_APP_ENV: development
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_USAHA_URL:-http://localhost:3003}
        NEXT_PUBLIC_WWW_URL: ${NEXT_PUBLIC_WWW_URL:-http://localhost:3000}
        NEXT_PUBLIC_USAHA_URL: ${NEXT_PUBLIC_USAHA_URL:-http://localhost:3003}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_MARKETPLACE_URL: ${NEXT_PUBLIC_MARKETPLACE_URL:-http://localhost:8081}
        NEXT_PUBLIC_COMMUNITY_URL: ${NEXT_PUBLIC_COMMUNITY_URL:-http://localhost:8082}
    environment:
      ENV: development
      APP_ENV: development
      NODE_ENV: production
      NEXT_PUBLIC_APP_ENV: development
    ports:
      - "127.0.0.1:${PORT_USAHA:-3003}:3003"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  caddy:
    profiles: [edge, tunnel]
    depends_on: !override
      www: { condition: service_healthy }
      usaha: { condition: service_healthy }
    ports: !override
      - "127.0.0.1:${PORT_CADDY_HTTP:-80}:80"
      - "127.0.0.1:${PORT_CADDY_HTTPS:-443}:443"

  cloudflared:
    ports:
      - "127.0.0.1:${PORT_CLOUDFLARED_METRICS:-2000}:2000"

  # Local email/OTP flows expect SMTP_HOST=mailhog. Keep MailHog in the default
  # development stack; production/staging still inherit the base profile gate.
  mailhog:
    profiles: !reset []
    ports:
      - "127.0.0.1:${PORT_MAILHOG_SMTP:-1025}:1025"
      - "127.0.0.1:${PORT_MAILHOG_UI:-8025}:8025"
