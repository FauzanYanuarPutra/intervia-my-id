services:
  # Development publishes only loopback ports. Caddy is opt-in through profile edge.
  identity_db:
    ports:
      - "127.0.0.1:${PORT_IDENTITY_DB:-5432}:5432"

  community_db:
    ports:
      - "127.0.0.1:${PORT_COMMUNITY_DB:-5433}:5432"

  marketplace_db:
    ports:
      - "127.0.0.1:${PORT_MARKETPLACE_DB:-5434}:5432"

  redis_cache:
    ports:
      - "127.0.0.1:${PORT_REDIS:-6379}:6379"

  rabbitmq:
    ports:
      - "127.0.0.1:${PORT_RABBITMQ:-5672}:5672"
      - "127.0.0.1:${PORT_RABBITMQ_UI:-15672}:15672"

  scylla_db:
    ports:
      - "127.0.0.1:${PORT_SCYLLA:-9042}:9042"

  meilisearch:
    ports:
      - "127.0.0.1:${PORT_MEILI:-7700}:7700"

  minio:
    ports:
      - "127.0.0.1:${PORT_MINIO_API:-9002}:9002"
      - "127.0.0.1:${PORT_MINIO_UI:-9005}:9001"

  identity_service:
    environment:
      ENV: development
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "127.0.0.1:${PORT_IDENTITY:-8080}:8080"

  marketplace_service:
    environment:
      ENV: development
      RUST_LOG: ${RUST_LOG:-info}
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
      ORDER_ENGINE_API_ENABLED: ${ORDER_ENGINE_API_ENABLED:-false}
      WALLET_DEFAULT_ENV: development
      WALLET_LIVE_ENABLED: "false"
      WALLET_DEV_AUTO_SETTLE: ${WALLET_DEV_AUTO_SETTLE:-true}
      WALLET_ALLOW_LIVE_IN_NON_PROD: "false"
      WALLET_ALLOW_MOCK_IN_LIVE: "false"
    ports:
      - "127.0.0.1:${PORT_MARKETPLACE:-8081}:8081"

  community_service:
    environment:
      ENV: development
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "127.0.0.1:${PORT_COMMUNITY:-8082}:8082"

  chat_service:
    environment:
      ENV: development
      PHX_HOST: localhost
    ports:
      - "127.0.0.1:${PORT_CHAT:-4000}:4000"

  ai_service:
    ports:
      - "127.0.0.1:${PORT_AI_SERVICE:-8084}:8080"

  ocr_service:
    ports:
      - "127.0.0.1:${PORT_OCR:-8001}:8000"

  liveness_service:
    ports:
      - "127.0.0.1:${PORT_LIVENESS:-8002}:8000"

  ollama:
    ports:
      - "127.0.0.1:${PORT_OLLAMA:-11434}:11434"

  www:
    environment:
      ENV: development
      APP_ENV: development
      NODE_ENV: production
      NEXT_PUBLIC_APP_ENV: development
    ports:
      - "127.0.0.1:${PORT_FRONTEND:-3000}:3000"

  cms:
    environment:
      ENV: development
      APP_ENV: development
      NODE_ENV: production
      NEXT_PUBLIC_APP_ENV: development
    ports:
      - "127.0.0.1:${PORT_CMS:-3001}:3001"

  crm:
    environment:
      ENV: development
      APP_ENV: development
      NODE_ENV: production
      NEXT_PUBLIC_APP_ENV: development
    ports:
      - "127.0.0.1:${PORT_CRM:-3002}:3002"

  usaha:
    environment:
      ENV: development
      APP_ENV: development
      NODE_ENV: production
      NEXT_PUBLIC_APP_ENV: development
    ports:
      - "127.0.0.1:${PORT_USAHA:-3003}:3003"

  caddy:
    profiles: [edge]

  mailhog:
    ports:
      - "127.0.0.1:${PORT_MAILHOG_SMTP:-1025}:1025"
      - "127.0.0.1:${PORT_MAILHOG_UI:-8025}:8025"
