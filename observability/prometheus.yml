global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "node"
    static_configs:
      - targets: ["node_exporter:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "identity_service"
    static_configs:
      - targets: ["identity_service:8080"]

  - job_name: "marketplace_service"
    static_configs:
      - targets: ["marketplace_service:8081"]

  - job_name: "community_service"
    static_configs:
      - targets: ["community_service:8082"]

  - job_name: "chat_service"
    static_configs:
      - targets: ["chat_service:4000"]