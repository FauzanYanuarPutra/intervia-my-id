[package]
name = "ai_service"
version = "0.1.0"
edition = "2021"

[dependencies]
# Axum butuh feature "multipart" untuk membaca file upload
axum = { version = "0.7", features = ["multipart"] }
# Tokio butuh feature "full" untuk menjalankan async/await
tokio = { version = "1.0", features = ["full"] }
# Reqwest butuh feature "multipart" untuk mengirim file ke service Python
# dan "json" untuk membaca response JSON
reqwest = { version = "0.11", features = ["json", "multipart"] }
# Serde untuk serialisasi data
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Bytes untuk mengelola data gambar dalam memori
bytes = "1.0"
# Tower-http untuk CORS
tower-http = { version = "0.5", features = ["cors"] }
# Tracing untuk logging
tracing = "0.1"
tracing-subscriber = "0.3"