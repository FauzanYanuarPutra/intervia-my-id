# Optional high-availability data-plane overlay.
# Use with docker-compose.yml + docker-compose.prod.yml only after external
# stateful services and failover procedures have been tested.
services:
  identity_db:
    profiles: [local-data]
  marketplace_db:
    profiles: [local-data]
  community_db:
    profiles: [local-data]
  redis_cache:
    profiles: [local-data]
  rabbitmq:
    profiles: [local-data]
  minio:
    profiles: [local-data]
  meilisearch:
    profiles: [local-data]

  identity_service:
    environment:
      IDENTITY_DATABASE_URL: ${HA_IDENTITY_DATABASE_URL:?HA_IDENTITY_DATABASE_URL is required}
      REDIS_URL: ${HA_REDIS_URL:?HA_REDIS_URL is required}
      RABBITMQ_URL: ${HA_RABBITMQ_URL:?HA_RABBITMQ_URL is required}
    depends_on: !override []

  marketplace_service:
    environment:
      MARKETPLACE_DATABASE_URL: ${HA_MARKETPLACE_DATABASE_URL:?HA_MARKETPLACE_DATABASE_URL is required}
      REDIS_URL: ${HA_REDIS_URL:?HA_REDIS_URL is required}
      RABBITMQ_URL: ${HA_RABBITMQ_URL:?HA_RABBITMQ_URL is required}
      MEILI_URL: ${HA_MEILI_URL:?HA_MEILI_URL is required}
      MEILI_MASTER_KEY: ${HA_MEILI_MASTER_KEY:?HA_MEILI_MASTER_KEY is required}
    depends_on: !override []

  community_service:
    environment:
      COMMUNITY_DATABASE_URL: ${HA_COMMUNITY_DATABASE_URL:?HA_COMMUNITY_DATABASE_URL is required}
      REDIS_URL: ${HA_REDIS_URL:?HA_REDIS_URL is required}
      RABBITMQ_URL: ${HA_RABBITMQ_URL:?HA_RABBITMQ_URL is required}
    depends_on: !override []
    volumes: !override
      - ${HA_COMMUNITY_MEDIA_MOUNT:?HA_COMMUNITY_MEDIA_MOUNT is required}:/app/uploads/forum

  chat_service:
    environment:
      REDIS_HOST: ${HA_REDIS_HOST:?HA_REDIS_HOST is required}
      REDIS_PASSWORD: ${HA_REDIS_PASSWORD:?HA_REDIS_PASSWORD is required}
      RABBITMQ_URL: ${HA_RABBITMQ_URL:?HA_RABBITMQ_URL is required}
    depends_on: !override
      scylla_migrate: { condition: service_completed_successfully }

  www:
    environment:
      REDIS_URL: ${HA_REDIS_URL:?HA_REDIS_URL is required}
      MINIO_ENDPOINT: ${HA_OBJECT_STORAGE_ENDPOINT:?HA_OBJECT_STORAGE_ENDPOINT is required}
      MINIO_ACCESS_KEY: ${HA_OBJECT_STORAGE_ACCESS_KEY:?HA_OBJECT_STORAGE_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${HA_OBJECT_STORAGE_SECRET_KEY:?HA_OBJECT_STORAGE_SECRET_KEY is required}
      MINIO_BUCKET: ${HA_OBJECT_STORAGE_BUCKET:?HA_OBJECT_STORAGE_BUCKET is required}
      MINIO_PUBLIC_URL: ${HA_OBJECT_STORAGE_PUBLIC_URL:?HA_OBJECT_STORAGE_PUBLIC_URL is required}
    volumes: !override []
