name: lajukan_webview
description: "Lajukan mobile app shell for Android and iOS."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  camera: ^0.11.0+2
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  permission_handler: ^11.4.0
  url_launcher: ^6.3.0
  webview_flutter: ^4.8.0
  webview_flutter_android: ^4.10.13

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "../../../www/public/favicon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#079455"
