services:
  identity_service:
    image: ${DOCKERHUB_NAMESPACE}/lajukan-identity:${IMAGE_TAG:-staging}
    environment:
      ENV: staging
      APP_ENV: staging
      RUST_LOG: ${RUST_LOG:-info}

  marketplace_service:
    image: ${DOCKERHUB_NAMESPACE}/lajukan-marketplace:${IMAGE_TAG:-staging}
    environment:
      ENV: staging
      APP_ENV: staging

  community_service:
    image: ${DOCKERHUB_NAMESPACE}/lajukan-community:${IMAGE_TAG:-staging}
    environment:
      ENV: staging
      APP_ENV: staging
      APP_PORT: "8082"
      COMMUNITY_UPLOAD_DIR: /app/uploads/forum
      COMMUNITY_MEDIA_PUBLIC_PATH: /api/forum/media

  ai_service:
    image: ${DOCKERHUB_NAMESPACE}/lajukan-ai:${IMAGE_TAG:-staging}
    environment:
      ENV: staging
      APP_ENV: staging

  chat_service:
    image: ${DOCKERHUB_NAMESPACE}/lajukan-chat:${IMAGE_TAG:-staging}
    environment:
      ENV: staging
      APP_ENV: staging

  ocr_service:
    image: ${DOCKERHUB_NAMESPACE}/lajukan-ocr:${IMAGE_TAG:-staging}

  liveness_service:
    image: ${DOCKERHUB_NAMESPACE}/lajukan-liveness:${IMAGE_TAG:-staging}

  www:
    image: ${DOCKERHUB_NAMESPACE}/lajukan-www:${IMAGE_TAG:-staging}
    environment:
      ENV: staging
      APP_ENV: staging
      NODE_ENV: production
      NEXT_PUBLIC_APP_ENV: staging
      INTERNAL_COMMUNITY_URL: http://community_service:8082
      COMMUNITY_SERVICE_URL: http://community_service:8082

  usaha:
    image: ${DOCKERHUB_NAMESPACE}/lajukan-usaha:${IMAGE_TAG:-staging}
    environment:
      ENV: staging
      APP_ENV: staging
      NODE_ENV: production
      NEXT_PUBLIC_APP_ENV: staging
      INTERNAL_COMMUNITY_URL: http://community_service:8082
      COMMUNITY_SERVICE_URL: http://community_service:8082

  cms:
    image: ${DOCKERHUB_NAMESPACE}/lajukan-cms:${IMAGE_TAG:-staging}
    environment:
      NODE_ENV: production

  crm:
    image: ${DOCKERHUB_NAMESPACE}/lajukan-crm:${IMAGE_TAG:-staging}
    environment:
      NODE_ENV: production
